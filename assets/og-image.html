<!doctype html>
<!--
  Source for demo/og-image.png (1200x630 at device scale 2 = 2400x1260).
  Render with headless Chrome from the repository root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
      --screenshot=demo/og-image.png "file://$PWD/assets/og-image.html"

  Numbers must match demo/proof/large-java-2026-08-31-main.json and the site copy.
-->
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#07090b;--surface:#0e1215;--text:#e8edf0;--muted:#a7b1b9;--soft:#7f8b95;--line:#1b2228;--line2:#28323a;--accent:#3ce3c1;--grid:rgba(232,237,240,.045);
--mono:"JetBrains Mono",Menlo,monospace;--sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;--display:"Bricolage Grotesque",sans-serif}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 85% 75% at 50% 0%,black 25%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 0%,black 25%,transparent 80%)}
.scan{position:absolute;left:0;right:0;top:500px;height:1px;background:linear-gradient(90deg,transparent 5%,var(--accent) 50%,transparent 95%);opacity:.35}
.wrap{position:absolute;left:80px;right:80px;top:64px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:108px;line-height:.94;letter-spacing:-.045em;margin:52px 0 30px}
.grad{color:var(--accent)}
.lead{font-size:25px;line-height:1.42;color:var(--muted);max-width:960px;margin:0;font-weight:400}
.lead b{color:var(--text);font-weight:600}
.chips{position:absolute;left:80px;top:548px;display:flex;gap:12px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:12px 18px;font:15px var(--mono);color:var(--muted)}
.chip b{color:var(--accent);font-weight:700}
</style></head><body>
<div class="grid"></div><div class="scan"></div>
<div class="wrap">
<div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="26" ry="15.5" fill="none" stroke="currentColor" stroke-width="3.4"/><path d="M25.5 24.5 18 32l7.5 7.5M38.5 24.5 46 32l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="3.1" fill="currentColor"/></svg><span>Open Kioku</span></div>
<h1><span class="grad">Evidence</span><br>before edits.</h1>
<p class="lead">Your coding agent <b>shows its evidence</b> before it edits, and its diff is <b>verified against the plan</b> it declared. Local-first; nothing leaves your machine.</p>
</div>
<div class="chips"><div class="chip"><b>0.02–0.05s</b> exact lookup</div><div class="chip"><b>1.52M</b> proof-typed edges</div><div class="chip"><b>100%</b> local · no source upload</div></div>
</body></html>
