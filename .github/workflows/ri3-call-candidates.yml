name: RI3 call candidates

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply staged call-candidate repair
        run: python3 scripts/ri3_fix_call_candidates_tmp.py

      - name: Validate proof-gated call discovery
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution

      - name: Commit validated call discovery and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-call-candidates.yml \
            scripts/ri3_fix_call_candidates_tmp.py
          git add \
            crates/open-kioku-resolution/src/call_candidates.rs \
            crates/open-kioku-resolution/src/lib.rs \
            crates/open-kioku-resolution/src/pipeline.rs
          git commit -m "ri3: add proof-gated call candidate discovery"
          git push origin HEAD:agent/ri3-proof-gated-resolution
