# Temporary V3 live-status probe. Do not merge.
name: V3 release publication monitor

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v3-release-monitor.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report latest exact-tag release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          tag_sha = subprocess.check_output(['git', 'rev-list', '-n', '1', 'v3.0.0'], text=True).strip()
          api = f'https://api.github.com/repos/{repo}'
          req = urllib.request.Request(
              api + '/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=30',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'open-kioku-v3-live-status-probe',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          matches = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == tag_sha and run.get('event') == 'workflow_dispatch'
          ]
          if not matches:
              raise SystemExit(f'no workflow_dispatch release run found for {tag_sha}')
          run = max(matches, key=lambda item: item['id'])
          print(json.dumps({
              'id': run['id'],
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'head_sha': run.get('head_sha'),
              'url': run.get('html_url'),
          }, sort_keys=True))
          PY
