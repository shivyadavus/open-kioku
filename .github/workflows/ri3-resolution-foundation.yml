name: RI3 resolution foundation

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Format and validate resolution foundation
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution

      - name: Commit validated foundation and remove helper
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-resolution-foundation.yml
          git add \
            crates/open-kioku-resolution/src/lib.rs \
            crates/open-kioku-resolution/src/index.rs \
            crates/open-kioku-resolution/src/pipeline.rs
          git commit -m "ri3: validate deterministic proof-gated candidate pipeline"
          git push origin HEAD:agent/ri3-proof-gated-resolution
