name: RI3 incremental relationship equivalence

on:
  push:
    branches:
      - agent/ri3-permanent-gates
    paths:
      - .github/workflows/ri3-incremental-test.yml
      - scripts/ri3-incremental-stage.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-permanent-gates
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Add incremental vs clean graph regression
        run: |
          set -euo pipefail
          python3 scripts/ri3-incremental-stage.py
          cargo fmt --all
      - name: Validate incremental relationship equivalence
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-watch --all-targets -- -D warnings
          cargo test -p open-kioku-watch incremental_relationship_graph_matches_clean_final_rebuild -- --nocapture
      - name: Commit regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-watch/src/lib.rs
          git commit -m "test(ri3): compare incremental and clean relationship graphs"
          git push origin HEAD:agent/ri3-permanent-gates
