# One-shot V3 candidate gate for supported release platforms.
name: V3 mainline candidate

on:
  push:
    branches:
      - release/v3.0.0-mainline
    paths:
      - .github/workflows/v3-mainline-candidate.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0-mainline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Synchronize current main into release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main release/v3.0.0-mainline

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "release candidate already contains current main"
          else
            set +e
            git merge --no-ff --no-commit origin/main
            merge_status=$?
            set -e

            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              allowed_conflicts=(
                "Cargo.lock"
                "crates/open-kioku-mcp/Cargo.toml"
                "crates/open-kioku-tree-sitter/Cargo.toml"
                "crates/open-kioku-watch/Cargo.toml"
              )

              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo "merge failed without inspectable conflicts" >&2
                git merge --abort || true
                exit 1
              fi

              for conflict in "${conflicts[@]}"; do
                allowed=false
                for expected in "${allowed_conflicts[@]}"; do
                  if [ "$conflict" = "$expected" ]; then
                    allowed=true
                    break
                  fi
                done
                if [ "$allowed" != true ]; then
                  echo "unexpected mainline merge conflict: $conflict" >&2
                  git merge --abort || true
                  exit 1
                fi
                git checkout --theirs -- "$conflict"
                git add "$conflict"
              done
            fi

            # The release branch owns the V3 version contract. Resolve Cargo
            # conflicts from main first, then deterministically re-apply the V3
            # workspace dependency versions and regenerate the lockfile.
            scripts/sync-version.sh
            cargo generate-lockfile
            git add -A
            git diff --cached --check
            git commit -m "Merge current main into v3 release candidate"
            git push origin HEAD:release/v3.0.0-mainline
          fi
      - name: Validate candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^\[workspace.package\]/{f=1;next} f && /^version = /{gsub(/\"/,"",$3); print $3; exit}' Cargo.toml)" = "3.0.0"
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all -- --check
          scripts/validate-docs.sh
          scripts/validate-versions.sh
          scripts/check-no-ignored-tests.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Pin source
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ok-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zlib1g-dev libgomp1
      - name: Build candidate
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p open-kioku-cli
      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.binary_name }}
          path: dist/*

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify candidate source is still branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/v3.0.0-mainline
          branch_tip="$(git rev-parse origin/release/v3.0.0-mainline)"
          candidate_sha="${{ needs.prepare.outputs.candidate_sha }}"
          if [ "$branch_tip" != "$candidate_sha" ]; then
            echo "release candidate moved during build: expected $candidate_sha, found $branch_tip" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Pin exact artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          def sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          metadata_path=Path('release-metadata.json')
          metadata=json.loads(metadata_path.read_text())
          hashes={}
          for artifact in metadata['artifacts']:
              if 'sha256' not in artifact:
                  continue
              binary=Path('dist')/artifact['name']
              if not binary.is_file():
                  raise SystemExit(f'missing candidate binary: {binary}')
              artifact['sha256']=sha256(binary)
              hashes[artifact['name']]=artifact['sha256']
          metadata_path.write_text(json.dumps(metadata, indent=2)+'\n')
          formula=Path('Formula/open-kioku.rb')
          text=formula.read_text()
          for name in ['ok-macos-arm64','ok-linux-arm64','ok-linux-x86_64']:
              pattern=re.compile(rf'(url "[^"]*/{re.escape(name)}"\n\s+sha256 ")[0-9a-f]{{64}}(")')
              text,count=pattern.subn(rf'\g<1>{hashes[name]}\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'Formula hash anchor missing for {name}')
          formula.write_text(text)
          PY
          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh

          # The hash-pinning step intentionally dirties exactly these two files.
          # Preserve publish-crates.sh's clean-tree safety contract by proving
          # there are no other edits before opting into its dry-run allowance.
          mapfile -t dirty_files < <(git status --porcelain=v1 | cut -c4- | sort)
          expected_dirty=("Formula/open-kioku.rb" "release-metadata.json")
          if [ "${dirty_files[*]}" != "${expected_dirty[*]}" ]; then
            echo "unexpected dirty files before publish dry-run:" >&2
            printf '  %s\n' "${dirty_files[@]}" >&2
            exit 1
          fi
          PUBLISH_ALLOW_DIRTY=1 EXPECTED_VERSION=3.0.0 scripts/publish-crates.sh --dry-run
          scripts/verify-release-readiness.sh
          scripts/generate-release-trust-artifacts.sh dist
          git diff --check
      - name: Commit hashes and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m "release: pin v3.0.0 candidate artifact hashes"
          git rm .github/workflows/v3-mainline-candidate.yml
          git commit -m "chore: remove v3 mainline candidate gate"
          git push origin HEAD:release/v3.0.0-mainline
