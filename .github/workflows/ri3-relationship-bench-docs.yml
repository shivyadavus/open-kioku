name: RI3 relationship benchmark docs

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Apply command inventory update
        run: python3 scripts/ri3_relationship_bench_docs_tmp.py

      - name: Validate docs and CLI contract
        run: |
          chmod +x scripts/validate-docs.sh
          scripts/validate-docs.sh
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli

      - name: Commit validated docs and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-relationship-bench-docs.yml \
            scripts/ri3_relationship_bench_docs_tmp.py
          git add README.md
          git commit -m "docs: inventory relationship benchmark command"
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
