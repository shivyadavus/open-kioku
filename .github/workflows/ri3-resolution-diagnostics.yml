name: RI3 resolution diagnostics

on:
  push:
    branches:
      - agent/ri3-resolution-foundation
    paths:
      - scripts/ri3_resolution_diagnostics_tmp.py
      - .github/workflows/ri3-resolution-diagnostics.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply persisted diagnostics slice
        run: python3 scripts/ri3_resolution_diagnostics_tmp.py
      - name: Validate persisted diagnostics contract
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-core -p open-kioku-ingest -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-core ri3_resolution_quality_core_tests
          cargo test -p open-kioku-cli ri3_resolution_diagnostics_tests
          git diff --check
      - name: Commit validated diagnostics and self-clean
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/open-kioku-core/src/lib.rs crates/open-kioku-ingest/src/lib.rs crates/open-kioku-cli/src/commands/mod.rs crates/open-kioku-cli/src/lib.rs
          git diff --cached --quiet && { echo "expected diagnostics product changes missing" >&2; exit 1; }
          git commit -m "feat: persist RI3 relationship resolution diagnostics"
          git rm scripts/ri3_resolution_diagnostics_tmp.py .github/workflows/ri3-resolution-diagnostics.yml
          git commit -m "chore: remove RI3 resolution diagnostics gate"
          git push origin HEAD:agent/ri3-resolution-foundation
