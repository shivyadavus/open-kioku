name: RI3 proof transport

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0

      - name: Apply current proof transport patch
        run: |
          python3 -m py_compile scripts/ri3_proof_transport_tmp.py scripts/ri3_proof_transport_test_fix_tmp.py scripts/ri3_proof_transport_fmt_tmp.py
          python3 scripts/ri3_proof_transport_tmp.py
          python3 scripts/ri3_proof_transport_test_fix_tmp.py
          python3 scripts/ri3_proof_transport_fmt_tmp.py

      - name: Validate trust boundary
        run: |
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated production change
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- Cargo.lock
          rm -rf scripts/__pycache__
          git rm -f \
            .github/workflows/ri3-proof-transport.yml \
            scripts/ri3_proof_transport_tmp.py \
            scripts/ri3_proof_transport_test_fix_tmp.py \
            scripts/ri3_proof_transport_fmt_tmp.py
          git add \
            crates/open-kioku-core/src/lib.rs \
            crates/open-kioku-ingest/src/lib.rs \
            crates/open-kioku-graph/src/lib.rs \
            crates/open-kioku-graph/src/buffer.rs
          if ! git diff --quiet; then
            echo "unexpected unstaged tracked changes after validation cleanup:" >&2
            git status --short >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "unexpected untracked files after validation cleanup:" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi
          git commit -m "ri3: transport typed relationship proofs into graph edges"
          git pull --rebase origin agent/ri3-resolution-foundation
          git push origin HEAD:agent/ri3-resolution-foundation
