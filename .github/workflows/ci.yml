name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: no ignored tests without allowlist
        run: scripts/check-no-ignored-tests.py
      - run: cargo test --all
      - run: cargo test -p open-kioku-tests
      - name: MCP golden snapshot contract
        run: cargo test -p open-kioku-mcp golden_mcp_protocol_snapshots_are_stable
      - name: parser safety redaction
        run: cargo test -p open-kioku-ingest redacts_secret_like_message_tokens
      - name: local-mode network denial
        run: cargo test -p open-kioku-actions network_denied_by_default
      - name: snapshot export/import contract
        run: cargo test -p open-kioku-cli snapshot_export_import_round_trip_rebuilds_search_and_bootstraps_index
      - name: semantic disabled state
        run: cargo test -p open-kioku-semantic disabled_config_returns_no_provider
      - name: public quickstart command contract
        run: OK_BIN=target/debug/ok scripts/validate-public-quickstart.sh
      - name: release readiness smoke
        run: scripts/verify-release-readiness.sh
      - name: Cursor starter smoke
        run: OK_BIN=target/debug/ok examples/cursor/smoke.sh
      - name: Claude starter smoke
        run: OK_BIN=target/debug/ok examples/claude/smoke.sh

  relationship-conformance-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ri3-compact-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build relationship benchmark CLI
        run: cargo build -p open-kioku-cli
      - name: Run one live case per language relationship cohort
        run: |
          set -euo pipefail
          mkdir -p artifacts/relationships
          target/debug/ok --json relationship-bench \
            --corpus benchmarks/relationship-ci-cases.json \
            --observations @live \
            --write artifacts/relationships/compact-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/relationships/compact-report.json'))
          diagnostics = report.get('diagnostics', [])
          if report.get('overall', {}).get('cases') != 56:
              raise SystemExit(f"expected 56 compact cases, got {report.get('overall', {}).get('cases')}")
          if diagnostics:
              for item in diagnostics[:50]:
                  print(item)
              raise SystemExit(f"compact relationship conformance produced {len(diagnostics)} diagnostics")
          if report.get('overall', {}).get('false_positives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false positive')
          if report.get('overall', {}).get('false_negatives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false negative')
          PY
      - name: Upload compact relationship report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-conformance-compact
          path: artifacts/relationships
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Tests, profile validation, and the report are separate steps. A child process killed
      # while the LLVM profile runtime writes its .profraw at exit (for example `ok doctor`
      # stopping its `ok mcp serve` probe, or a test killing a lock holder) leaves a truncated
      # profile, and one unreadable profile makes `llvm-profdata merge` abort the whole report.
      # `--no-report` skips cargo-llvm-cov's automatic clean, so clean explicitly first: the
      # cached target directory must not contribute profiles from an earlier run.
      - name: Remove coverage artifacts from earlier runs
        run: cargo llvm-cov clean --workspace
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --workspace --all-features --no-report
      - name: Discard truncated coverage profiles
        shell: bash
        run: |
          set -euo pipefail
          max_discarded=5
          profile_dir=target/llvm-cov-target
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-profdata"
          if [ ! -x "$llvm_profdata" ]; then
            echo "::error::llvm-profdata not found at ${llvm_profdata}"
            exit 1
          fi
          mapfile -d '' profiles < <(find "$profile_dir" -maxdepth 1 -type f -name '*.profraw' -print0)
          if [ "${#profiles[@]}" -eq 0 ]; then
            echo "::error::no .profraw files under ${profile_dir}; the test step produced no coverage data"
            exit 1
          fi
          invalid="${RUNNER_TEMP}/invalid-profraw.tsv"
          # Empty profiles are skipped by `llvm-profdata merge` itself, so only non-empty files
          # are checked. Each line is "<path><TAB><first error line>".
          printf '%s\0' "${profiles[@]}" \
            | LLVM_PROFDATA="$llvm_profdata" xargs -0 -r -n 1 -P "$(nproc)" bash -c '
                [ -s "$1" ] || exit 0
                if ! err="$("$LLVM_PROFDATA" show "$1" 2>&1 >/dev/null)"; then
                  printf "%s\t%s\n" "$1" "$(printf "%s\n" "$err" | head -n 1)"
                fi
              ' _ > "$invalid"
          discarded="$(wc -l < "$invalid")"
          echo "Validated ${#profiles[@]} profiles with ${llvm_profdata}; ${discarded} failed validation."
          {
            echo "### Coverage profile validation"
            echo
            echo "Validated ${#profiles[@]} \`.profraw\` files; ${discarded} failed \`llvm-profdata show\` (limit ${max_discarded})."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$discarded" -gt 0 ]; then
            echo "| Profile | Error |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r path reason; do
              echo "::warning::invalid coverage profile ${path}: ${reason}"
              echo "| \`$(basename "$path")\` | ${reason} |" >> "$GITHUB_STEP_SUMMARY"
            done < "$invalid"
          fi
          if [ "$discarded" -gt "$max_discarded" ]; then
            echo "::error::${discarded} coverage profiles failed validation (limit ${max_discarded}); more than a killed child process explains, investigate the instrumentation"
            exit 1
          fi
          while IFS=$'\t' read -r path _; do
            rm -f -- "$path"
            echo "Discarded ${path}"
          done < "$invalid"
      - name: Generate coverage report
        # `--failure-mode any` is the default, stated so a profile that passes validation but
        # still cannot be merged fails the job instead of being dropped.
        run: cargo llvm-cov report --failure-mode any --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        # Ignored advisories live in .cargo/audit.toml so local and CI runs agree.
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  manifest-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest versions match Cargo.toml
        run: |
          chmod +x scripts/validate-versions.sh
          scripts/validate-versions.sh
      - name: Validate documentation counts
        run: |
          chmod +x scripts/validate-docs.sh
          scripts/validate-docs.sh
      - name: Validate release metadata
        run: scripts/validate-release-metadata.py
      - name: Validate release trust gates
        run: scripts/validate-trust-gates.py
