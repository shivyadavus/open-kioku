name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: no ignored tests without allowlist
        run: scripts/check-no-ignored-tests.py
      - run: cargo test --all
      - run: cargo test -p open-kioku-tests
      - name: MCP golden snapshot contract
        run: cargo test -p open-kioku-mcp golden_mcp_protocol_snapshots_are_stable
      - name: parser safety redaction
        run: cargo test -p open-kioku-ingest redacts_secret_like_message_tokens
      - name: local-mode network denial
        run: cargo test -p open-kioku-actions network_denied_by_default
      - name: snapshot export/import contract
        run: cargo test -p open-kioku-cli snapshot_export_import_round_trip_rebuilds_search_and_bootstraps_index
      - name: semantic disabled state
        run: cargo test -p open-kioku-semantic disabled_config_returns_no_provider
      - name: public quickstart command contract
        run: OK_BIN=target/debug/ok scripts/validate-public-quickstart.sh
      - name: release readiness smoke
        run: scripts/verify-release-readiness.sh
      - name: Cursor starter smoke
        run: OK_BIN=target/debug/ok examples/cursor/smoke.sh
      - name: Claude starter smoke
        run: OK_BIN=target/debug/ok examples/claude/smoke.sh

  relationship-conformance-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ri3-compact-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build relationship benchmark CLI
        run: cargo build -p open-kioku-cli
      - name: Run one live case per language relationship cohort
        run: |
          set -euo pipefail
          mkdir -p artifacts/relationships
          target/debug/ok --json relationship-bench \
            --corpus benchmarks/relationship-ci-cases.json \
            --observations @live \
            --write artifacts/relationships/compact-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/relationships/compact-report.json'))
          diagnostics = report.get('diagnostics', [])
          if report.get('overall', {}).get('cases') != 42:
              raise SystemExit(f"expected 42 compact cases, got {report.get('overall', {}).get('cases')}")
          if diagnostics:
              for item in diagnostics[:50]:
                  print(item)
              raise SystemExit(f"compact relationship conformance produced {len(diagnostics)} diagnostics")
          if report.get('overall', {}).get('false_positives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false positive')
          if report.get('overall', {}).get('false_negatives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false negative')
          PY
      - name: Upload compact relationship report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-conformance-compact
          path: artifacts/relationships
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0437
      - name: cargo deny check
        run: cargo deny check

  manifest-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest versions match Cargo.toml
        run: |
          chmod +x scripts/validate-versions.sh
          scripts/validate-versions.sh
      - name: Validate documentation counts
        run: |
          chmod +x scripts/validate-docs.sh
          scripts/validate-docs.sh
      - name: Validate release metadata
        run: scripts/validate-release-metadata.py
      - name: Validate release trust gates
        run: scripts/validate-trust-gates.py

  v301-prepare:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0

      - name: Guard immutable release tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/v3.0.1 >/dev/null; then
            echo 'v3.0.1 already exists; refusing to move an immutable release tag' >&2
            exit 1
          fi

      - name: Prepare 3.0.1 metadata and changelog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text(encoding='utf-8')
          old = 'version = "3.0.0"'
          if old not in text:
              raise SystemExit('release branch is not at 3.0.0')
          path.write_text(text.replace(old, 'version = "3.0.1"', 1), encoding='utf-8')
          PY
          scripts/sync-version.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if '## [3.0.1]' not in text:
              section = '''## [3.0.1] — 2026-08-19

### Fixed
- Fixed repository discovery so nested `.gitignore` rules stay scoped to their declaring directory instead of excluding unrelated source trees.
- Made Git authoritative for ignore decisions in Git repositories, preserving tracked-file semantics, nested negation, and standard Git excludes.
- Scoped nested `.okignore` rules correctly, protected large ignore batches from pipe deadlocks, and warn when filtering collapses a supported-source index to zero.

### Artifacts
- `ok-linux-x86_64`
- `ok-linux-x86_64.sha256`
- `ok-linux-arm64`
- `ok-linux-arm64.sha256`
- `ok-macos-arm64`
- `ok-macos-arm64.sha256`
- `ok-windows-x86_64.exe`
- `ok-windows-x86_64.exe.sha256`

---

'''
              marker = '## [3.0.0] — 2026-08-17\n'
              if marker not in text:
                  raise SystemExit('3.0.0 changelog marker missing')
              text = text.replace(marker, section + marker, 1)
          link = '[3.0.1]: https://github.com/shivyadavus/open-kioku/releases/tag/v3.0.1'
          if link not in text:
              text = text.rstrip() + '\n' + link + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          cargo metadata --format-version 1 >/dev/null
          scripts/validate-versions.sh

      - name: Commit hotfix candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare 3.0.1 ignore hotfix'
          git push origin HEAD:release/v3.0.1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  v301-verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
    needs: v301-prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.v301-prepare.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Verify hotfix candidate
        run: |
          set -euo pipefail
          scripts/validate-versions.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-ingest --test ignore_discovery -- --nocapture

  v301-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
    needs: [v301-prepare, v301-verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ok-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.v301-prepare.outputs.candidate_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zlib1g-dev libgomp1
      - name: Build hotfix binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p open-kioku-cli
      - name: Package hotfix binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = 'Windows' ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi
          cd dist
          if [ "${{ runner.os }}" = 'macOS' ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi
      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.binary_name }}
          test "$(dist/${{ matrix.binary_name }} --version)" = 'ok 3.0.1'
      - uses: actions/upload-artifact@v4
        with:
          name: v301-${{ matrix.binary_name }}
          path: dist/*
          if-no-files-found: error

  v301-publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
    needs: [v301-prepare, v301-build]
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: v301-*
          path: dist
          merge-multiple: true

      - name: Pin artifact hashes
        env:
          CANDIDATE_SHA: ${{ needs.v301-prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          names = ['ok-linux-x86_64','ok-linux-arm64','ok-macos-arm64','ok-windows-x86_64.exe']
          hashes = {name: hashlib.sha256(Path('dist', name).read_bytes()).hexdigest() for name in names}
          metadata_path = Path('release-metadata.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          for artifact in metadata['artifacts']:
              if artifact['name'] in hashes:
                  artifact['sha256'] = hashes[artifact['name']]
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          formula_path = Path('Formula/open-kioku.rb')
          lines = formula_path.read_text(encoding='utf-8').splitlines()
          current = None
          for i, line in enumerate(lines):
              match = re.search(r'/([^/\"]+)\"$', line)
              if 'url ' in line and match:
                  current = match.group(1)
              elif current in hashes and 'sha256 ' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}sha256 "{hashes[current]}"'
                  current = None
          formula_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh

      - name: Commit final release metadata
        id: final
        env:
          CANDIDATE_SHA: ${{ needs.v301-prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m 'release: pin 3.0.1 artifact hashes'
          git push origin HEAD:release/v3.0.1
          FINAL_SHA="$(git rev-parse HEAD)"
          git diff --quiet "$CANDIDATE_SHA" "$FINAL_SHA" -- Cargo.toml Cargo.lock crates packages .cursor-plugin .claude-plugin .codex-plugin claude_plugin.json
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Generate trust artifacts and release notes
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          env GITHUB_SHA="$FINAL_SHA" GITHUB_REF_NAME='v3.0.1' GITHUB_WORKFLOW='V3.0.1 scoped ignore hotfix' scripts/generate-release-trust-artifacts.sh dist
          awk '/^## \[3\.0\.1\]/ {flag=1; print; next} /^## \[/ {if(flag) exit} flag' CHANGELOG.md > release_notes.md
          test -s release_notes.md
      - name: Attest hotfix binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ok-linux-x86_64
            dist/ok-linux-arm64
            dist/ok-macos-arm64
            dist/ok-windows-x86_64.exe
      - name: Create immutable v3.0.1 tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          test -z "$(git tag -l v3.0.1)"
          git tag -a v3.0.1 HEAD -m 'Open Kioku 3.0.1'
          git push origin refs/tags/v3.0.1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: Open Kioku 3.0.1
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

  v301-npm:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
    needs: v301-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.v301-publish.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: v301-*
          path: dist
          merge-multiple: true
      - name: Inject canonical binaries
        run: |
          set -euo pipefail
          cp dist/ok-macos-arm64 packages/npm-darwin-arm64/ok
          cp dist/ok-linux-x86_64 packages/npm-linux-x64/ok
          cp dist/ok-linux-arm64 packages/npm-linux-arm64/ok
          cp dist/ok-windows-x86_64.exe packages/npm-win32-x64/ok.exe
          chmod +x packages/npm-darwin-arm64/ok packages/npm-linux-x64/ok packages/npm-linux-arm64/ok
      - name: Publish npm 3.0.1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_package() {
            local package_dir="$1"
            local name version
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
            else
              (cd "$package_dir" && npm publish --access public)
            fi
          }
          for package in packages/npm-darwin-arm64 packages/npm-linux-x64 packages/npm-linux-arm64 packages/npm-win32-x64; do
            publish_package "$package"
          done
          publish_package packages/npm
          test "$(npm view open-kioku@3.0.1 version)" = '3.0.1'

  v301-crates:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 306
    needs: v301-publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.v301-publish.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Publish crates.io 3.0.1
        env:
          EXPECTED_VERSION: 3.0.1
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --publish
