name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-307-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/cc7-bounded-primary-authority' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc7-bounded-primary-authority
          fetch-depth: 0
      - name: Apply production patch
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/open-kioku-context/src/lib.rs")
          text = path.read_text()
          old = "        let primary_symbols = primary\n            .iter()\n            .filter_map(|result| result.symbol.clone())\n            .take(10)\n            .collect::<Vec<_>>();\n        let impact = if expand_impact {\n            if let Some(first) = primary.first() {\n"
          new = "        // Materialize the caller-visible primary selection once. Downstream authority must be\n        // derived only from evidence that survived the primary limit; hidden retrieval candidates\n        // cannot widen symbols, dependency seeds, or the allowed edit boundary.\n        let mut primary_files = bounded_primary_results(primary, limit);\n        let primary_symbols = primary_files\n            .iter()\n            .filter_map(|result| result.symbol.clone())\n            .take(10)\n            .collect::<Vec<_>>();\n        let impact = if expand_impact {\n            if let Some(first) = primary_files.first() {\n"
          if old not in text: raise SystemExit("primary symbol anchor missing")
          text = text.replace(old, new, 1)
          old = "        } else if primary.is_empty() {\n"
          if old not in text: raise SystemExit("impact emptiness anchor missing")
          text = text.replace(old, "        } else if primary_files.is_empty() {\n", 1)
          old = "        for result in primary.iter().take(5) {\n"
          if old not in text: raise SystemExit("dependency anchor missing")
          text = text.replace(old, "        for result in primary_files.iter().take(5) {\n", 1)
          old = "        let mut primary_files = primary.iter().take(limit).cloned().collect::<Vec<_>>();\n"
          if old not in text: raise SystemExit("late primary declaration missing")
          text = text.replace(old, "", 1)
          old = "        let allowed_files = primary\n            .iter()\n            .take(8)\n            .map(|result| result.path.clone())\n            .collect::<Vec<_>>();\n"
          new = "        let allowed_files = primary_files\n            .iter()\n            .take(8)\n            .map(|result| result.path.clone())\n            .collect::<Vec<_>>();\n"
          if old not in text: raise SystemExit("allowed files anchor missing")
          text = text.replace(old, new, 1)
          anchor = "fn apply_required_evidence_policy(\n"
          helper = "fn bounded_primary_results(primary: Vec<SearchResult>, limit: usize) -> Vec<SearchResult> {\n    primary.into_iter().take(limit).collect()\n}\n\n"
          if helper not in text:
              if anchor not in text: raise SystemExit("helper anchor missing")
              text = text.replace(anchor, helper + anchor, 1)
          anchor = "    #[test]\n    fn context_pack_telemetry_counts_selected_sources_once_per_file_and_preserves_exact_authority()\n"
          lines = [
              "    #[test]",
              "    fn primary_limit_removes_hidden_candidates_before_downstream_authority_derivation() {",
              "        let visible = SearchResult {",
              "            path: \"src/visible.rs\".into(),",
              "            line_range: None,",
              "            snippet: \"fn visible() {}\".into(),",
              "            symbol: None,",
              "            score: 2.0,",
              "            match_reason: \"visible fixture\".into(),",
              "            evidence: Vec::new(),",
              "            evidence_refs: vec![\"visible:evidence\".into()],",
              "            confidence: 0.9,",
              "            score_breakdown: Vec::new(),",
              "        };",
              "        let hidden = SearchResult {",
              "            path: \"src/hidden.rs\".into(),",
              "            line_range: None,",
              "            snippet: \"fn hidden() {}\".into(),",
              "            symbol: None,",
              "            score: 1.0,",
              "            match_reason: \"hidden fixture\".into(),",
              "            evidence: Vec::new(),",
              "            evidence_refs: vec![\"hidden:evidence\".into()],",
              "            confidence: 0.8,",
              "            score_breakdown: Vec::new(),",
              "        };",
              "        let bounded = bounded_primary_results(vec![visible.clone(), hidden], 1);",
              "        assert_eq!(bounded.len(), 1);",
              "        assert_eq!(bounded[0].path, visible.path);",
              "        assert_eq!(bounded[0].evidence_refs, visible.evidence_refs);",
              "        assert!(bounded.iter().all(|result| result.path != Path::new(\"src/hidden.rs\")));",
              "    }",
              "",
          ]
          test = "\n".join(lines) + "\n"
          if test not in text:
              if anchor not in text: raise SystemExit("test anchor missing")
              text = text.replace(anchor, test + anchor, 1)
          path.write_text(text)
      - name: Restore production workflow surface
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/agent-307-patch.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format and targeted validation
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-context
      - name: Commit production-only fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/open-kioku-context/src/lib.rs .github/workflows/ci.yml .github/workflows/agent-307-patch.yml
          git commit -m "fix(cc7): bound downstream authority to visible primary context"
          git push origin HEAD:agent/cc7-bounded-primary-authority
