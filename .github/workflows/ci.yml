name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent-307-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/cc7-bounded-primary-authority' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc7-bounded-primary-authority
          fetch-depth: 0
      - name: Apply bounded-primary authority fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/open-kioku-context/src/lib.rs')
          text = path.read_text()
          replacements = [
              ('''        let primary_symbols = primary
            .iter()
            .filter_map(|result| result.symbol.clone())
            .take(10)
            .collect::<Vec<_>>();
        let impact = if expand_impact {
            if let Some(first) = primary.first() {
''', '''        // Materialize the caller-visible primary selection once. Downstream authority must be
        // derived only from evidence that survived the primary limit; hidden retrieval candidates
        // cannot widen symbols, dependency seeds, or the allowed edit boundary.
        let mut primary_files = bounded_primary_results(primary, limit);
        let primary_symbols = primary_files
            .iter()
            .filter_map(|result| result.symbol.clone())
            .take(10)
            .collect::<Vec<_>>();
        let impact = if expand_impact {
            if let Some(first) = primary_files.first() {
'''),
              ('''        for result in primary.iter().take(5) {
''', '''        for result in primary_files.iter().take(5) {
'''),
              ('''        let mut primary_files = primary.iter().take(limit).cloned().collect::<Vec<_>>();
''', ''''''),
              ('''        let allowed_files = primary
            .iter()
            .take(8)
            .map(|result| result.path.clone())
            .collect::<Vec<_>>();
''', '''        let allowed_files = primary_files
            .iter()
            .take(8)
            .map(|result| result.path.clone())
            .collect::<Vec<_>>();
'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'patch anchor missing: {old[:60]!r}')
              text = text.replace(old, new, 1)
          helper_anchor = 'fn apply_required_evidence_policy(\n'
          helper = '''fn bounded_primary_results(primary: Vec<SearchResult>, limit: usize) -> Vec<SearchResult> {
    primary.into_iter().take(limit).collect()
}

'''
          if helper not in text:
              if helper_anchor not in text:
                  raise SystemExit('helper insertion anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          test_anchor = '''    #[test]
    fn context_pack_telemetry_counts_selected_sources_once_per_file_and_preserves_exact_authority()
'''
          test = '''    #[test]
    fn primary_limit_removes_hidden_candidates_before_downstream_authority_derivation() {
        let visible = SearchResult {
            path: "src/visible.rs".into(),
            line_range: None,
            snippet: "fn visible() {}".into(),
            symbol: None,
            score: 2.0,
            match_reason: "visible fixture".into(),
            evidence: Vec::new(),
            evidence_refs: vec!["visible:evidence".into()],
            confidence: 0.9,
            score_breakdown: Vec::new(),
        };
        let hidden = SearchResult {
            path: "src/hidden.rs".into(),
            line_range: None,
            snippet: "fn hidden() {}".into(),
            symbol: None,
            score: 1.0,
            match_reason: "hidden fixture".into(),
            evidence: Vec::new(),
            evidence_refs: vec!["hidden:evidence".into()],
            confidence: 0.8,
            score_breakdown: Vec::new(),
        };
        let bounded = bounded_primary_results(vec![visible.clone(), hidden], 1);
        assert_eq!(bounded.len(), 1);
        assert_eq!(bounded[0].path, visible.path);
        assert_eq!(bounded[0].evidence_refs, visible.evidence_refs);
        assert!(bounded
            .iter()
            .all(|result| result.path != Path::new("src/hidden.rs")));
    }

'''
          if test not in text:
              if test_anchor not in text:
                  raise SystemExit('test insertion anchor missing')
              text = text.replace(test_anchor, test + test_anchor, 1)
          path.write_text(text)
      - name: Restore production workflow surface
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/agent-307-patch.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format and targeted validation
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-context
      - name: Commit production-only fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/open-kioku-context/src/lib.rs .github/workflows/ci.yml .github/workflows/agent-307-patch.yml
          git commit -m "fix(cc7): bound downstream authority to visible primary context"
          git push origin HEAD:agent/cc7-bounded-primary-authority

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: no ignored tests without allowlist
        run: scripts/check-no-ignored-tests.py
      - run: cargo test --all
      - run: cargo test -p open-kioku-tests
      - name: MCP golden snapshot contract
        run: cargo test -p open-kioku-mcp golden_mcp_protocol_snapshots_are_stable
      - name: parser safety redaction
        run: cargo test -p open-kioku-ingest redacts_secret_like_message_tokens
      - name: local-mode network denial
        run: cargo test -p open-kioku-actions network_denied_by_default
      - name: snapshot export/import contract
        run: cargo test -p open-kioku-cli snapshot_export_import_round_trip_rebuilds_search_and_bootstraps_index
      - name: semantic disabled state
        run: cargo test -p open-kioku-semantic disabled_config_returns_no_provider
      - name: public quickstart command contract
        run: OK_BIN=target/debug/ok scripts/validate-public-quickstart.sh
      - name: release readiness smoke
        run: scripts/verify-release-readiness.sh
      - name: Cursor starter smoke
        run: OK_BIN=target/debug/ok examples/cursor/smoke.sh
      - name: Claude starter smoke
        run: OK_BIN=target/debug/ok examples/claude/smoke.sh

  relationship-conformance-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ri3-compact-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build relationship benchmark CLI
        run: cargo build -p open-kioku-cli
      - name: Run one live case per language relationship cohort
        run: |
          set -euo pipefail
          mkdir -p artifacts/relationships
          target/debug/ok --json relationship-bench \
            --corpus benchmarks/relationship-ci-cases.json \
            --observations @live \
            --write artifacts/relationships/compact-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('artifacts/relationships/compact-report.json'))
          diagnostics = report.get('diagnostics', [])
          if report.get('overall', {}).get('cases') != 42:
              raise SystemExit(f"expected 42 compact cases, got {report.get('overall', {}).get('cases')}")
          if diagnostics:
              for item in diagnostics[:50]:
                  print(item)
              raise SystemExit(f"compact relationship conformance produced {len(diagnostics)} diagnostics")
          if report.get('overall', {}).get('false_positives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false positive')
          if report.get('overall', {}).get('false_negatives', 0) != 0:
              raise SystemExit('compact relationship conformance produced a false negative')
          PY
      - name: Upload compact relationship report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-conformance-compact
          path: artifacts/relationships
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: install audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0437
      - name: cargo deny check
        run: cargo deny check

  manifest-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest versions match Cargo.toml
        run: |
          chmod +x scripts/validate-versions.sh
          scripts/validate-versions.sh
      - name: Validate documentation counts
        run: |
          chmod +x scripts/validate-docs.sh
          scripts/validate-docs.sh
      - name: Validate release metadata
        run: scripts/validate-release-metadata.py
      - name: Validate release trust gates
        run: scripts/validate-trust-gates.py
