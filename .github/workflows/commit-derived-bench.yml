name: commit-derived-bench

# Scores the production `ok context` path on a leakage-safe benchmark derived from a real
# repository's history (docs/retrieval-benchmark.md, "Commit-derived corpora"). The 39-file
# fixture in `ci.yml` catches determinism and gross regressions; this job is what catches a
# ranking change that only shows on ten thousand files. It is scheduled because indexing the
# corpus and scoring ~400 queries takes about 45 minutes.
#
# Matrix entries are keyed java-a, go-a, ts-a, py-a (a Java service, a Go application, a TypeScript
# standard library, a Python ML library); the keys name the baseline files. Each repository URL lives in
# a repository variable named `BENCH_<CODE>_URL` (Settings > Secrets and variables > Actions),
# never in this file or in `benchmarks/commit-derived/`; the base commit, extension, and
# indexed subtrees are checked in because they name nothing.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repo_url:
        description: Override the repository for every matrix entry (leave blank to read each corpus's BENCH_<CODE>_URL variable)
        default: ""
      base_sha:
        description: Base commit; the repository is indexed here
        default: ""
      path_prefixes:
        description: Space-separated subtrees that are extracted and indexed
        default: ""
      after:
        description: Commits after base to scan for cases
        default: ""
      corpus_name:
        description: Corpus code whose baseline under benchmarks/commit-derived/ is compared against (java-a, go-a, ts-a, py-a)
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - name: java-a
            url_var: BENCH_JAVA_A_URL
            base: 1e6d79605440aa871287acacb604564d54ca7555
            prefixes: "libs/ modules/ server/"
            ext: .java
            after: "3800"
          - name: go-a
            url_var: BENCH_GO_A_URL
            base: 79da24a0ebc0a33be89052188040caeec93c741e
            prefixes: ""
            ext: .go
            after: "1500"
          - name: ts-a
            url_var: BENCH_TS_A_URL
            base: d93aa7c94e640aa7b206e1a08e094eb705c1e1fa
            prefixes: ""
            ext: .ts
            after: "1500"
          - name: py-a
            url_var: BENCH_PY_A_URL
            base: 7cd9b985e0698d4f625a18be0125231b6b930390
            prefixes: ""
            ext: .py
            after: "1500"
    name: bench (${{ matrix.corpus.name }})
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || vars[matrix.corpus.url_var] }}
      BASE_SHA: ${{ github.event.inputs.base_sha || matrix.corpus.base }}
      PATH_PREFIXES: ${{ github.event.inputs.path_prefixes || matrix.corpus.prefixes }}
      EXT: ${{ matrix.corpus.ext }}
      AFTER: ${{ github.event.inputs.after || matrix.corpus.after }}
      CORPUS_NAME: ${{ github.event.inputs.corpus_name || matrix.corpus.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the corpus repository
        run: |
          if [ -z "$REPO_URL" ]; then
            echo "::error::no repository URL for corpus ${{ matrix.corpus.name }}: set the ${{ matrix.corpus.url_var }} repository variable or pass repo_url"
            exit 1
          fi
          echo "corpus ${{ matrix.corpus.name }} at $BASE_SHA (URL from ${{ matrix.corpus.url_var }})"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ok
        run: cargo build --release -p open-kioku-cli

      - name: Clone source repository (history only, blobs on demand)
        run: |
          git clone --quiet --filter=blob:none --no-checkout "$REPO_URL" source
          git -C source fetch --quiet origin "$BASE_SHA" || true

      - name: Extract the indexed subtree at the base commit
        run: |
          mkdir -p corpus
          # shellcheck disable=SC2086
          git -C source archive "$BASE_SHA" $PATH_PREFIXES | tar -x -C corpus
          echo "$BASE_SHA" > corpus/.base-sha
          find corpus -type f | wc -l

      - name: Derive cases
        run: |
          args=""
          for p in $PATH_PREFIXES; do args="$args --path-prefix $p"; done
          # shellcheck disable=SC2086
          python3 scripts/commit-derived-cases.py source --base "$BASE_SHA" --after "$AFTER" --ext "$EXT" $args --out cases.tsv
          python3 - <<'PY'
          rows = open("cases.tsv").readlines()
          cut = int(len(rows) * 0.7)
          open("cases-dev.tsv", "w").writelines(rows[:cut])
          open("cases-holdout.tsv", "w").writelines(rows[cut:])
          print(f"{len(rows)} cases: {cut} dev, {len(rows) - cut} holdout (chronological split)")
          PY

      - name: Index the corpus
        run: |
          ./target/release/ok init corpus
          ./target/release/ok index corpus 2>&1 | tail -5

      - name: Score the production context path
        run: |
          mkdir -p artifacts
          python3 scripts/score-context-cases.py --ok ./target/release/ok --repo corpus \
            --cases cases-holdout.tsv --label holdout --workers 3 --out artifacts/holdout.json
          python3 scripts/score-context-cases.py --ok ./target/release/ok --repo corpus \
            --cases cases-dev.tsv --label dev --workers 3 --out artifacts/dev.json

      - name: Compare against the frozen baseline
        run: |
          python3 scripts/compare-commit-derived-report.py artifacts/holdout.json \
            "benchmarks/commit-derived/${CORPUS_NAME}-holdout.json"
          python3 scripts/compare-commit-derived-report.py artifacts/dev.json \
            "benchmarks/commit-derived/${CORPUS_NAME}-dev.json"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commit-derived-${{ env.CORPUS_NAME }}
          path: |
            artifacts/
            cases.tsv
          if-no-files-found: error
