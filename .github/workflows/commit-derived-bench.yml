name: commit-derived-bench

# Scores the production `ok context` path on a leakage-safe benchmark derived from a real
# repository's history (docs/retrieval-benchmark.md, "Commit-derived corpora"). The 39-file
# fixture in `ci.yml` catches determinism and gross regressions; this job is what catches a
# ranking change that only shows on ten thousand files. It is scheduled because indexing the
# corpus and scoring ~400 queries takes about 45 minutes.
#
# Matrix entries are keyed java-a, go-a, ts-a, py-a (Java, Go, TypeScript, Python); the keys name
# the baseline files. These values live in repository secrets (Settings > Secrets and variables >
# Actions), never in this file or in `benchmarks/commit-derived/`:
# - each repository URL in `BENCH_<CODE>_URL`;
# - each base commit in `BENCH_<CODE>_BASE`;
# - for a corpus indexed as subtrees, the space-separated subtrees in `BENCH_<CODE>_PATHS`.
# A full commit hash of a public repository is searchable and therefore identifies it, and so can a
# set of top-level directory names, so both are withheld for the same reason the URL is. The
# extension stays checked in because it names nothing.
#
# How corpus identity stays out of public logs and artifacts:
# - The secrets reach only the steps that use them. Before the clone,
#   `scripts/mask-corpus-identity.sh` normalises them and masks every form a log could still show.
# - Dispatch inputs reach scripts only through `env:` or the event file, validated. They never
#   appear as expression text inside `run:`.
# - The clone and its remote are removed once cases are derived, and case derivation runs `--quiet`.
# - `ok index` writes its manifest to a file; the log gets one counts-only line.
# - The uploaded artifact carries aggregate results only (`scripts/reduce-benchmark-report.py`).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      path_prefixes:
        description: Space-separated subtrees to extract and index instead of each corpus's BENCH_<CODE>_PATHS secret (plain relative paths; masked in the log)
        default: ""
      after:
        description: Commits after base to scan for cases (digits; blank = each corpus's default)
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        corpus:
          - name: java-a
            url_secret: BENCH_JAVA_A_URL
            base_secret: BENCH_JAVA_A_BASE
            paths_secret: BENCH_JAVA_A_PATHS
            ext: .java
            after: "3800"
          - name: go-a
            url_secret: BENCH_GO_A_URL
            base_secret: BENCH_GO_A_BASE
            paths_secret: ""
            ext: .go
            after: "1500"
          - name: ts-a
            url_secret: BENCH_TS_A_URL
            base_secret: BENCH_TS_A_BASE
            paths_secret: ""
            ext: .ts
            after: "1500"
          - name: py-a
            url_secret: BENCH_PY_A_URL
            base_secret: BENCH_PY_A_BASE
            paths_secret: ""
            ext: .py
            after: "1500"
    name: bench (${{ matrix.corpus.name }})
    env:
      CORPUS_NAME: ${{ matrix.corpus.name }}
      EXT: ${{ matrix.corpus.ext }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the corpus secrets and dispatch inputs
        env:
          REPO_URL: ${{ secrets[matrix.corpus.url_secret] }}
          BASE_SHA: ${{ secrets[matrix.corpus.base_secret] }}
          CORPUS_PATHS: ${{ secrets[matrix.corpus.paths_secret] }}
          URL_SECRET: ${{ matrix.corpus.url_secret }}
          BASE_SECRET: ${{ matrix.corpus.base_secret }}
          PATHS_SECRET: ${{ matrix.corpus.paths_secret }}
          IN_AFTER: ${{ github.event.inputs.after }}
        run: |
          missing=""
          if [ -z "$REPO_URL" ]; then missing="$missing $URL_SECRET"; fi
          if [ -z "$BASE_SHA" ]; then missing="$missing $BASE_SECRET"; fi
          if [ -n "$PATHS_SECRET" ] && [ -z "$CORPUS_PATHS" ]; then missing="$missing $PATHS_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::corpus $CORPUS_NAME is missing repository secrets:$missing"
            exit 1
          fi
          if [[ -n "$IN_AFTER" && ! "$IN_AFTER" =~ ^[0-9]+$ ]]; then
            echo "::error::the after input must be digits"
            exit 1
          fi
          echo "corpus $CORPUS_NAME resolved from repository secrets"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ok
        run: cargo build --release -p open-kioku-cli

      - name: Derive the corpus and its cases at the base commit
        env:
          REPO_URL: ${{ secrets[matrix.corpus.url_secret] }}
          BASE_SHA: ${{ secrets[matrix.corpus.base_secret] }}
          CORPUS_PATHS: ${{ secrets[matrix.corpus.paths_secret] }}
          AFTER: ${{ github.event.inputs.after || matrix.corpus.after }}
        run: |
          set -o pipefail
          # A dispatch override of the subtrees is read from the event file rather than `env:`, so it
          # is validated and masked below before anything could print it.
          override="$(python3 -c 'import json, os; print(((json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("inputs") or {}).get("path_prefixes") or "").strip())')"
          if [ -n "$override" ]; then CORPUS_PATHS="$override"; fi
          # Normalises REPO_URL, BASE_SHA and CORPUS_PATHS in place and masks every form of them a
          # log could show. Nothing before this line prints them.
          . scripts/mask-corpus-identity.sh
          if [[ ! "$AFTER" =~ ^[0-9]+$ ]]; then echo "::error::after must be digits"; exit 1; fi
          if [[ ! "$EXT" =~ ^\.[a-z0-9]+$ ]]; then echo "::error::ext must be a dot and lowercase letters or digits"; exit 1; fi

          # The clone holds the remote URL and the corpus history; it is removed however this step ends.
          trap 'rm -rf source extract.err' EXIT
          # History only, blobs on demand.
          git clone --quiet --filter=blob:none --no-checkout "$REPO_URL" source
          git -C source fetch --quiet origin "$BASE_SHA" || true

          # The indexed subtrees at the base commit. Extraction stderr can name corpus paths, so a
          # failure reports only that it failed.
          mkdir -p corpus
          read -r -a paths <<< "$CORPUS_PATHS"
          if ! git -C source archive "$BASE_SHA" "${paths[@]}" 2>extract.err | tar -x -C corpus 2>>extract.err; then
            echo "::error::extracting the base commit failed; its stderr is withheld"
            exit 1
          fi
          echo "$(find corpus -type f | wc -l) files extracted"

          args=()
          for p in "${paths[@]}"; do args+=(--path-prefix "$p"); done
          python3 scripts/commit-derived-cases.py source --quiet --base "$BASE_SHA" --after "$AFTER" --ext "$EXT" "${args[@]}" --out cases.tsv
          python3 - <<'PY'
          rows = open("cases.tsv").readlines()
          cut = int(len(rows) * 0.7)
          open("cases-dev.tsv", "w").writelines(rows[:cut])
          open("cases-holdout.tsv", "w").writelines(rows[cut:])
          print(f"{len(rows)} cases: {cut} dev, {len(rows) - cut} holdout (chronological split)")
          PY

          # Blobs were fetched from the remote on demand until here. Later steps need neither.
          git -C source remote remove origin
          rm -rf source extract.err

      - name: Index the corpus
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./target/release/ok init corpus
          # Text output names excluded top-level directories, so the manifest goes to a file and the
          # log gets one counts-only line; a failure prints only its exit status.
          status=0
          ./target/release/ok --json index corpus > "$RUNNER_TEMP/index.json" 2> "$RUNNER_TEMP/index.err" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::ok index exited with status $status; its output is withheld"
            exit "$status"
          fi
          python3 - "$RUNNER_TEMP/index.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          coverage = (manifest.get("quality") or {}).get("coverage") or {}
          count = lambda obj, key: int(obj.get(key) or 0)
          print(f"indexed {count(manifest, 'file_count'):,} files, {count(manifest, 'symbol_count'):,} symbols, "
                f"{count(manifest, 'chunk_count'):,} chunks; {count(coverage, 'indexed'):,} of "
                f"{count(coverage, 'discovered'):,} discovered files indexed")
          PY
          # Coverage is what the index did not hold; it travels with every score below.
          # Only the coverage object is kept: the full status carries skipped paths.
          ./target/release/ok --repo corpus --json status 2> "$RUNNER_TEMP/status.err" \
            | python3 -c 'import json, sys; json.dump(json.load(sys.stdin).get("coverage"), sys.stdout, indent=1)' \
            > artifacts/coverage.json

      - name: Score the production context path
        run: |
          python3 scripts/score-context-cases.py --ok ./target/release/ok --repo corpus \
            --cases cases-holdout.tsv --label holdout --workers 3 --out artifacts/holdout.json
          python3 scripts/score-context-cases.py --ok ./target/release/ok --repo corpus \
            --cases cases-dev.tsv --label dev --workers 3 --out artifacts/dev.json

      - name: Compare against the frozen baseline
        run: |
          python3 scripts/compare-commit-derived-report.py artifacts/holdout.json \
            "benchmarks/commit-derived/${CORPUS_NAME}-holdout.json"
          python3 scripts/compare-commit-derived-report.py artifacts/dev.json \
            "benchmarks/commit-derived/${CORPUS_NAME}-dev.json"

      - name: Record coverage next to accuracy in the job summary
        if: always()
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          print(f"### {os.environ['CORPUS_NAME']}")
          print("| split | coverage | R@5 | R@20 | MRR |")
          print("| --- | --- | ---: | ---: | ---: |")
          for split in ("holdout", "dev"):
              try:
                  r = json.load(open(f"artifacts/{split}.json"))
              except OSError:
                  print(f"| {split} | (no report) | | | |")
                  continue
              m = r["metrics"]
              print(f"| {split} | {r.get('coverage_line', 'not recorded')} | {m['R@5']:.4f} | {m['R@20']:.4f} | {m['MRR']:.4f} |")
          # Per-family rows take their gate status from the compare script, so the summary
          # shows what the gate applied rather than inferring it from the case count.
          import importlib.util
          spec = importlib.util.spec_from_file_location("compare", "scripts/compare-commit-derived-report.py")
          compare = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(compare)
          splits = {}
          for split in ("holdout", "dev"):
              try:
                  report = json.load(open(f"artifacts/{split}.json"))
              except OSError:
                  continue
              path = f"benchmarks/commit-derived/{os.environ['CORPUS_NAME']}-{split}.json"
              splits[split] = (report, json.load(open(path)) if os.path.exists(path) else None)
          print()
          for line in compare.summary_table(splits):
              print(line)
          PY

      # After the comparison and the summary, which read the per-case rows; nothing is uploaded
      # unless every report was reduced.
      - name: Reduce the reports to aggregates
        id: aggregate
        if: always()
        run: |
          python3 scripts/reduce-benchmark-report.py artifacts/holdout.json artifacts/dev.json \
            --coverage artifacts/coverage.json

      - name: Upload reports
        if: always() && steps.aggregate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: commit-derived-${{ matrix.corpus.name }}
          path: |
            artifacts/holdout.json
            artifacts/dev.json
            artifacts/coverage.json
          if-no-files-found: error
