name: agent-freeze-retrieval-corpus

on:
  push:
    branches:
      - agent/context-retrieval-benchmark

permissions:
  contents: write

jobs:
  freeze-and-measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-retrieval-benchmark
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Raise minimum corpus size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-cli/src/bench/retrieval.rs')
          text = path.read_text()
          old = '''    /// Fail unless at least this many validated cases are loaded.
              #[arg(long, default_value_t = 20)]
              min_cases: usize,'''
          new = '''    /// Fail unless at least this many validated cases are loaded.
              #[arg(long, default_value_t = 30)]
              min_cases: usize,'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one min_cases block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Validate hardened benchmark engine
        run: |
          cargo test -p open-kioku-cli retrieval_bench_tests
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
      - name: Measure corpus and capture content digest
        run: |
          cargo run -p open-kioku-cli -- \
            --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --min-cases 30 \
            --write-json /tmp/retrieval-prepin-report.json \
            --write-baseline /tmp/retrieval-prepin-baseline.json \
            > /tmp/retrieval-prepin-stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('/tmp/retrieval-prepin-baseline.json').read_text())
          digest = baseline['fixture_digests']['benchmarks/retrieval-fixture']
          if not digest.startswith('sha256:'):
              raise SystemExit(f'unexpected fixture digest: {digest}')
          corpus_path = Path('benchmarks/retrieval-cases.json')
          corpus = json.loads(corpus_path.read_text())
          if len(corpus['cases']) != 30:
              raise SystemExit(f"expected 30 cases, got {len(corpus['cases'])}")
          for case in corpus['cases']:
              case['base_revision'] = digest
          corpus_path.write_text(json.dumps(corpus, indent=2) + '\n')
          print(f'pinned retrieval fixture to {digest}')
          PY
      - name: Remeasure exact pinned corpus
        run: |
          cargo run -p open-kioku-cli -- \
            --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --no-index \
            --min-cases 30 \
            --write-json /tmp/retrieval-report.json \
            --write-markdown /tmp/retrieval-report.md \
            --write-baseline benchmarks/retrieval-baseline.json \
            > /tmp/retrieval-stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('benchmarks/retrieval-baseline.json').read_text())
          assert baseline['case_count'] == 30
          assert len(baseline['strategies']) == 2
          for strategy in baseline['strategies']:
              assert strategy['by_split']['development']['positive_cases'] > 0
              assert strategy['by_split']['holdout']['positive_cases'] > 0
              assert len(strategy['by_language']) == 5
          print(json.dumps(baseline, indent=2))
          PY
      - name: Commit frozen corpus and measured baseline
        run: |
          rm .github/workflows/agent-freeze-retrieval-corpus.yml
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-cli/src/bench/retrieval.rs benchmarks/retrieval-cases.json benchmarks/retrieval-baseline.json .github/workflows/agent-freeze-retrieval-corpus.yml
          git commit -m "test(bench): freeze hardened retrieval corpus baseline"
          git push origin HEAD:agent/context-retrieval-benchmark
