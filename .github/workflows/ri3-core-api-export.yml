name: RI3 core relationship API export

on:
  push:
    branches:
      - agent/ri3-core-authority-final

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-authority-final
          fetch-depth: 0
      - name: Export complete relationship API
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/open-kioku-core/src/lib.rs")
          text = path.read_text()
          old = "pub use relationship::{RelationshipAuthority, RelationshipProof, RelationshipProofKind};"
          new = """pub use relationship::{
              normalize_relationship_proofs, relationship_authority, RelationshipAuthority,
              RelationshipProof, RelationshipProofFilter, RelationshipProofKind,
              RELATIONSHIP_PROOFS_PROPERTY,
          };"""
          if text.count(old) != 1:
              raise SystemExit(f"relationship export seam count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - name: Validate core API
        run: |
          cargo fmt --all
          cargo test -p open-kioku-core
      - name: Commit export and remove helper
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-core-api-export.yml
          git add crates/open-kioku-core/src/lib.rs
          git commit -m "refactor(ri3): export core relationship authority API"
          git push origin HEAD:agent/ri3-core-authority-final
