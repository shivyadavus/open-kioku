name: Semantic source generation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/cc5-semantic-source-generation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply freshness patch and focused test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/open-kioku-semantic/src/lib.rs')
          text = path.read_text()
          replacements = [
              (
                  'const SCHEMA_VERSION: u32 = 1;',
                  'const SCHEMA_VERSION: u32 = 2;',
              ),
              (
                  '''    pub source_commit: Option<String>,\n    pub created_at: String,\n''',
                  '''    pub source_commit: Option<String>,\n    #[serde(default)]\n    pub source_index_fingerprint: Option<String>,\n    pub created_at: String,\n''',
              ),
              (
                  '''        let corrupt = manifest\n            .as_ref()\n            .map(|manifest| !index_artifacts_present(&current, &manifest.backend))\n            .unwrap_or(true);\n        let stale = manifest\n            .as_ref()\n            .map(|manifest| !self.compatible(manifest))\n            .unwrap_or(false);\n        if stale {\n            notes.push("semantic index manifest is stale for the current semantic config".into());\n        }\n''',
                  '''        let corrupt = manifest\n            .as_ref()\n            .map(|manifest| !index_artifacts_present(&current, &manifest.backend))\n            .unwrap_or(true);\n        let source_stale = manifest\n            .as_ref()\n            .is_some_and(|manifest| !self.source_generation_compatible(manifest));\n        let stale = manifest\n            .as_ref()\n            .map(|manifest| !self.compatible(manifest))\n            .unwrap_or(false);\n        if source_stale {\n            notes.push(\n                "semantic index is stale for the current authoritative index generation; rebuild semantic index"\n                    .into(),\n            );\n        } else if stale {\n            notes.push("semantic index manifest is stale for the current semantic config".into());\n        }\n''',
              ),
              (
                  '''            source_commit: self\n                .store\n                .manifest()\n                .ok()\n                .flatten()\n                .and_then(|manifest| manifest.repository.commit),\n            created_at: Utc::now().to_rfc3339(),\n''',
                  '''            source_commit: self\n                .store\n                .manifest()\n                .ok()\n                .flatten()\n                .and_then(|manifest| manifest.repository.commit),\n            source_index_fingerprint: Some(source_index_fingerprint(self.store)?),\n            created_at: Utc::now().to_rfc3339(),\n''',
              ),
              (
                  '''    fn compatible(&self, manifest: &SemanticManifest) -> bool {\n        manifest.schema_version == SCHEMA_VERSION\n''',
                  '''    fn compatible(&self, manifest: &SemanticManifest) -> bool {\n        manifest.schema_version == SCHEMA_VERSION\n            && self.source_generation_compatible(manifest)\n''',
              ),
              (
                  '''            && resolved_backend_from_name(&manifest.backend)\n                .is_ok_and(|backend| manifest.index_version == index_version_for_backend(backend))\n    }\n\n    fn vectors_dir(&self) -> PathBuf {\n''',
                  '''            && resolved_backend_from_name(&manifest.backend)\n                .is_ok_and(|backend| manifest.index_version == index_version_for_backend(backend))\n    }\n\n    fn source_generation_compatible(&self, manifest: &SemanticManifest) -> bool {\n        source_index_fingerprint(self.store).is_ok_and(|fingerprint| {\n            manifest.source_index_fingerprint.as_deref() == Some(fingerprint.as_str())\n        })\n    }\n\n    fn vectors_dir(&self) -> PathBuf {\n''',
              ),
              (
                  '''fn cache_key(target: &SemanticTarget, config: &SemanticConfig) -> String {\n''',
                  '''fn source_index_fingerprint(store: &dyn MetadataStore) -> Result<String> {\n    let manifest = store.manifest()?.ok_or_else(|| {\n        OkError::Storage(\n            "authoritative index manifest is missing; run `ok index .` before semantic indexing"\n                .into(),\n        )\n    })?;\n    let raw = serde_json::to_vec(&manifest)?;\n    let mut hasher = Sha256::new();\n    hasher.update(b"open-kioku-semantic-source-index-v1\\0");\n    hasher.update(raw);\n    Ok(format!("{:x}", hasher.finalize()))\n}\n\nfn cache_key(target: &SemanticTarget, config: &SemanticConfig) -> String {\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cargo fmt --all
          cargo test -p open-kioku-semantic --test source_freshness
          cargo test -p open-kioku-semantic --test ann_churn

          unexpected="$(git diff --name-only | grep -Ev '^(crates/open-kioku-semantic/src/lib.rs|crates/open-kioku-semantic/tests/source_freshness.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected source changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          rm .github/workflows/semantic-source-generation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-semantic/src/lib.rs crates/open-kioku-semantic/tests/source_freshness.rs .github/workflows/semantic-source-generation-patch.yml
          git commit -m "feat(semantic): bind generations to authoritative index state"
          git push origin HEAD:${{ github.head_ref }}
