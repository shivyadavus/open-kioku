name: RI3 semantics staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  stage-and-validate:
    if: github.head_ref == 'agent/ri3-analysis-semantics-fingerprint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage durable semantic compatibility changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ri3-semantics-stage.py')
          text = path.read_text()
          old = '''            if "IndexManifest {" not in line or "struct IndexManifest" in line:\n                continue\n'''
          new = '''            prefix = line.split("IndexManifest {", 1)[0]\n            if (\n                "IndexManifest {" not in line\n                or "struct IndexManifest" in line\n                or "->" in prefix\n            ):\n                continue\n'''
          if old not in text:
              raise SystemExit('manifest scanner patch point missing')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/ri3-semantics-stage.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-cli/src/bench/relationship_live.rs')
          text = path.read_text()
          old = '''fn live_relationship_run_metadata(\n    corpus: &RelationshipBenchCorpus,\n) -> anyhow::Result<RelationshipBenchRunMetadata> {\n'''
          new = '''fn live_relationship_run_metadata(\n    _corpus: &RelationshipBenchCorpus,\n) -> anyhow::Result<RelationshipBenchRunMetadata> {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'relationship benchmark metadata parameter patch count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Core semantics tests
        run: cargo test -p open-kioku-core analysis_semantics
      - name: Storage compatibility tests
        run: cargo test -p open-kioku-storage
      - name: Watch compatibility tests
        run: cargo test -p open-kioku-watch
      - name: Ingest compile and tests
        run: cargo test -p open-kioku-ingest
      - name: Relationship live compile
        run: cargo check -p open-kioku-cli
      - name: Targeted clippy
        run: cargo clippy -p open-kioku-core -p open-kioku-storage -p open-kioku-watch -p open-kioku-ingest -p open-kioku-cli --all-targets --all-features -- -D warnings
      - name: Commit durable changes and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/ri3-semantics-stage.yml scripts/ri3-semantics-stage.py
          if git diff --quiet && git diff --cached --quiet; then
            echo "No durable changes to commit"
            exit 1
          fi
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "feat(ri3): persist analysis semantics compatibility"
          git push origin HEAD:agent/ri3-analysis-semantics-fingerprint
