name: Agent CC6 self-review fix
on:
  push:
    branches: [agent/cc6-frozen-calibration]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc6-frozen-calibration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate self-review fix
        run: |
          echo '' | base64 -d >/tmp/fix.py
          python3 /tmp/fix.py
          cargo fmt --all
          cargo test -p open-kioku-cli cc6_calibration
          cargo test -p open-kioku-cli retrieval_bench_tests
      - name: Commit fix
        run: |
          rm .github/workflows/agent-cc6-self-review-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-cli/src/bench/retrieval.rs .github/workflows/agent-cc6-self-review-fix.yml
          git commit -m "fix(cc6): fail closed on missing calibration provenance"
          git push origin HEAD:agent/cc6-frozen-calibration
