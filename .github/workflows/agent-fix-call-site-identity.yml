name: agent-fix-call-site-identity

on:
  push:
    branches:
      - agent/v2-semantic-resolution-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-resolution-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch call-site identity and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-tree-sitter/src/lib.rs')
          text = path.read_text()
          old = '''        let call_id = CallSiteId::new(format!(
              "{}:call:{}:{}:{}",
              file.path.display(),
              range.start_line,
              range.start_column,
              callee_name
          ));'''
          new = '''        let call_id = CallSiteId::new(format!(
              "{}:call:{}:{}:{}:{}:{}",
              file.path.display(),
              range.start_line,
              range.start_column,
              range.end_line,
              range.end_column,
              callee_name
          ));'''
          if old not in text:
              raise SystemExit('expected call-site identity block not found; refusing to patch')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          mkdir -p crates/open-kioku-tree-sitter/tests
          cat > crates/open-kioku-tree-sitter/tests/call_site_identity.rs <<'RS'
          use open_kioku_core::{File, FileId, Language, RepositoryId};
          use open_kioku_tree_sitter::parse_file;
          use std::collections::HashSet;

          #[test]
          fn chained_same_name_calls_have_distinct_ids() {
              let file = File {
                  id: FileId::new("file-rust-call-identity"),
                  repository_id: RepositoryId::new("repo"),
                  path: "src/lib.rs".into(),
                  language: Language::Rust,
                  size_bytes: 0,
                  content_hash: "hash".into(),
                  is_generated: false,
                  is_vendor: false,
              };
              let code = r#"
          struct Repo;
          impl Repo {
              fn save(&self) -> &Self { self }
          }
          fn run(repo: &Repo) {
              repo.save().save();
          }
          "#;

              let facts = parse_file(&file, code).expect("Rust fixture should parse");
              let save_calls = facts
                  .calls
                  .iter()
                  .filter(|call| call.callee_name == "save")
                  .collect::<Vec<_>>();

              assert_eq!(save_calls.len(), 2, "fixture must contain two nested save calls");
              let unique_ids = save_calls
                  .iter()
                  .map(|call| call.id.clone())
                  .collect::<HashSet<_>>();
              assert_eq!(unique_ids.len(), 2, "distinct call AST nodes need distinct IDs");
              assert_ne!(save_calls[0].range, save_calls[1].range);
          }
          RS

          rm .github/workflows/agent-fix-call-site-identity.yml
          cargo fmt --all
          cargo test -p open-kioku-tree-sitter
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-tree-sitter/src/lib.rs crates/open-kioku-tree-sitter/tests/call_site_identity.rs .github/workflows/agent-fix-call-site-identity.yml
          git commit -m "fix: make call-site identities range-stable"
          git push origin HEAD:agent/v2-semantic-resolution-pipeline
