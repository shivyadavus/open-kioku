name: RI3 conformance mainline port

on:
  push:
    branches:
      - agent/ri3-conformance-mainline
    paths:
      - .github/workflows/ri3-conformance-mainline-port.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-conformance-mainline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Fetch validated scorer source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/ri3-relationship-conformance-benchmark
          git cat-file -e 093e913b2e86e24fc9053c3f85847032bce2168b^{commit}

      - name: Port scorer and thresholds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/open-kioku-cli/src/bench benchmarks
          git show 093e913b2e86e24fc9053c3f85847032bce2168b:crates/open-kioku-cli/src/bench/relationship.rs > crates/open-kioku-cli/src/bench/relationship.rs
          git show 093e913b2e86e24fc9053c3f85847032bce2168b:benchmarks/relationship-thresholds.json > benchmarks/relationship-thresholds.json
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "Current top-level commands (37): `init`, `index`, `snapshot`, `watch`, `status`, `doctor`, `setup`, `demo`, `search`, `semantic`, `symbol`, `explain`, `impact`, `path`, `tests`, `context`, `retrieve-context`, `plan`, `preflight`, `verify-boundary`, `verify`, `contract`, `bench`, `workflow-bench`, `retrieval-bench`, `contract-bench`, `eval`, `prove`, `adr`, `ui`, `architecture`, `history`, `patch`, `memory`, `mcp`, `scip`, and `graph`."
          new = "Current top-level commands (38): `init`, `index`, `snapshot`, `watch`, `status`, `doctor`, `setup`, `demo`, `search`, `semantic`, `symbol`, `explain`, `impact`, `path`, `tests`, `context`, `retrieve-context`, `plan`, `preflight`, `verify-boundary`, `verify`, `contract`, `bench`, `workflow-bench`, `retrieval-bench`, `relationship-bench`, `contract-bench`, `eval`, `prove`, `adr`, `ui`, `architecture`, `history`, `patch`, `memory`, `mcp`, `scip`, and `graph`."
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("README command inventory anchor mismatch")
              readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "crates/open-kioku-cli/src/lib.rs",
              'include!("bench/mod.rs");\n',
              'include!("bench/mod.rs");\ninclude!("bench/relationship.rs");\n',
          )

          replace_once(
              "crates/open-kioku-cli/src/commands/mod.rs",
              "        Command::ContractBench(args) => {\n",
              "        Command::RelationshipBench(args) => {\n            run_relationship_bench_command(args, cli.json)?;\n        }\n        Command::ContractBench(args) => {\n",
          )

          replace_once(
              "crates/open-kioku-cli/src/types.rs",
              "    RetrievalBench(RetrievalBenchArgs),\n",
              "    RetrievalBench(RetrievalBenchArgs),\n    RelationshipBench(RelationshipBenchArgs),\n",
          )

          relationship_args = '''#[derive(Args)]
          struct RelationshipBenchArgs {
              /// Versioned JSON relationship conformance corpus.
              #[arg(long, value_name = "CORPUS_JSON")]
              corpus: PathBuf,

              /// JSON observations produced by a resolver/index run.
              #[arg(long, value_name = "OBSERVATIONS_JSON")]
              observations: PathBuf,

              /// Optional path for the deterministic JSON score report.
              #[arg(long, value_name = "REPORT_JSON")]
              write: Option<PathBuf>,

              /// Versioned JSON release-gate policy. When supplied, gate results are included in the report.
              #[arg(long, value_name = "POLICY_JSON")]
              policy: Option<PathBuf>,

              /// Exit non-zero unless every configured release gate passes.
              #[arg(long, default_value_t = false)]
              enforce_gates: bool,
          }

          '''
          replace_once(
              "crates/open-kioku-cli/src/types.rs",
              "#[derive(Args)]\nstruct ContractBenchArgs {\n",
              relationship_args + "#[derive(Args)]\nstruct ContractBenchArgs {\n",
          )
          PY

      - name: Format and validate focused scorer surface
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli --lib relationship
          scripts/validate-docs.sh
          git diff --check

      - name: Commit clean product port
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            benchmarks/relationship-thresholds.json \
            crates/open-kioku-cli/src/bench/relationship.rs \
            crates/open-kioku-cli/src/commands/mod.rs \
            crates/open-kioku-cli/src/lib.rs \
            crates/open-kioku-cli/src/types.rs
          git commit -m "RI3.4: port relationship conformance scorer onto mainline"
          git rm .github/workflows/ri3-conformance-mainline-port.yml
          git commit -m "chore: remove RI3 conformance port gate"
          git push origin HEAD:agent/ri3-conformance-mainline
