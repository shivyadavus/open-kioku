name: RI3 language semantics staging

on:
  push:
    branches:
      - "agent/ri3-language-semantics-complete"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused RI3 changes
        run: python3 scripts/ri3-language-semantics-stage.py

      - name: Validate focused RI3 surface
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-languages
          cargo test -p open-kioku-tree-sitter rust_scoped_paths_distinguish_modules_from_instance_self
          cargo test -p open-kioku-tree-sitter rust_crate_qualified_call_is_module_receiver
          cargo test -p open-kioku-resolution language_capabilities
          cargo test -p open-kioku-resolution rust_module_symbol_names_match_tree_sitter_qualified_names
          cargo test -p open-kioku-mcp test_get_evidence_schema_shape

      - name: Commit durable change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ri3-language-semantics-stage.yml
          git rm scripts/ri3-language-semantics-stage.py
          git add \
            crates/open-kioku-mcp/Cargo.toml \
            crates/open-kioku-mcp/src/lib.rs \
            crates/open-kioku-tree-sitter/Cargo.toml \
            crates/open-kioku-tree-sitter/src/lib.rs \
            crates/open-kioku-resolution/src/typed_calls.rs \
            Cargo.lock
          git diff --cached --check
          git commit -m "complete RI3 language semantic resolution"
          git push
