name: RI3 semantic read-safety staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  stage-and-validate:
    if: github.head_ref == 'agent/ri3-analysis-semantics-fingerprint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Stage semantic read-safety integration
        run: python3 scripts/ri3-semantics-enforce.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Context regression tests
        run: cargo test -p open-kioku-context
      - name: MCP regression tests
        run: cargo test -p open-kioku-mcp
      - name: CLI regression tests
        run: cargo test -p open-kioku-cli
      - name: Strict targeted clippy
        run: cargo clippy -p open-kioku-context -p open-kioku-mcp -p open-kioku-cli --all-targets --all-features -- -D warnings
      - name: Commit durable changes and remove staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/ri3-semantics-enforce.yml scripts/ri3-semantics-enforce.py
          if git diff --quiet && git diff --cached --quiet; then
            echo "No durable changes to commit"
            exit 1
          fi
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "feat(ri3): fail closed on stale semantic evidence"
          git push origin HEAD:agent/ri3-analysis-semantics-fingerprint
