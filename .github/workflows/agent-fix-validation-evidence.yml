name: agent-fix-validation-evidence

on:
  push:
    branches:
      - agent/v2-semantic-resolution-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-resolution-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and validate evidence-prioritized validation selection
        run: |
          python3 .github/patch_validation_evidence.py
          rm .github/patch_validation_evidence.py
          rm .github/workflows/agent-fix-validation-evidence.yml
          cargo fmt --all
          cargo test -p open-kioku-context
          cargo test -p open-kioku-plan plan_surfaces_runtime_signals_and_attribution
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-context/src/lib.rs crates/open-kioku-plan/src/lib.rs .github/patch_validation_evidence.py .github/workflows/agent-fix-validation-evidence.yml
          git commit -m "fix: prioritize evidence-backed validation seeds"
          git push origin HEAD:agent/v2-semantic-resolution-pipeline
