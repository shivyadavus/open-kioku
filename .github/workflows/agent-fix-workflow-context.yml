name: agent-fix-workflow-context

on:
  push:
    branches:
      - agent/v2-semantic-resolution-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-resolution-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize natural-language workflow terms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-context/src/lib.rs')
          text = path.read_text()
          marker = '        "histories" => "history".into(),\n'
          addition = marker + '        "verify" | "verifies" | "verified" | "verifying" => "verification".into(),\n' + '        "changed" | "changes" | "changing" => "change".into(),\n' + '        "plans" | "planned" | "planning" => "plan".into(),\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one history alias marker, found {text.count(marker)}')
          if '"verify" | "verifies"' in text:
              raise SystemExit('verification aliases already present; refusing duplicate patch')
          path.write_text(text.replace(marker, addition, 1))
          PY

          mkdir -p crates/open-kioku-context/tests
          cat > crates/open-kioku-context/tests/workflow_terms.rs <<'RS'
          use open_kioku_context::expanded_task_search_terms;

          #[test]
          fn verification_workflow_language_expands_to_code_vocabulary() {
              let terms = expanded_task_search_terms("verify changed files against saved plans");

              assert!(terms.iter().any(|term| term == "verification"));
              assert!(terms.iter().any(|term| term == "change"));
              assert!(terms.iter().any(|term| term == "plan"));
              assert!(terms.iter().any(|term| term == "verification change"));
              assert!(terms.iter().any(|term| term == "saved plan"));
          }
          RS

          rm .github/workflows/agent-fix-workflow-context.yml
          cargo fmt --all
          cargo test -p open-kioku-context
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-context/src/lib.rs crates/open-kioku-context/tests/workflow_terms.rs .github/workflows/agent-fix-workflow-context.yml
          git commit -m "fix: normalize verification workflow context terms"
          git push origin HEAD:agent/v2-semantic-resolution-pipeline
