name: RI3 relationship scorer

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Repair scorer namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-cli/src/bench/relationship.rs')
          text = path.read_text()
          if 'fn ratio(' not in text:
              raise SystemExit('relationship scorer ratio helper seam changed')
          path.write_text(text.replace('ratio(', 'relationship_ratio('))
          PY

      - name: Validate relationship benchmark scorer
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli relationship_bench_tests

      - name: Commit validated scorer
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-relationship-scorer.yml
          git add crates/open-kioku-cli/src/lib.rs crates/open-kioku-cli/src/bench/relationship.rs
          git commit -m "ri3: validate relationship conformance scorer foundation"
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
