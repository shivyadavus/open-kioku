name: RI3 relationship scorer

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Wire relationship benchmark command
        run: python3 scripts/ri3_relationship_scorer_tmp.py

      - name: Validate relationship benchmark scorer
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli relationship_bench_tests

      - name: Commit validated scorer
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-relationship-scorer.yml scripts/ri3_relationship_scorer_tmp.py
          git add crates/open-kioku-cli/src/lib.rs crates/open-kioku-cli/src/types.rs crates/open-kioku-cli/src/commands/mod.rs crates/open-kioku-cli/src/bench/relationship.rs
          git commit -m "ri3: add relationship conformance scorer command"
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
