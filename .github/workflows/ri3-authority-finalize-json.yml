name: RI3 authority finalize structured

on:
  push:
    branches:
      - agent/ri3-core-authority-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-authority-final
          fetch-depth: 0

      - name: Consolidate single authority policy
        shell: python
        run: |
          from pathlib import Path
          import json

          evidence = Path("crates/open-kioku-evidence/src/lib.rs")
          text = evidence.read_text()

          old_imports = """use open_kioku_core::{Confidence, Evidence, FileRange, GraphEdge, GraphEdgeType, SymbolId};
          pub use open_kioku_core::{RelationshipAuthority, RelationshipProof, RelationshipProofKind};
          use open_kioku_errors::OkError;
          use open_kioku_storage::GraphStore;
          use schemars::JsonSchema;
          use serde::{Deserialize, Serialize};
          use std::collections::BTreeSet;
          """.replace("          ", "")
          new_imports = """use open_kioku_core::{Confidence, Evidence, GraphEdge, GraphEdgeType};
          pub use open_kioku_core::{
              normalize_relationship_proofs, relationship_authority, RelationshipAuthority,
              RelationshipProof, RelationshipProofFilter, RelationshipProofKind,
              RELATIONSHIP_PROOFS_PROPERTY,
          };
          use open_kioku_errors::OkError;
          use open_kioku_storage::GraphStore;
          use schemars::JsonSchema;
          use serde::{Deserialize, Serialize};
          #[cfg(test)]
          use open_kioku_core::{FileRange, SymbolId};
          #[cfg(test)]
          use std::collections::BTreeSet;
          """.replace("          ", "")
          if text.count(old_imports) != 1:
              raise SystemExit(f"unexpected evidence imports: {text.count(old_imports)}")
          text = text.replace(old_imports, new_imports, 1)

          start = text.index("/// Structured property key used to persist relationship proofs on existing graph edges.")
          end = text.index("pub const DEFAULT_RELATIONSHIP_EDGE_QUERY_LIMIT: usize = 100;")
          compatibility = """/// Compatibility wrapper for callers that imported this helper from the evidence crate.
          pub fn proof_kind_authority(kind: RelationshipProofKind) -> RelationshipAuthority {
              kind.maximum_authority()
          }

          /// Backward-compatible facade over the core-owned inherent `GraphEdge` proof API.
          pub trait GraphEdgeRelationshipProofExt {
              fn try_relationship_proofs(&self) -> Result<Vec<RelationshipProof>, serde_json::Error>;
              fn relationship_proofs(&self) -> Vec<RelationshipProof>;
              fn set_relationship_proofs(
                  &mut self,
                  proofs: Vec<RelationshipProof>,
              ) -> Result<(), serde_json::Error>;
              fn relationship_authority(&self) -> RelationshipAuthority;
              fn is_authoritative_relationship(&self) -> bool;
              fn has_relationship_proof_kind(&self, kind: RelationshipProofKind) -> bool;
          }

          impl GraphEdgeRelationshipProofExt for GraphEdge {
              fn try_relationship_proofs(&self) -> Result<Vec<RelationshipProof>, serde_json::Error> {
                  GraphEdge::try_relationship_proofs(self)
              }

              fn relationship_proofs(&self) -> Vec<RelationshipProof> {
                  GraphEdge::relationship_proofs(self)
              }

              fn set_relationship_proofs(
                  &mut self,
                  proofs: Vec<RelationshipProof>,
              ) -> Result<(), serde_json::Error> {
                  GraphEdge::set_relationship_proofs(self, proofs)
              }

              fn relationship_authority(&self) -> RelationshipAuthority {
                  GraphEdge::relationship_authority(self)
              }

              fn is_authoritative_relationship(&self) -> bool {
                  GraphEdge::is_authoritative_relationship(self)
              }

              fn has_relationship_proof_kind(&self, kind: RelationshipProofKind) -> bool {
                  GraphEdge::has_relationship_proof_kind(self, kind)
              }
          }

          """.replace("          ", "")
          text = text[:start] + compatibility + text[end:]

          short_page = "            if batch_len < batch_limit {\n                source_exhausted = true;\n                break;\n            }\n"
          if text.count(short_page) != 1:
              raise SystemExit(f"short-page assumption count={text.count(short_page)}")
          text = text.replace(short_page, "", 1)

          fixture_anchor = "    #[test]\n    fn exact_occurrence_proves_reference_relationship() {"
          if text.count(fixture_anchor) != 1:
              raise SystemExit(f"fixture anchor count={text.count(fixture_anchor)}")
          fixture = """    struct CappedPageGraphStore {
              edges: Vec<GraphEdge>,
              page_cap: usize,
          }

          impl GraphStore for CappedPageGraphStore {
              fn replace_graph(&self, _nodes: &[GraphNode], _edges: &[GraphEdge]) -> Result<(), OkError> {
                  Ok(())
              }

              fn neighbors(
                  &self,
                  _node: &str,
                  _limit: usize,
              ) -> Result<(Vec<GraphNode>, Vec<GraphEdge>), OkError> {
                  Ok((Vec::new(), Vec::new()))
              }

              fn shortest_path(
                  &self,
                  _from: &str,
                  _to: &str,
                  _max_depth: usize,
              ) -> Result<Vec<GraphEdge>, OkError> {
                  Ok(Vec::new())
              }

              fn edges_by_type(
                  &self,
                  edge_type: GraphEdgeType,
                  limit: usize,
                  offset: usize,
              ) -> Result<Vec<GraphEdge>, OkError> {
                  Ok(self
                      .edges
                      .iter()
                      .filter(|edge| edge.edge_type == edge_type)
                      .skip(offset)
                      .take(limit.min(self.page_cap))
                      .cloned()
                      .collect())
              }
          }

          """ + fixture_anchor
          text = text.replace(fixture_anchor, fixture, 1)

          regression_anchor = "    #[test]\n    fn graph_store_query_reports_scan_truncation() {"
          if text.count(regression_anchor) != 1:
              raise SystemExit(f"regression anchor count={text.count(regression_anchor)}")
          regression = """    #[test]
          fn graph_store_query_continues_after_short_pages() {
              let store = CappedPageGraphStore {
                  edges: vec![
                      legacy_reference_edge("legacy"),
                      reference_edge(
                          "authoritative",
                          vec![proof(RelationshipProofKind::ExactReference, 1)],
                      ),
                  ],
                  page_cap: 1,
              };
              let query = RelationshipEdgeQuery {
                  edge_type: GraphEdgeType::References,
                  filter: RelationshipProofFilter {
                      minimum_authority: RelationshipAuthority::Authoritative,
                      accepted_proof_kinds: None,
                  },
                  limit: 1,
                  offset: 0,
                  scan_limit: 100,
              };

              let result = store.query_relationship_edges(&query).unwrap();
              assert_eq!(result.edges.len(), 1);
              assert_eq!(result.edges[0].id.0, "authoritative");
              assert_eq!(result.scanned_edges, 2);
              assert!(!result.scan_truncated);
          }

          """ + regression_anchor
          text = text.replace(regression_anchor, regression, 1)
          evidence.write_text(text)

          snapshot_path = Path("crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json")
          snapshot = json.loads(snapshot_path.read_text())
          result = snapshot.get("result", snapshot)
          edge_types = result["edge_types"]
          if not any(edge.get("name") == "UsesType" for edge in edge_types):
              insert_at = next(i for i, edge in enumerate(edge_types) if edge.get("name") == "Calls")
              edge_types.insert(insert_at, {
                  "count": 0,
                  "description": "Edge of type UsesType",
                  "evidence_available": False,
                  "name": "UsesType",
                  "required_evidence": [],
                  "source_types": [],
                  "stable": True,
                  "target_types": [],
              })
          flags = result["feature_flags"]
          if "relationship_proofs" not in flags:
              insert_at = flags.index("read_only_graph_query")
              flags.insert(insert_at, "relationship_proofs")
          snapshot_path.write_text(json.dumps(snapshot, indent=2) + "\n")

      - name: Validate trust boundaries
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-mcp --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-mcp

      - name: Commit validated product result
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/open-kioku-evidence/src/lib.rs crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json
          git commit -m "refactor(ri3): finalize single authority contract"
          git push origin HEAD:agent/ri3-core-authority-final
