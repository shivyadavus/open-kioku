name: V3 release preparation

on:
  push:
    branches:
      - release/v3.0.0
    paths:
      - .github/workflows/v3-release-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prepared_sha: ${{ steps.commit.outputs.prepared_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply V3 version migration and release hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = "3.0.0"

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cargo = Path("Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          pattern = re.compile(r'(\[workspace\.package\][\s\S]*?^version = ")[^"]+("$)', re.MULTILINE)
          text, count = pattern.subn(rf'\g<1>{VERSION}\2', text, count=1)
          if count != 1:
              raise SystemExit("Cargo.toml: could not update workspace package version")
          cargo.write_text(text, encoding="utf-8")

          sync = Path("scripts/sync-version.sh")
          sync_text = sync.read_text(encoding="utf-8")
          marker = "# ── Internal Cargo path dependency versions"
          if marker not in sync_text:
              anchor = 'echo "Syncing version $VERSION to marketplace manifests..."\n\n'
              block = r'''# ── Internal Cargo path dependency versions ──────────────────────────────────
          # Workspace crates publish in lockstep. Keep every sibling path dependency on the
          # canonical workspace version so major-version releases remain publishable.
          python3 - "$ROOT" "$VERSION" <<'PY_CARGO_SYNC'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          version = sys.argv[2]
          dependency = re.compile(r'^\s*open-kioku-[A-Za-z0-9_-]+\s*=\s*\{')
          sibling_path = re.compile(r'path\s*=\s*"\.\./open-kioku-[^"]+"')
          version_field = re.compile(r'version\s*=\s*"[^"]+"')

          for cargo_toml in sorted((root / "crates").glob("*/Cargo.toml")):
              lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)
              changed = False
              output = []
              for line in lines:
                  if dependency.match(line) and sibling_path.search(line):
                      if version_field.search(line):
                          updated = version_field.sub(f'version = "{version}"', line, count=1)
                      else:
                          updated = line.replace("{", f'{{ version = "{version}",', 1)
                          updated = updated.replace(",path", ", path", 1)
                      changed |= updated != line
                      line = updated
                  output.append(line)
              if changed:
                  cargo_toml.write_text("".join(output), encoding="utf-8")
                  print(f"  ✓ {cargo_toml.relative_to(root)} internal dependencies")
          PY_CARGO_SYNC

          '''
              if sync_text.count(anchor) != 1:
                  raise SystemExit("sync-version.sh: insertion anchor mismatch")
              sync.write_text(sync_text.replace(anchor, anchor + block, 1), encoding="utf-8")

          validator = Path("scripts/validate-release-metadata.py")
          validator_text = validator.read_text(encoding="utf-8")
          if "def check_internal_cargo_dependencies(" not in validator_text:
              anchor = "def check_formula(metadata: dict, version: str, errors: list[str]) -> None:\n"
              function = '''def check_internal_cargo_dependencies(version: str, errors: list[str]) -> None:
              sections = ("dependencies", "dev-dependencies", "build-dependencies")

              def check_table(path: Path, table: dict) -> None:
                  for section in sections:
                      for name, spec in table.get(section, {}).items():
                          if not name.startswith("open-kioku-") or not isinstance(spec, dict):
                              continue
                          if not spec.get("path"):
                              continue
                          found = spec.get("version")
                          if found != version:
                              fail(
                                  f"{path.relative_to(ROOT)} internal dependency {name} has version {found!r}; expected {version}",
                                  errors,
                              )

              for path in sorted((ROOT / "crates").glob("*/Cargo.toml")):
                  data = tomllib.loads(load_text(path))
                  check_table(path, data)
                  for target in data.get("target", {}).values():
                      if isinstance(target, dict):
                          check_table(path, target)


          '''
              if validator_text.count(anchor) != 1:
                  raise SystemExit("validate-release-metadata.py: function anchor mismatch")
              validator_text = validator_text.replace(anchor, function + anchor, 1)

          call_anchor = "    check_git_tag(version, metadata.get(\"tag\"), errors)\n"
          call = call_anchor + "    check_internal_cargo_dependencies(version, errors)\n"
          if "    check_internal_cargo_dependencies(version, errors)\n" not in validator_text:
              if validator_text.count(call_anchor) != 1:
                  raise SystemExit("validate-release-metadata.py: call anchor mismatch")
              validator_text = validator_text.replace(call_anchor, call, 1)

          required_anchor = '        "scripts/generate-release-trust-artifacts.sh",\n'
          required_line = '        "scripts/verify-release-artifact-hashes.py",\n'
          if required_line not in validator_text:
              if validator_text.count(required_anchor) != 1:
                  raise SystemExit("validate-release-metadata.py: workflow requirement anchor mismatch")
              validator_text = validator_text.replace(required_anchor, required_anchor + required_line, 1)
          validator.write_text(validator_text, encoding="utf-8")

          verifier = Path("scripts/verify-release-artifact-hashes.py")
          verifier.write_text('''#!/usr/bin/env python3
          """Verify built release binaries against release-metadata.json SHA-256 values."""

          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def main() -> int:
              dist = Path(sys.argv[1] if len(sys.argv) > 1 else "dist")
              if not dist.is_absolute():
                  dist = ROOT / dist
              metadata = json.loads((ROOT / "release-metadata.json").read_text(encoding="utf-8"))
              errors = []
              checked = 0
              for artifact in metadata.get("artifacts", []):
                  expected = artifact.get("sha256")
                  if expected is None:
                      continue
                  path = dist / artifact["name"]
                  if not path.is_file():
                      errors.append(f"missing release binary: {artifact['name']}")
                      continue
                  actual = sha256(path)
                  checked += 1
                  if actual != expected:
                      errors.append(
                          f"{artifact['name']} sha256 mismatch: metadata={expected} built={actual}"
                      )
                  sidecar = dist / f"{artifact['name']}.sha256"
                  if sidecar.is_file():
                      sidecar_hash = sidecar.read_text(encoding="utf-8").split()[0]
                      if sidecar_hash != actual:
                          errors.append(
                              f"{sidecar.name} records {sidecar_hash}, but built binary is {actual}"
                          )
              if checked == 0:
                  errors.append("release metadata contained no binary sha256 entries")
              if errors:
                  print("Release artifact hash verification failed:", file=sys.stderr)
                  for error in errors:
                      print(f"  - {error}", file=sys.stderr)
                  return 1
              print(f"Verified {checked} release binary hash(es) against release metadata.")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          '''.replace("          ", ""), encoding="utf-8")

          release = Path(".github/workflows/release.yml")
          release_text = release.read_text(encoding="utf-8")
          if "Verify release artifact hashes" not in release_text:
              anchor = '''      - uses: actions/download-artifact@v4
                  with:
                    path: dist
                    merge-multiple: true

                  - uses: dtolnay/rust-toolchain@stable
          '''.replace("              ", "")
              replacement = '''      - uses: actions/download-artifact@v4
                  with:
                    path: dist
                    merge-multiple: true

                  - name: Verify release artifact hashes
                    shell: bash
                    run: python3 scripts/verify-release-artifact-hashes.py dist

                  - uses: dtolnay/rust-toolchain@stable
          '''.replace("              ", "")
              if release_text.count(anchor) < 1:
                  raise SystemExit("release.yml: publish download anchor mismatch")
              release_text = release_text.replace(anchor, replacement, 1)
              release.write_text(release_text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text(encoding="utf-8")
          if "## [3.0.0]" not in changelog_text:
              section = '''## [3.0.0] — 2026-08-17

          ### Added
          - Added evidence-first routed context retrieval with provenance-aware bounded context, explicit blockers, and measured retrieval quality gates.
          - Added quality-tiered local neural embedding profiles alongside the deterministic local-hash baseline, with opt-in local model acquisition and provenance.
          - Added persistent local HNSW semantic indexing with exact-flat correctness fallback, persistence, filter parity, and scale calibration.
          - Added proof-carrying relationship authority and deterministic proof-gated structural resolution for calls, references, type use, inheritance, and imports.
          - Added the `ok relationship-bench` conformance scoring foundation with strict proof/range/outcome/metamorphic threshold policy and reproducibility metadata.

          ### Changed
          - Made `ResolutionMode::Shadow` the default so proof-gated structural relationships are operational while legacy evidence remains available for compatibility; explicit `Legacy` and `V2` modes remain available.
          - Made authoritative architecture/context consumers fail closed on unproven structural relationships instead of promoting heuristic confidence into graph truth.
          - Refreshed the homepage and README around the evidence-first workflow and real pinned-main dogfood proof.
          - Bumped the 43-crate workspace and all release/install channels to 3.0.0, including explicit 3.0.0 requirements for publishable internal Cargo path dependencies.
          - Hardened release publishing so built binary SHA-256 values must match checked-in release metadata before GitHub/npm publication.

          ### Fixed
          - Preserved typed authority for uniquely resolved import targets and exact Rust `crate::module::member()` calls without enabling fuzzy structural fallbacks.
          - Updated public quickstart validation to treat `ok setup agent ...` as the primary onboarding flow while retaining lower-level `init`, `index`, and manual MCP commands as supported primitives.

          ### Compatibility
          - Reindexing is recommended for 3.0. Existing heuristic structural edges from older indexes are not trusted as authoritative unless reconstructed with proof; relationship counts may decrease when ambiguous evidence correctly fails closed.
          - The checked-in relationship scorer is a conformance-scoring foundation; the full frozen >=300-case #240 corpus remains follow-up work and is not claimed complete by this release.

          ### Artifacts
          - `ok-linux-x86_64`
          - `ok-linux-x86_64.sha256`
          - `ok-linux-arm64`
          - `ok-linux-arm64.sha256`
          - `ok-macos-x86_64`
          - `ok-macos-x86_64.sha256`
          - `ok-macos-arm64`
          - `ok-macos-arm64.sha256`
          - `ok-windows-x86_64.exe`
          - `ok-windows-x86_64.exe.sha256`

          ---

          '''.replace("          ", "")
              anchor = "## [2.4.0] — 2026-08-14\n"
              if changelog_text.count(anchor) != 1:
                  raise SystemExit("CHANGELOG.md: 2.4.0 anchor mismatch")
              changelog_text = changelog_text.replace(anchor, section + anchor, 1)
              link_anchor = "[2.4.0]: https://github.com/shivyadavus/open-kioku/releases/tag/v2.4.0\n"
              link = "[3.0.0]: https://github.com/shivyadavus/open-kioku/releases/tag/v3.0.0\n"
              if changelog_text.count(link_anchor) != 1:
                  raise SystemExit("CHANGELOG.md: release-link anchor mismatch")
              changelog_text = changelog_text.replace(link_anchor, link + link_anchor, 1)
              changelog.write_text(changelog_text, encoding="utf-8")
          PY

          scripts/sync-version.sh
          cargo metadata --format-version 1 >/dev/null

      - name: Validate prepared V3 metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          scripts/validate-docs.sh
          scripts/validate-versions.sh
          scripts/check-no-ignored-tests.py
          git diff --check

      - name: Commit prepared release tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/v3-release-prep.yml
          git commit -m "release: prepare Open Kioku 3.0.0"
          git push origin HEAD:release/v3.0.0
          echo "prepared_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: ok-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: ok-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install cross --locked

      - name: Build V3 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }} -p open-kioku-cli
          else
            cargo build --release --target ${{ matrix.target }} -p open-kioku-cli
          fi

      - name: Package V3 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-musl|x86_64-apple-darwin|aarch64-apple-darwin)
                strip dist/${{ matrix.binary_name }}
                ;;
              *)
                echo "Skipping host strip for cross-compiled target ${{ matrix.target }}"
                ;;
            esac
          fi
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.binary_name }}
          path: dist/*

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Record actual V3 binary hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          metadata_path = Path("release-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          hashes = {}
          for artifact in metadata["artifacts"]:
              if "sha256" not in artifact:
                  continue
              binary = Path("dist") / artifact["name"]
              if not binary.is_file():
                  raise SystemExit(f"missing candidate binary {binary}")
              artifact["sha256"] = digest(binary)
              hashes[artifact["name"]] = artifact["sha256"]
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")

          formula = Path("Formula/open-kioku.rb")
          text = formula.read_text(encoding="utf-8")
          for name in ["ok-macos-arm64", "ok-macos-x86_64", "ok-linux-arm64", "ok-linux-x86_64"]:
              pattern = re.compile(
                  rf'(url "[^"]*/{re.escape(name)}"\n\s+sha256 ")[0-9a-f]{{64}}(")'
              )
              text, count = pattern.subn(rf'\g<1>{hashes[name]}\2', text, count=1)
              if count != 1:
                  raise SystemExit(f"Formula hash anchor missing for {name}")
          formula.write_text(text, encoding="utf-8")
          PY

          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh
          scripts/generate-release-trust-artifacts.sh dist
          git diff --check

      - name: Commit final release hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m "release: pin v3.0.0 candidate artifact hashes"

      - name: Validate publishable crates and release readiness
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION=3.0.0 scripts/publish-crates.sh --dry-run
          scripts/verify-release-readiness.sh
          scripts/validate-docs.sh
          scripts/validate-versions.sh

      - name: Self-clean preparation workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v3-release-prep.yml
          git commit -m "chore: remove v3 release preparation gate"
          git push origin HEAD:release/v3.0.0
