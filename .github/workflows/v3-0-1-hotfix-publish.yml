# trigger: v3.0.1 immediate hotfix publication
name: V3.0.1 ignore hotfix publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-0-1-hotfix-publish.yml

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: v3-0-1-hotfix-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: 3.0.1
  RELEASE_TAG: v3.0.1
  RELEASE_BRANCH: release/v3.0.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0

      - name: Guard immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists; refusing to rebuild or move it" >&2
            exit 1
          fi

      - name: Prepare 3.0.1 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text(encoding='utf-8')
          old = 'version = "3.0.0"'
          new = 'version = "3.0.1"'
          if old not in text:
              raise SystemExit('expected workspace version 3.0.0')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          scripts/sync-version.sh

          python3 - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## [3.0.1]' not in text:
              section = '''## [3.0.1] — 2026-08-19

### Fixed
- Fixed repository discovery so nested `.gitignore` rules remain scoped to their declaring directory instead of excluding unrelated source trees.
- Made Git authoritative for ignore decisions in Git repositories, preserving tracked-file semantics, nested negation, and standard Git excludes.
- Scoped nested `.okignore` rules to their declaring directory, protected large ignore batches from pipe deadlocks, and added a warning when filtering collapses a supported-source index to zero.

### Artifacts
- `ok-linux-x86_64`
- `ok-linux-x86_64.sha256`
- `ok-linux-arm64`
- `ok-linux-arm64.sha256`
- `ok-macos-arm64`
- `ok-macos-arm64.sha256`
- `ok-windows-x86_64.exe`
- `ok-windows-x86_64.exe.sha256`

---

'''
              marker = '## [3.0.0] — 2026-08-17\n'
              if marker not in text:
                  raise SystemExit('3.0.0 changelog marker missing')
              text = text.replace(marker, section + marker, 1)
          link = '[3.0.1]: https://github.com/shivyadavus/open-kioku/releases/tag/v3.0.1'
          if link not in text:
              text = text.rstrip() + '\n' + link + '\n'
          changelog.write_text(text, encoding='utf-8')
          PY

          cargo metadata --format-version 1 >/dev/null
          scripts/validate-versions.sh

      - name: Commit candidate release source
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 3.0.1 ignore hotfix"
          git push origin HEAD:"$RELEASE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Validate hotfix source
        shell: bash
        run: |
          set -euo pipefail
          scripts/validate-versions.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-ingest --test ignore_discovery -- --nocapture

  build:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ok-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zlib1g-dev libgomp1

      - name: Build release binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p open-kioku-cli

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.binary_name }}
          test "$(dist/${{ matrix.binary_name }} --version)" = "ok 3.0.1"

      - uses: actions/upload-artifact@v4
        with:
          name: v301-${{ matrix.binary_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: v301-*
          path: dist
          merge-multiple: true

      - name: Pin canonical artifact hashes
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          names = [
              'ok-linux-x86_64',
              'ok-linux-arm64',
              'ok-macos-arm64',
              'ok-windows-x86_64.exe',
          ]
          hashes = {}
          for name in names:
              data = Path('dist', name).read_bytes()
              hashes[name] = hashlib.sha256(data).hexdigest()

          metadata_path = Path('release-metadata.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          for artifact in metadata['artifacts']:
              if artifact['name'] in hashes:
                  artifact['sha256'] = hashes[artifact['name']]
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          formula_path = Path('Formula/open-kioku.rb')
          lines = formula_path.read_text(encoding='utf-8').splitlines()
          current = None
          for i, line in enumerate(lines):
              m = re.search(r'/([^/\"]+)\"$', line)
              if 'url ' in line and m:
                  current = m.group(1)
              elif current in hashes and 'sha256 ' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}sha256 "{hashes[current]}"'
                  current = None
          formula_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh

      - name: Commit final release metadata
        id: final
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m "release: pin 3.0.1 artifact hashes"
          git push origin HEAD:"$RELEASE_BRANCH"
          FINAL_SHA="$(git rev-parse HEAD)"
          git diff --quiet "$CANDIDATE_SHA" "$FINAL_SHA" -- \
            Cargo.toml Cargo.lock crates packages \
            .cursor-plugin .claude-plugin .codex-plugin claude_plugin.json
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Generate trust artifacts and release notes
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          env \
            GITHUB_SHA="$FINAL_SHA" \
            GITHUB_REF_NAME="$RELEASE_TAG" \
            GITHUB_WORKFLOW="V3.0.1 ignore hotfix publication" \
            scripts/generate-release-trust-artifacts.sh dist
          awk '/^## \[3\.0\.1\]/ {flag=1; print; next} /^## \[/ {if(flag) exit} flag' CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Attest canonical hotfix binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ok-linux-x86_64
            dist/ok-linux-arm64
            dist/ok-macos-arm64
            dist/ok-windows-x86_64.exe

      - name: Create immutable hotfix tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test -z "$(git tag -l "$RELEASE_TAG")"
          git tag -a "$RELEASE_TAG" HEAD -m "Open Kioku $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub hotfix release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: Open Kioku 3.0.1
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          pattern: v301-*
          path: dist
          merge-multiple: true

      - name: Inject canonical binaries into npm platform packages
        shell: bash
        run: |
          set -euo pipefail
          cp dist/ok-macos-arm64 packages/npm-darwin-arm64/ok
          cp dist/ok-linux-x86_64 packages/npm-linux-x64/ok
          cp dist/ok-linux-arm64 packages/npm-linux-arm64/ok
          cp dist/ok-windows-x86_64.exe packages/npm-win32-x64/ok.exe
          chmod +x packages/npm-darwin-arm64/ok packages/npm-linux-x64/ok packages/npm-linux-arm64/ok

      - name: Publish npm packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_package() {
            local package_dir="$1"
            local name version
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
            else
              (cd "$package_dir" && npm publish --access public)
            fi
          }
          for package in packages/npm-darwin-arm64 packages/npm-linux-x64 packages/npm-linux-arm64 packages/npm-win32-x64; do
            publish_package "$package"
          done
          publish_package packages/npm
          test "$(npm view open-kioku@3.0.1 version)" = "3.0.1"

  publish-crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Publish crates.io hotfix
        shell: bash
        env:
          EXPECTED_VERSION: 3.0.1
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --publish
