name: V3.0.1 hotfix registry repair

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/v3-0-1-release-trigger

permissions:
  contents: write

concurrency:
  group: v3-0-1-registry-repair
  cancel-in-progress: false

env:
  RELEASE_VERSION: 3.0.1
  RELEASE_TAG: v3.0.1
  RELEASE_BRANCH: release/v3.0.1

jobs:
  repair-crates:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Guard published hotfix identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test -n "$(git tag -l "$RELEASE_TAG")"
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])
          PY
          )" = "$RELEASE_VERSION"

      - name: Repair and preflight crates.io metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          def metadata():
              return json.loads(subprocess.check_output([
                  'cargo', 'metadata', '--no-deps', '--format-version', '1'
              ]))

          data = metadata()
          workspace_ids = set(data['workspace_members'])
          packages = [p for p in data['packages'] if p['id'] in workspace_ids]
          patched = []

          for package in packages:
              # Cargo represents publish = false as an empty registry list.
              if package.get('publish') == []:
                  continue

              missing_description = not (package.get('description') or '').strip()
              missing_license = not (package.get('license') or '').strip() and not package.get('license_file')
              missing_repository = not (package.get('repository') or '').strip()
              if not (missing_description or missing_license or missing_repository):
                  continue

              path = Path(package['manifest_path'])
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?ms)^\[package\]\s*\n(?P<body>.*?)(?=^\[|\Z)', text)
              if not match:
                  raise SystemExit(f'{package["name"]}: missing [package] section')

              body = match.group('body')
              additions = []

              if missing_description:
                  if re.search(r'(?m)^\s*description(?:\.workspace)?\s*=', body):
                      raise SystemExit(f'{package["name"]}: description is present but resolves empty')
                  additions.append('description.workspace = true')

              if missing_license:
                  if re.search(r'(?m)^\s*(?:license|license-file|license_file)(?:\.workspace)?\s*=', body):
                      raise SystemExit(f'{package["name"]}: license metadata is present but resolves empty')
                  additions.append('license.workspace = true')

              if missing_repository:
                  if re.search(r'(?m)^\s*repository(?:\.workspace)?\s*=', body):
                      raise SystemExit(f'{package["name"]}: repository metadata is present but resolves empty')
                  additions.append('repository.workspace = true')

              insert_at = match.start('body')
              text = text[:insert_at] + ''.join(line + '\n' for line in additions) + text[insert_at:]
              path.write_text(text, encoding='utf-8')
              patched.append((package['name'], additions))

          for name, additions in patched:
              print(f'patched {name}: {", ".join(additions)}')

          checked = metadata()
          workspace_ids = set(checked['workspace_members'])
          failures = []
          for package in checked['packages']:
              if package['id'] not in workspace_ids or package.get('publish') == []:
                  continue
              if not (package.get('description') or '').strip():
                  failures.append(f'{package["name"]}: missing description')
              if not (package.get('license') or '').strip() and not package.get('license_file'):
                  failures.append(f'{package["name"]}: missing license')
              if not (package.get('repository') or '').strip():
                  failures.append(f'{package["name"]}: missing repository')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

          scripts/validate-versions.sh

      - name: Persist registry metadata repair
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'crates/*/Cargo.toml'
            git commit -m "release: complete crates.io metadata for 3.0.1"
            git push origin HEAD:"$RELEASE_BRANCH"
          else
            echo 'No manifest repair needed.'
          fi

      - name: Publish remaining crates.io packages idempotently
        shell: bash
        env:
          EXPECTED_VERSION: 3.0.1
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --publish

      - name: Verify every publishable crate is live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          version = '3.0.1'
          data = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--no-deps', '--format-version', '1'
          ]))
          workspace_ids = set(data['workspace_members'])
          names = sorted(
              p['name'] for p in data['packages']
              if p['id'] in workspace_ids and p.get('publish') != []
          )

          def exists(name):
              request = urllib.request.Request(
                  f'https://crates.io/api/v1/crates/{name}/{version}',
                  headers={'User-Agent': 'open-kioku-release-verifier'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status == 200
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise

          pending = names
          for _ in range(30):
              pending = [name for name in pending if not exists(name)]
              if not pending:
                  break
              print('waiting for crates.io:', ', '.join(pending))
              time.sleep(10)

          if pending:
              raise SystemExit('missing from crates.io: ' + ', '.join(pending))
          print(f'verified {len(names)} publishable crates at {version}')
          PY

  verify-npm:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm packages after registry propagation
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            open-kioku
            @open-kioku/darwin-arm64
            @open-kioku/linux-x64
            @open-kioku/linux-arm64
            @open-kioku/win32-x64
          )
          for package in "${packages[@]}"; do
            found=''
            for _ in {1..30}; do
              found="$(npm view "${package}@3.0.1" version 2>/dev/null || true)"
              [[ "$found" == '3.0.1' ]] && break
              sleep 10
            done
            test "$found" = '3.0.1'
            echo "verified ${package}@3.0.1"
          done
