name: RI3 relationship metamorphic hardening

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark
    paths:
      - .github/workflows/ri3-relationship-metamorphic-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply metamorphic identity hardening
        run: python3 .github/scripts/ri3_relationship_metamorphic_hardening.py

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Validate relationship scorer
        run: |
          cargo test -p open-kioku-cli relationship_bench_tests
          cargo test -p open-kioku-cli ri3_metamorphic_bench_tests
          cargo test -p open-kioku-cli ri3_metamorphic_identity_tests
          cargo test -p open-kioku-cli ri3_reproducibility_metadata_tests
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          git diff --check

      - name: Commit product hardening and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-cli/src/bench/relationship.rs
          git commit -m "RI3.4: compare canonical metamorphic relationship identity"
          git rm \
            .github/workflows/ri3-relationship-metamorphic-hardening.yml \
            .github/scripts/ri3_relationship_metamorphic_hardening.py
          git commit -m "chore: remove RI3 metamorphic hardening gate"
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
