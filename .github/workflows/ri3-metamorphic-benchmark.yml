name: RI3 metamorphic relationship benchmark

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Apply metamorphic benchmark hardening
        run: |
          python3 -m py_compile scripts/ri3_metamorphic_bench_tmp.py
          python3 scripts/ri3_metamorphic_bench_tmp.py

      - name: Validate benchmark protocol
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli relationship_bench_tests
          cargo test -p open-kioku-cli ri3_metamorphic_bench_tests

      - name: Commit validated benchmark hardening
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- Cargo.lock
          rm -rf scripts/__pycache__
          git rm -f .github/workflows/ri3-metamorphic-benchmark.yml scripts/ri3_metamorphic_bench_tmp.py
          git add crates/open-kioku-cli/src/bench/relationship.rs
          if ! git diff --quiet; then
            echo "unexpected unstaged tracked changes after validation cleanup:" >&2
            git status --short >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "unexpected untracked files after validation cleanup:" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi
          git commit -m "ri3: enforce metamorphic relationship benchmark gates"
          git pull --rebase origin agent/ri3-relationship-conformance-benchmark
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
