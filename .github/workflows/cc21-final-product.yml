name: CC2.1 final product validation

on:
  push:
    branches:
      - agent/cc2-document-corpus

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc2-document-corpus
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply final product hardening
        run: python3 .github/scripts/cc21_finalize_product.py

      - name: Format and targeted acceptance tests
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-storage
          cargo test -p open-kioku-storage-sqlite document_corpus_tests
          cargo test -p open-kioku-ingest document_corpus
          cargo test -p open-kioku-context indexed_document_stream_tests
          cargo test -p open-kioku-cli document_corpus_mode_benchmark_preserves_context_provenance
          cargo test -p open-kioku-plan plan_surfaces_fast_mode_caveat
          cargo bench -p open-kioku-cli --bench index --no-run

      - name: Full quality gates
        shell: bash
        run: |
          set -euxo pipefail
          cargo check --workspace
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo build --release -p open-kioku-cli
          ./target/release/ok --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --min-cases 30 \
            --write-baseline /tmp/cc21-final-first.json \
            > /tmp/cc21-final-first-out.json
          ./target/release/ok --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --no-index \
            --min-cases 30 \
            --write-baseline /tmp/cc21-final-second.json \
            > /tmp/cc21-final-second-out.json
          cmp /tmp/cc21-final-first.json /tmp/cc21-final-second.json
          cmp benchmarks/retrieval-baseline.json /tmp/cc21-final-first.json
          git diff --check

      - name: Measure Fast vs Full indexing
        shell: bash
        run: |
          set -euxo pipefail
          cargo bench -p open-kioku-cli --bench index -- \
            --noplot | tee /tmp/cc21-index-bench.txt
          grep -F 'index_mode_fast_with_document_corpus' /tmp/cc21-index-bench.txt
          grep -F 'index_mode_full_with_document_corpus' /tmp/cc21-index-bench.txt

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/open-kioku-storage/src/lib.rs \
            crates/open-kioku-config/src/lib.rs \
            crates/open-kioku-ingest/src/lib.rs \
            crates/open-kioku-context/src/candidates/builtins.rs \
            crates/open-kioku-cli/benches/index.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(index): complete document corpus acceptance [skip ci]"
          git push origin HEAD:agent/cc2-document-corpus
