name: Agent CC6 calibration patch

on:
  push:
    branches:
      - agent/cc6-frozen-calibration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc6-frozen-calibration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate focused CC6 benchmark integration
        shell: bash
        run: |
          echo '<_>>' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          cargo fmt --all
          cargo test -p open-kioku-cli cc6_calibration
          cargo test -p open-kioku-cli retrieval_bench_tests
      - name: Commit production patch and remove transport workflow
        shell: bash
        run: |
          rm .github/workflows/agent-cc6-calibration-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-cli/src/cc6_calibration.rs crates/open-kioku-cli/src/bench/retrieval.rs .github/workflows/agent-cc6-calibration-patch.yml
          git commit -m "feat(cc6): calibrate abstention on frozen routed benchmark"
          git push origin HEAD:agent/cc6-frozen-calibration
