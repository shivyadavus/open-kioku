name: pr321-mutation

on:
  pull_request:
    paths:
      - crates/open-kioku-cli/src/bench/retrieval.rs

permissions:
  contents: read

jobs:
  changed-code-mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run focused tests
        run: cargo test -p open-kioku-cli retrieval_bench_tests
      - name: Run targeted mutation tests
        run: python3 scripts/pr321_mutation_test.py
