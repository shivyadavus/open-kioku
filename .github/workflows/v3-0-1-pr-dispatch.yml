name: V3.0.1 hotfix publication

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/v3-0-1-release-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: v3-0-1-hotfix-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.1
          fetch-depth: 0

      - name: Prepare tested 3.0.1 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git rev-parse -q --verify refs/tags/v3.0.1 >/dev/null; then
            echo 'v3.0.1 already exists; refusing to move an immutable release tag' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = 'e6f09f04d4000bec618f00aac426191aff4a76b5'

          git show origin/main:.github/workflows/release.yml > .github/workflows/release.yml
          sed -i 's/Generate release trust artifacts/Generate SHA256SUMS SBOM.cargo-metadata.json PROVENANCE.json THIRD_PARTY_NOTICES.md/' .github/workflows/release.yml

          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text(encoding='utf-8')
          old = 'version = "3.0.0"'
          if old not in text:
              raise SystemExit('release branch is not at workspace version 3.0.0')
          path.write_text(text.replace(old, 'version = "3.0.1"', 1), encoding='utf-8')
          PY

          scripts/sync-version.sh

          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if '## [3.0.1]' not in text:
              section = '''## [3.0.1] — 2026-08-19

### Fixed
- Fixed repository discovery so nested `.gitignore` rules stay scoped to their declaring directory instead of excluding unrelated source trees.
- Made Git authoritative for ignore decisions in Git repositories, preserving tracked-file semantics, nested negation, and standard Git excludes.
- Scoped nested `.okignore` rules correctly, protected large ignore batches from pipe deadlocks, and added a warning when filtering collapses a supported-source index to zero.

### Artifacts
- `ok-linux-x86_64`
- `ok-linux-x86_64.sha256`
- `ok-linux-arm64`
- `ok-linux-arm64.sha256`
- `ok-macos-arm64`
- `ok-macos-arm64.sha256`
- `ok-windows-x86_64.exe`
- `ok-windows-x86_64.exe.sha256`

---

'''
              marker = '## [3.0.0] — 2026-08-17\n'
              if marker not in text:
                  raise SystemExit('3.0.0 changelog marker missing')
              text = text.replace(marker, section + marker, 1)
          link = '[3.0.1]: https://github.com/shivyadavus/open-kioku/releases/tag/v3.0.1'
          if link not in text:
              text = text.rstrip() + '\n' + link + '\n'
          path.write_text(text, encoding='utf-8')
          PY

          cargo metadata --format-version 1 >/dev/null
          scripts/validate-versions.sh
          cargo test -p open-kioku-ingest git_is_authoritative_for_nested_scope_and_tracked_files
          cargo test -p open-kioku-ingest batched_check_drains_large_git_output_without_deadlocking
          cargo test -p open-kioku-ingest --test discovery_acceptance

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare 3.0.1 ignore hotfix'
          git push origin HEAD:release/v3.0.1

      - name: Dispatch canonical release workflow and wait for publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          workflow = 'release.yml'
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'open-kioku-v301-release-orchestrator',
          }

          def request(path, *, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          def runs():
              _, payload = request(f'/actions/workflows/{workflow}/runs?event=workflow_dispatch&per_page=30')
              return payload.get('workflow_runs', [])

          before = {run['id'] for run in runs()}
          status, _ = request(
              f'/actions/workflows/{workflow}/dispatches',
              method='POST',
              body={'ref': 'release/v3.0.1'},
          )
          if status != 204:
              raise SystemExit(f'unexpected release dispatch status: {status}')

          run = None
          for _ in range(60):
              time.sleep(3)
              fresh = [item for item in runs() if item['id'] not in before]
              if fresh:
                  run = max(fresh, key=lambda item: item['id'])
                  break
          if run is None:
              raise SystemExit('release dispatch succeeded but no workflow run appeared')

          run_id = run['id']
          print(f"release run: {run['html_url']}")
          for _ in range(480):
              if run.get('status') == 'completed':
                  break
              time.sleep(15)
              _, run = request(f'/actions/runs/{run_id}')
          else:
              raise SystemExit(f"release run did not complete in time: {run['html_url']}")

          conclusion = run.get('conclusion') or 'unknown'
          print(f'release conclusion: {conclusion}')
          if conclusion != 'success':
              raise SystemExit(f"release failed: {run['html_url']}")
          PY
