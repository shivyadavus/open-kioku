name: V3.0.1 hotfix publication

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/v3-0-1-release-trigger

permissions:
  contents: write
  actions: write

concurrency:
  group: v3-0-1-hotfix-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute v3.0.1 hotfix orchestrator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/v301-hotfix-orchestrate.sh /tmp/v301-hotfix-orchestrate.sh
          chmod +x /tmp/v301-hotfix-orchestrate.sh
          /tmp/v301-hotfix-orchestrate.sh
