name: V3.0.1 hotfix publication

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/v3-0-1-release-trigger

permissions:
  contents: write
  actions: read

jobs:
  validate-trigger:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trusted release trigger
        run: |
          set -euo pipefail
          echo "trusted v3.0.1 release trigger is active"
          echo "head=${{ github.event.pull_request.head.sha }}"
