name: agent-fix-retrieval-corpus-validation

on:
  push:
    branches:
      - agent/context-retrieval-benchmark

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/context-retrieval-benchmark
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate corpus integrity checks
        run: |
          python3 .github/patch_retrieval_corpus_validation.py
          rm .github/patch_retrieval_corpus_validation.py
          rm .github/workflows/agent-fix-retrieval-corpus-validation.yml
          cargo fmt --all
          cargo test -p open-kioku-cli retrieval_bench_tests
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo run -p open-kioku-cli -- \
            --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --min-cases 30 \
            --write-baseline /tmp/retrieval-integrity-baseline.json \
            > /tmp/retrieval-integrity-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('benchmarks/retrieval-baseline.json').read_text())
          actual = json.loads(Path('/tmp/retrieval-integrity-baseline.json').read_text())
          if expected != actual:
              raise SystemExit('corpus integrity checks changed deterministic retrieval results')
          PY
      - name: Commit integrity checks
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-cli/src/bench/retrieval.rs .github/patch_retrieval_corpus_validation.py .github/workflows/agent-fix-retrieval-corpus-validation.yml
          git commit -m "fix(bench): validate frozen retrieval corpus integrity"
          git push origin HEAD:agent/context-retrieval-benchmark
