name: agent-cc7-proof-retrieval-quality

on:
  push:
    branches:
      - agent/cc7-proof-retrieval-quality

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc7-proof-retrieval-quality
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted CC7 proof patch
        run: |
          python3 .github/scripts/agent_cc7_proof_retrieval_quality.py
          python3 .github/scripts/agent_cc7_clippy_fix.py
      - name: Validate formatting, lint, tests, and frozen retrieval contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
          cargo run --release -p open-kioku-cli -- --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --min-cases 30 \
            --write-baseline /tmp/retrieval-baseline-cc7.json \
            > /tmp/retrieval-report-cc7.json
          cmp benchmarks/retrieval-baseline.json /tmp/retrieval-baseline-cc7.json
      - name: Commit product change and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/agent_cc7_proof_retrieval_quality.py
          rm .github/scripts/agent_cc7_clippy_fix.py
          rm .github/workflows/agent-cc7-proof-retrieval-quality.yml
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "feat(prove): surface scoped retrieval benchmark quality"
          git push origin HEAD:agent/cc7-proof-retrieval-quality
