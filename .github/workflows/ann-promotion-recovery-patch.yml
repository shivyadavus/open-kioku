name: ANN promotion recovery patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/cc5-ann-promotion-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply narrowly scoped recovery patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/open-kioku-semantic/src/lib.rs')
          text = path.read_text()

          replacements = [
              (
                  '''    pub fn status(&self) -> SemanticStatus {\n        let current = self.current_dir();\n        let manifest_path = current.join("manifest.json");\n        let stats_path = current.join("stats.json");\n        let mut notes = Vec::new();\n''',
                  '''    pub fn status(&self) -> SemanticStatus {\n        let mut notes = Vec::new();\n        if let Some(note) = self.recover_interrupted_promotion() {\n            notes.push(note);\n        }\n        let current = self.current_dir();\n        let manifest_path = current.join("manifest.json");\n        let stats_path = current.join("stats.json");\n''',
              ),
              (
                  '''    fn build_and_promote(&self, allow_model_download: bool) -> Result<SemanticIndexReport> {\n        let provider = provider_for_config(&self.config, allow_model_download, &self.models_dir())?;\n''',
                  '''    fn build_and_promote(&self, allow_model_download: bool) -> Result<SemanticIndexReport> {\n        let _ = self.recover_interrupted_promotion();\n        let provider = provider_for_config(&self.config, allow_model_download, &self.models_dir())?;\n''',
              ),
              (
                  '''        let previous = self.vectors_dir().join("previous");\n''',
                  '''        let previous = self.previous_dir();\n''',
              ),
              (
                  '''    fn vectors_dir(&self) -> PathBuf {\n        self.repo.join(".ok/vectors")\n    }\n''',
                  '''    fn recover_interrupted_promotion(&self) -> Option<String> {\n        let current = self.current_dir();\n        let previous = self.previous_dir();\n        if current.exists() || !previous.exists() {\n            return None;\n        }\n        if !semantic_generation_complete(&previous) {\n            return Some(\n                "previous semantic generation is incomplete; refusing automatic recovery".into(),\n            );\n        }\n        match fs::rename(&previous, &current) {\n            Ok(()) => Some(\n                "recovered previous semantic generation after interrupted promotion".into(),\n            ),\n            Err(err) if current.exists() => Some(\n                "semantic generation was recovered concurrently after interrupted promotion".into(),\n            ),\n            Err(err) => Some(format!(\n                "failed to recover previous semantic generation after interrupted promotion: {err}"\n            )),\n        }\n    }\n\n    fn vectors_dir(&self) -> PathBuf {\n        self.repo.join(".ok/vectors")\n    }\n\n    fn previous_dir(&self) -> PathBuf {\n        self.vectors_dir().join("previous")\n    }\n''',
              ),
              (
                  '''fn index_artifacts_present(current: &Path, backend: &str) -> bool {\n    match resolved_backend_from_name(backend) {\n        Ok(ResolvedSemanticBackend::ExactFlat) => current.join("index.json").is_file(),\n        Ok(ResolvedSemanticBackend::HnswF32 | ResolvedSemanticBackend::HnswBf16) => {\n            current.join("index.usearch").is_file() && current.join("index.meta.json").is_file()\n        }\n        Err(_) => false,\n    }\n}\n''',
                  '''fn index_artifacts_present(current: &Path, backend: &str) -> bool {\n    match resolved_backend_from_name(backend) {\n        Ok(ResolvedSemanticBackend::ExactFlat) => current.join("index.json").is_file(),\n        Ok(ResolvedSemanticBackend::HnswF32 | ResolvedSemanticBackend::HnswBf16) => {\n            current.join("index.usearch").is_file() && current.join("index.meta.json").is_file()\n        }\n        Err(_) => false,\n    }\n}\n\nfn semantic_generation_complete(generation: &Path) -> bool {\n    let Some(manifest) = read_json::<SemanticManifest>(&generation.join("manifest.json")) else {\n        return false;\n    };\n    generation.join("ids.json").is_file()\n        && generation.join("embeddings.cache").is_file()\n        && generation.join("stats.json").is_file()\n        && index_artifacts_present(generation, &manifest.backend)\n}\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one patch anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cargo fmt --all
          cargo test -p open-kioku-semantic --test ann_recovery

          unexpected="$(git diff --name-only | grep -Ev '^(crates/open-kioku-semantic/src/lib.rs|crates/open-kioku-semantic/tests/ann_recovery.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected source changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          rm .github/workflows/ann-promotion-recovery-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-semantic/src/lib.rs crates/open-kioku-semantic/tests/ann_recovery.rs .github/workflows/ann-promotion-recovery-patch.yml
          git commit -m "feat(semantic): recover interrupted ANN promotion"
          git push origin HEAD:${{ github.head_ref }}
