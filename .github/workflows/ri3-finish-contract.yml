name: RI3 finish contract

on:
  push:
    branches:
      - agent/ri3-core-relationship-proofs

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-relationship-proofs
          fetch-depth: 0

      - name: Apply final RI3 contract consolidation
        run: python3 scripts/ri3_finish_contract_tmp.py

      - name: Format and validate trust boundaries
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-architecture -p open-kioku-context -p open-kioku-plan -p open-kioku-tests -p open-kioku-mcp --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-architecture -p open-kioku-context -p open-kioku-plan -p open-kioku-tests -p open-kioku-mcp

      - name: Commit validated RI3 contract
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-finish-contract.yml scripts/ri3_finish_contract_tmp.py
          git add crates/open-kioku-core/src/lib.rs crates/open-kioku-core/src/relationship.rs crates/open-kioku-evidence/src/lib.rs crates/open-kioku-architecture/src/lib.rs crates/open-kioku-context/src/lib.rs crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json
          git commit -m "refactor(ri3): enforce core relationship authority contract"
          git push origin HEAD:agent/ri3-core-relationship-proofs
