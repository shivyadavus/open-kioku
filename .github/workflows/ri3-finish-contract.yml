name: RI3 finish contract

on:
  push:
    branches:
      - agent/ri3-core-relationship-proofs

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-relationship-proofs
          fetch-depth: 0

      - name: Repair and apply final RI3 contract consolidation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/ri3_finish_contract_tmp.py")
          lines = path.read_text().splitlines()
          repaired = []
          open_blocks = 0
          close_blocks = 0
          for line in lines:
              if '"""      "config_keys",' in line:
                  line = line.replace('"""', "'''", 1)
                  open_blocks += 1
              if '"read_only_graph_query"' in line:
                  prefix, marker, suffix = line.partition('"read_only_graph_query"')
                  if '"""' in suffix:
                      suffix = suffix.replace('"""', "'''", 1)
                      close_blocks += 1
                  line = prefix + marker + suffix
              repaired.append(line)
          if open_blocks != 2 or close_blocks != 2:
              raise SystemExit(
                  f"unexpected snapshot string blocks: opened={open_blocks} closed={close_blocks}"
              )
          text = "\n".join(repaired) + "\n"
          old = '    "context dependency authority gate",\n    count=2,\n'
          new = '    "context dependency authority gate",\n    count=1,\n'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected Context count seam: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/ri3_finish_contract_tmp.py
          python3 scripts/ri3_finish_contract_tmp.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/open-kioku-evidence/src/lib.rs")
          text = path.read_text()
          legacy = (
              "pub use open_kioku_core::{RelationshipAuthority, RelationshipProof, "
              "RelationshipProofKind};\n"
          )
          if text.count(legacy) != 1:
              raise SystemExit(f"unexpected legacy proof re-export count: {text.count(legacy)}")
          text = text.replace(legacy, "", 1)
          old_test_import = (
              "    use open_kioku_core::{EdgeId, EvidenceId, GraphNode, LineRange, NodeId};\n"
          )
          new_test_import = (
              "    use open_kioku_core::{\n"
              "        EdgeId, EvidenceId, FileRange, GraphNode, LineRange, NodeId, SymbolId,\n"
              "    };\n"
          )
          if text.count(old_test_import) != 1:
              raise SystemExit(
                  f"unexpected evidence test import count: {text.count(old_test_import)}"
              )
          path.write_text(text.replace(old_test_import, new_test_import, 1))
          PY

      - name: Format and validate trust boundaries
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-architecture -p open-kioku-context -p open-kioku-plan -p open-kioku-tests -p open-kioku-mcp --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph -p open-kioku-architecture -p open-kioku-context -p open-kioku-plan -p open-kioku-tests -p open-kioku-mcp

      - name: Commit validated RI3 contract
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-finish-contract.yml .github/workflows/ri3-finalize-247.yml scripts/ri3_finish_contract_tmp.py
          git add crates/open-kioku-core/src/lib.rs crates/open-kioku-core/src/relationship.rs crates/open-kioku-evidence/src/lib.rs crates/open-kioku-architecture/src/lib.rs crates/open-kioku-context/src/lib.rs crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json
          git commit -m "refactor(ri3): enforce core relationship authority contract"
          git push origin HEAD:agent/ri3-core-relationship-proofs
