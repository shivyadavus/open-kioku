name: RI3 clippy fix staging

on:
  push:
    branches:
      - "agent/ri3-language-semantics-complete"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate clippy fix
        run: |
          python3 scripts/ri3-clippy-fix.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-ingest --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-ingest candidate_cap_hits_are_visible_in_index_quality
      - name: Commit durable fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ri3-clippy-fix-stage.yml
          git rm scripts/ri3-clippy-fix.py
          git add crates/open-kioku-ingest/src/lib.rs
          git diff --cached --check
          git commit -m "satisfy RI3 ingest clippy gate"
          git push
