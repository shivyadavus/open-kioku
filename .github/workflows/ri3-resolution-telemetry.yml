name: RI3 resolution telemetry

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply relationship resolution telemetry
        run: python3 scripts/ri3_resolution_telemetry_tmp.py

      - name: Validate telemetry and trust boundaries
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated telemetry and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-resolution-telemetry.yml \
            scripts/ri3_resolution_telemetry_tmp.py
          git add \
            crates/open-kioku-core/src/relationship.rs \
            crates/open-kioku-resolution/src/pipeline.rs \
            crates/open-kioku-resolution/src/type_candidates.rs \
            crates/open-kioku-resolution/src/inheritance.rs \
            crates/open-kioku-ingest/src/lib.rs
          git commit -m "ri3: expose deterministic relationship resolution telemetry"
          git push origin HEAD:agent/ri3-proof-gated-resolution
