name: RI3 relationship constructor inventory

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
      - name: Inventory typed relationship construction and graph assembly
        run: |
          echo '=== ResolvedRelationship constructors ==='
          git grep -n -F 'ResolvedRelationship {' -- '*.rs' || true
          echo '=== resolved_relationships consumers ==='
          git grep -n -F 'resolved_relationships' -- '*.rs' || true
          echo '=== graph construction calls ==='
          git grep -n -F 'from_index_with_resolved_relationships' -- '*.rs' || true
