name: Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install minimal stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      
    - name: Prepare benchmark artifact directory
      run: mkdir -p artifacts/benchmarks

    - name: Test fusion calibration gate
      run: python3 -m unittest scripts.tests.test_evaluate_fusion_calibration

    - name: Run Criterion Benchmarks
      shell: bash
      run: |
        set -o pipefail
        cargo bench --workspace | tee artifacts/benchmarks/criterion.txt

    - name: Smoke ANN scale matrix
      shell: bash
      run: |
        set -euo pipefail
        OK_ANN_SCALE_SIZES=2000 \
        OK_ANN_SCALE_DIMS=384 \
        OK_ANN_SCALE_SEARCH_EXPANSIONS=64,1024 \
        OK_ANN_SCALE_QUERIES=8 \
          cargo run -p open-kioku-vector --example ann_scale_matrix --release \
          > artifacts/benchmarks/ann-scale-smoke.json
        python3 - <<'PY'
        import json
        from pathlib import Path

        report = json.loads(Path('artifacts/benchmarks/ann-scale-smoke.json').read_text())
        if report['schema_version'] != 1:
            raise SystemExit('unexpected ANN scale benchmark schema')
        if report['oracle'] != 'exact-flat':
            raise SystemExit('ANN scale benchmark must retain exact-flat as oracle')
        rows = report['measurements']
        if len(rows) != 2:
            raise SystemExit(f'expected 2 bounded ANN scale rows, got {len(rows)}')
        if {row['parameters']['expansion_search'] for row in rows} != {64, 1024}:
            raise SystemExit('ANN scale smoke did not exercise both search expansions')
        for row in rows:
            if row['vector_count'] != 2000 or row['dimensions'] != 384:
                raise SystemExit('ANN scale smoke reported an unexpected fixture shape')
            for metric in ('recall_at_1', 'recall_at_5', 'recall_at_10', 'recall_at_20', 'mrr'):
                value = row['quality'][metric]
                if not 0.0 <= value <= 1.0:
                    raise SystemExit(f'ANN scale {metric} out of range: {value}')
            if row['ann_index_bytes'] <= 0 or row['ann_metadata_bytes'] <= 0:
                raise SystemExit('ANN scale persistence metrics must be positive')
        print('bounded ANN scale matrix smoke passed')
        PY

    - name: Smoke ANN churn lifecycle
      shell: bash
      run: |
        set -euo pipefail
        OK_ANN_CHURN_INITIAL_VECTORS=2000 \
        OK_ANN_CHURN_DIMS=384 \
        OK_ANN_CHURN_CYCLES=3 \
        OK_ANN_CHURN_MUTATIONS_PER_CYCLE=100 \
        OK_ANN_CHURN_QUERIES=8 \
          cargo run -p open-kioku-vector --example ann_churn_matrix --release \
          > artifacts/benchmarks/ann-churn-smoke.json
        python3 - <<'PY'
        import json
        from pathlib import Path

        report = json.loads(Path('artifacts/benchmarks/ann-churn-smoke.json').read_text())
        if report['schema_version'] != 1:
            raise SystemExit('unexpected ANN churn benchmark schema')
        if report['oracle'] != 'exact-flat':
            raise SystemExit('ANN churn benchmark must retain exact-flat as oracle')
        if report['lifecycle_model'] != 'fresh-generation-from-live-set':
            raise SystemExit('ANN churn smoke exercised an unexpected lifecycle model')
        if report['overall']['total_mutations'] != 300:
            raise SystemExit(
                f"expected 300 applied mutations, got {report['overall']['total_mutations']}"
            )
        if not report['policy']['passed']:
            raise SystemExit(
                f"ANN churn lifecycle policy failed: {report['policy']['reasons']}"
            )
        if report['overall']['max_stored_to_live_ratio_deviation'] != 0.0:
            raise SystemExit('ANN churn stored/live population deviated from the authoritative live set')
        for cycle in report['measurements']:
            if cycle['stored_vectors'] != cycle['live_vectors']:
                raise SystemExit('ANN churn persisted population differs from live population')
            if cycle['stale_or_deleted_hits'] != 0:
                raise SystemExit('ANN churn returned deleted vector identities')
            if cycle['stale_identity_hits'] != 0:
                raise SystemExit('ANN churn returned stale renamed identities')
            if cycle['duplicate_hit_ids'] != 0:
                raise SystemExit('ANN churn returned duplicate vector IDs')
            if cycle['inspected_ann_hits'] <= 0:
                raise SystemExit('ANN churn smoke did not inspect ANN results')
        print('bounded ANN churn lifecycle smoke passed')
        PY
      
    - name: Run CLI Bench
      shell: bash
      run: |
        set -o pipefail
        cargo build --release -p open-kioku-cli
        ./target/release/ok init .
        ./target/release/ok bench . \
          --quality-case PlanEngine=crates/open-kioku-plan/src/lib.rs \
          --quality-case TantivySearchIndex=crates/open-kioku-search-tantivy/src/lib.rs \
          --quality-case WatchIndexStatus=crates/open-kioku-watch/src/lib.rs \
          --quality-min-precision-at-1 1.0 \
          | tee artifacts/benchmarks/quality-bench.txt
        ./target/release/ok --repo . graph query --dsl "MATCH (f:File)-[:DEFINES]->(s:Function) RETURN f, s LIMIT 2" \
          --limit 2 \
          | tee artifacts/benchmarks/graph-query-latency.txt
        ./target/release/ok --repo . snapshot export --quality fast \
          | tee artifacts/benchmarks/snapshot-export.txt
        ./target/release/ok --repo . snapshot import \
          | tee artifacts/benchmarks/snapshot-import.txt
        ./target/release/ok workflow-bench . \
          --cases-file benchmarks/workflow-cases.json \
          --limit 10 \
          --min-cases 20 \
          --min-context-recall 1.0 \
          --min-verification-accuracy 1.0 \
          --no-index \
          | tee artifacts/benchmarks/workflow-bench.txt
        ./target/release/ok --json retrieval-bench . \
          --cases-file benchmarks/retrieval-cases.json \
          --min-cases 30 \
          --write-json artifacts/benchmarks/retrieval-report.json \
          --write-markdown artifacts/benchmarks/retrieval-report.md \
          --write-baseline /tmp/retrieval-baseline-first.json \
          > artifacts/benchmarks/retrieval-stdout.json
        ./target/release/ok --json retrieval-bench . \
          --cases-file benchmarks/retrieval-cases.json \
          --no-index \
          --min-cases 30 \
          --write-baseline /tmp/retrieval-baseline-second.json \
          > /tmp/retrieval-second.json
        python3 - <<'PY'
        import json
        from pathlib import Path

        expected = json.loads(Path('benchmarks/retrieval-baseline.json').read_text())
        first = json.loads(Path('/tmp/retrieval-baseline-first.json').read_text())
        second = json.loads(Path('/tmp/retrieval-baseline-second.json').read_text())
        thresholds = json.loads(Path('benchmarks/retrieval-thresholds.json').read_text())

        if first != second:
            raise SystemExit('retrieval quality baseline is nondeterministic across identical runs')
        if first != expected:
            raise SystemExit(
                'retrieval quality baseline changed; inspect the report and update the checked-in '
                'baseline explicitly if the change is intentional'
            )
        if thresholds['schema_version'] != first['schema_version']:
            raise SystemExit('retrieval threshold schema does not match benchmark schema')
        if thresholds['corpus_id'] != first['corpus_id']:
            raise SystemExit('retrieval thresholds target a different corpus')

        strategy = next(
            item for item in first['strategies']
            if item['strategy'] == thresholds['strategy']
        )
        quality = strategy['by_split'][thresholds['split']]
        minimums = thresholds['minimums']
        maximums = thresholds['maximums']
        observed = {
            'recall_at_5': quality['recall_at_5'],
            'recall_at_10': quality['recall_at_10'],
            'mean_reciprocal_rank': quality['mean_reciprocal_rank'],
            'file_f1_at_10': quality['file_f1_at_10'],
            'token_budget_gold_yield_2000': quality['token_budget_gold_yield']['2000'],
            'no_gold_false_positive_rate': quality['no_gold_false_positive_rate'],
        }
        for metric, minimum in minimums.items():
            if observed[metric] < minimum:
                raise SystemExit(
                    f'retrieval holdout {metric} {observed[metric]:.6f} is below {minimum:.6f}'
                )
        for metric, maximum in maximums.items():
            if observed[metric] > maximum:
                raise SystemExit(
                    f'retrieval holdout {metric} {observed[metric]:.6f} exceeds {maximum:.6f}'
                )
        print('retrieval benchmark deterministic baseline and holdout thresholds passed')
        PY
        python3 scripts/evaluate-fusion-calibration.py \
          artifacts/benchmarks/retrieval-report.json \
          --output artifacts/benchmarks/fusion-calibration-decision.json
        ./target/release/ok --json relationship-bench \
          --corpus benchmarks/relationship-cases.json \
          --observations @live \
          --policy benchmarks/relationship-thresholds.json \
          --enforce-gates \
          --write artifacts/benchmarks/relationship-report.json \
          > artifacts/benchmarks/relationship-stdout.json
        python3 scripts/validate-relationship-baseline.py \
          artifacts/benchmarks/relationship-report.json \
          benchmarks/relationship-baseline.json
        ./target/release/ok architecture bench benchmarks/architecture-policy-fixture \
          --cases-file benchmarks/architecture-policy-cases.json \
          --min-precision 0.95 \
          --min-recall 0.90 \
          | tee artifacts/benchmarks/architecture-bench.txt
        ./target/release/ok contract-bench benchmarks/contract-fixture \
          --cases-file benchmarks/contract-cases.json \
          --min-cases 7 \
          --min-verdict-accuracy 0.95 \
          --min-verification-precision 0.95 \
          --min-boundary-precision 0.97 \
          --min-boundary-recall 0.90 \
          --min-toon-reduction 0.35 \
          | tee artifacts/benchmarks/contract-bench.txt
        ./target/release/ok --json history similar-bench \
          --cases-file benchmarks/similar-history-cases.json \
          --min-recall-at-5 0.75 \
          | tee artifacts/benchmarks/history-similar-bench.json

    - name: Upload benchmark-reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-reports
        path: artifacts/benchmarks
