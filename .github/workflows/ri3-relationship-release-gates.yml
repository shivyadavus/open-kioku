name: RI3 relationship release gates

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Apply release-gate patch
        run: |
          python3 -m py_compile scripts/ri3_relationship_gates_tmp.py
          python3 scripts/ri3_relationship_gates_tmp.py

      - name: Validate benchmark gates
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli relationship_bench_tests

      - name: Commit validated release gates
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/ri3-relationship-release-gates.yml scripts/ri3_relationship_gates_tmp.py
          git add \
            crates/open-kioku-cli/src/bench/relationship.rs \
            crates/open-kioku-cli/src/types.rs \
            benchmarks/relationship-thresholds.json
          git commit -m "ri3: enforce non-vacuous relationship benchmark release gates"
          git pull --rebase origin agent/ri3-relationship-conformance-benchmark
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
