name: agent-cc4-query-shape-routing

on:
  push:
    branches:
      - agent/cc4-query-shape-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc4-query-shape-routing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted CC4 query-shape patch
        run: |
          python3 .github/scripts/agent_apply_cc4_query_shape.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/open-kioku-context/src/routing.rs')
          lines = path.read_text().splitlines()
          repaired = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if '.map(|token| token.trim_matches' in line:
                  repaired.append(r'''        .map(|token| token.trim_matches(|ch: char| matches!(ch, '`' | '\'' | '"' | ',' | ';' | ':' | '(' | ')' | '[' | ']')))''')
                  index += 1
                  continue
              if line.strip() == ") || (lower.contains('" and index + 1 < len(lines):
                  repaired.append(r'''    ) || (lower.contains('\n') && contains_any(lower, &["error", "exception", "panic", "traceback"]))''')
                  index += 2
                  continue
              repaired.append(line.rstrip())
              index += 1
          text = '\n'.join(repaired) + '\n'

          classifier_marker = '''    structured.sort_by_key(|(shape, _)| query_shape_priority(*shape));
              structured.dedup_by(|left, right| left.0 == right.0);
              let natural_language = natural_language_token_count(trimmed) >= 3;
          '''
          classifier_replacement = '''    structured.sort_by_key(|(shape, _)| query_shape_priority(*shape));
              structured.dedup_by(|left, right| left.0 == right.0);
              let natural_language = natural_language_token_count(trimmed) >= 3;

              if structured
                  .iter()
                  .any(|(shape, _)| *shape == QueryShape::ErrorTrace)
              {
                  let signals = structured
                      .iter()
                      .map(|(_, signal)| signal.clone())
                      .collect::<Vec<_>>();
                  let non_trace = structured
                      .iter()
                      .filter(|(shape, _)| *shape != QueryShape::ErrorTrace)
                      .map(|(shape, _)| format!("{shape:?}").to_ascii_lowercase())
                      .collect::<Vec<_>>();
                  let ambiguities = if non_trace.is_empty() {
                      Vec::new()
                  } else {
                      vec![format!(
                          "error trace also contains structured signals: {}",
                          non_trace.join(", ")
                      )]
                  };
                  return QueryShapeDecision {
                      shape: QueryShape::ErrorTrace,
                      confidence: if ambiguities.is_empty() { 0.96 } else { 0.90 },
                      signals,
                      ambiguities,
                      fallback_reason: None,
                  };
              }
          '''
          if classifier_marker not in text:
              raise SystemExit('query-shape classifier composition marker not found')
          text = text.replace(classifier_marker, classifier_replacement, 1)

          new_apply = '''fn apply_query_shape(policy: &mut RetrievalPolicy, shape: QueryShape) {
              use RetrievalSourceKind as S;
              let deltas: &[(S, usize)] = match shape {
                  QueryShape::ExactIdentifier | QueryShape::QualifiedSymbol => &[
                      (S::ExactSemantic, 2),
                      (S::Lexical, 1),
                      (S::Graph, 1),
                  ],
                  QueryShape::PathReference => &[
                      (S::Lexical, 2),
                      (S::ExactSemantic, 1),
                      (S::SemanticVector, 1),
                  ],
                  QueryShape::ErrorTrace => &[
                      (S::Runtime, 2),
                      (S::ExactSemantic, 1),
                      (S::Graph, 1),
                      (S::Lexical, 1),
                  ],
                  QueryShape::ApiResource => &[
                      (S::ExactSemantic, 1),
                      (S::Lexical, 1),
                      (S::Graph, 1),
                      (S::Runtime, 1),
                  ],
                  QueryShape::Conceptual => &[
                      (S::SemanticVector, 2),
                      (S::Lexical, 1),
                      (S::Graph, 1),
                      (S::Document, 1),
                  ],
                  QueryShape::MixedStructuredNaturalLanguage => &[
                      (S::ExactSemantic, 1),
                      (S::Lexical, 1),
                      (S::SemanticVector, 1),
                      (S::Graph, 1),
                      (S::Document, 1),
                      (S::Runtime, 1),
                  ],
                  QueryShape::Unknown => &[],
              };

              let family_max = policy
                  .candidate_factors
                  .iter()
                  .map(|(_, factor)| *factor)
                  .max()
                  .unwrap_or_default();
              let flat_family = policy
                  .candidate_factors
                  .iter()
                  .all(|(_, factor)| *factor == family_max);

              for (source, delta) in deltas {
                  if !policy.allows(*source) {
                      continue;
                  }
                  if let Some((_, factor)) = policy
                      .candidate_factors
                      .iter_mut()
                      .find(|(candidate_source, _)| candidate_source == source)
                  {
                      let refined = factor.saturating_add(*delta);
                      *factor = if flat_family {
                          refined
                      } else {
                          refined.min(family_max)
                      };
                  }
              }
          }
          '''
          text, count = re.subn(
              r'fn apply_query_shape\(policy: &mut RetrievalPolicy, shape: QueryShape\) \{.*?\n\}\n\n(?=fn query_shape_priority)',
              new_apply + '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'query-shape policy composition replacement count={count}')

          new_trace = '''fn is_error_trace_query(lower: &str) -> bool {
              let explicit_error = contains_any(
                  lower,
                  &[
                      "stack trace",
                      "traceback",
                      "exception:",
                      "panic:",
                      "panicked at",
                      "caused by:",
                  ],
              );
              let stack_frame = lower.lines().skip(1).any(|line| {
                  let line = line.trim_start();
                  line.starts_with("at ") || line.starts_with("file ")
              });
              explicit_error
                  || (stack_frame
                      && contains_any(lower, &["error", "exception", "panic", "traceback"]))
          }
          '''
          text, count = re.subn(
              r'fn is_error_trace_query\(lower: &str\) -> bool \{.*?\n\}\n\n(?=fn is_api_resource_query)',
              new_trace + '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'error-trace classifier replacement count={count}')

          old_assert = '''        assert!(route.policy.missing_required_evidence_is_blocker);
                  assert!(!route.query_shape_ambiguities.is_empty());
              }
          '''
          new_assert = '''        assert!(route.policy.missing_required_evidence_is_blocker);
                  assert!(!route.query_shape_signals.is_empty());
              }
          '''
          if old_assert not in text:
              raise SystemExit('mixed structured test assertion marker not found')
          text = text.replace(old_assert, new_assert, 1)

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate focused and full workspace contracts
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-context
          cargo test -p open-kioku-core
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product change and remove temporary tooling
        run: |
          rm .github/scripts/agent_apply_cc4_query_shape.py
          rm .github/workflows/agent-cc4-query-shape-routing.yml
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat(context): add query-shape-aware retrieval routing"
          git push origin HEAD:agent/cc4-query-shape-routing
