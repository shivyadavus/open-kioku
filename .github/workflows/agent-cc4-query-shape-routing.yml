name: agent-cc4-query-shape-routing

on:
  push:
    branches:
      - agent/cc4-query-shape-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc4-query-shape-routing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted CC4 query-shape patch
        run: |
          python3 .github/scripts/agent_apply_cc4_query_shape.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-context/src/routing.rs')
          lines = path.read_text().splitlines()
          repaired = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if '.map(|token| token.trim_matches' in line:
                  repaired.append(r'''        .map(|token| token.trim_matches(|ch: char| matches!(ch, '`' | '\'' | '"' | ',' | ';' | ':' | '(' | ')' | '[' | ']')))''')
                  index += 1
                  continue
              if line.strip() == ") || (lower.contains('" and index + 1 < len(lines):
                  repaired.append(r'''    ) || (lower.contains('\n') && contains_any(lower, &["error", "exception", "panic", "traceback"]))''')
                  index += 2
                  continue
              repaired.append(line)
              index += 1
          path.write_text('\n'.join(repaired) + '\n')
          PY
      - name: Validate focused and full workspace contracts
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-context
          cargo test -p open-kioku-core
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product change and remove temporary tooling
        run: |
          rm .github/scripts/agent_apply_cc4_query_shape.py
          rm .github/workflows/agent-cc4-query-shape-routing.yml
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat(context): add query-shape-aware retrieval routing"
          git push origin HEAD:agent/cc4-query-shape-routing
