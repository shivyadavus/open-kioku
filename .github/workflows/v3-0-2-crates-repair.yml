name: V3.0.2 crates.io repair

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/v3-0-2-crates-repair-trigger

permissions:
  contents: read

concurrency:
  group: v3-0-2-crates-repair
  cancel-in-progress: false

jobs:
  repair-crates:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Guard published release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test -n "$(git tag -l 'v3.0.2')"
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])
          PY
          )" = '3.0.2'
          scripts/validate-versions.sh

      - name: Preflight every publishable crate
        shell: bash
        env:
          EXPECTED_VERSION: 3.0.2
        run: |
          set -euo pipefail
          scripts/publish-crates.sh --preflight
          python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--no-deps', '--format-version', '1'
          ]))
          workspace = set(data['workspace_members'])
          failures = []
          for package in data['packages']:
              if package['id'] not in workspace or package.get('publish') == []:
                  continue
              if not (package.get('description') or '').strip():
                  failures.append(f"{package['name']}: missing description")
              if not (package.get('license') or '').strip() and not package.get('license_file'):
                  failures.append(f"{package['name']}: missing license")
              if not (package.get('repository') or '').strip():
                  failures.append(f"{package['name']}: missing repository")
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Publish remaining 3.0.2 crates idempotently
        shell: bash
        env:
          EXPECTED_VERSION: 3.0.2
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --publish

      - name: Verify every publishable 3.0.2 crate is live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          version = '3.0.2'
          data = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--no-deps', '--format-version', '1'
          ]))
          workspace = set(data['workspace_members'])
          names = sorted(
              p['name'] for p in data['packages']
              if p['id'] in workspace and p.get('publish') != []
          )

          def exists(name):
              request = urllib.request.Request(
                  f'https://crates.io/api/v1/crates/{name}/{version}',
                  headers={'User-Agent': 'open-kioku-release-verifier'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status == 200
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise

          pending = names
          for _ in range(30):
              pending = [name for name in pending if not exists(name)]
              if not pending:
                  break
              print('waiting for crates.io:', ', '.join(pending))
              time.sleep(10)

          if pending:
              raise SystemExit('missing from crates.io: ' + ', '.join(pending))
          print(f'verified {len(names)} publishable crates at {version}')
          PY
