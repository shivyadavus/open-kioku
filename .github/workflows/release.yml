name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ok-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        shell: bash
        run: scripts/validate-versions.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zlib1g-dev libgomp1

      - name: Build binary
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p open-kioku-cli

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            strip dist/${{ matrix.binary_name }} || true
          fi
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.binary_name }}
          VERSION="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])
          PY
          )"
          test "$(dist/${{ matrix.binary_name }} --version)" = "ok ${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}-artifact
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.final.outputs.release_sha }}
      version: ${{ steps.final.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Pin canonical artifact hashes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          names = [
              'ok-linux-x86_64',
              'ok-linux-arm64',
              'ok-macos-arm64',
              'ok-windows-x86_64.exe',
          ]
          hashes = {name: hashlib.sha256(Path('dist', name).read_bytes()).hexdigest() for name in names}

          metadata_path = Path('release-metadata.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          for artifact in metadata['artifacts']:
              if artifact['name'] in hashes:
                  artifact['sha256'] = hashes[artifact['name']]
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')

          formula_path = Path('Formula/open-kioku.rb')
          lines = formula_path.read_text(encoding='utf-8').splitlines()
          current = None
          for index, line in enumerate(lines):
              match = re.search(r'/([^/\"]+)\"$', line)
              if 'url ' in line and match:
                  current = match.group(1)
              elif current in hashes and 'sha256 ' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}sha256 "{hashes[current]}"'
                  current = None
          formula_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh

      - name: Commit final hash-pinned release state
        id: final
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])
          PY
          )"
          test "$GITHUB_REF_NAME" = "release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m "release: pin ${VERSION} artifact hashes"
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Generate SHA256SUMS SBOM.cargo-metadata.json PROVENANCE.json THIRD_PARTY_NOTICES.md
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="$(git rev-parse HEAD)"
          env \
            GITHUB_SHA="$FINAL_SHA" \
            GITHUB_REF_NAME="v${{ steps.final.outputs.version }}" \
            GITHUB_WORKFLOW="release" \
            scripts/generate-release-trust-artifacts.sh dist

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ok-linux-x86_64
            dist/ok-linux-arm64
            dist/ok-macos-arm64
            dist/ok-windows-x86_64.exe

      - name: Extract changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.final.outputs.version }}"
          awk "/^## \\[$VERSION\\]/ {flag=1; print; next} /^## \\[/ {if(flag) exit} flag" CHANGELOG.md > release_notes.md
          test -s release_notes.md

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.final.outputs.version }}"
          TAG="v${VERSION}"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; refusing to move it" >&2
            exit 1
          fi
          git tag -a "$TAG" HEAD -m "Open Kioku ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.final.outputs.version }}
          name: Open Kioku ${{ steps.final.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}

      - name: Validate final release metadata
        shell: bash
        run: scripts/validate-versions.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Inject binaries into npm packages
        shell: bash
        run: |
          set -euo pipefail
          cp dist/ok-macos-arm64 packages/npm-darwin-arm64/ok
          cp dist/ok-linux-x86_64 packages/npm-linux-x64/ok
          cp dist/ok-linux-arm64 packages/npm-linux-arm64/ok
          cp dist/ok-windows-x86_64.exe packages/npm-win32-x64/ok.exe
          chmod +x packages/npm-darwin-arm64/ok packages/npm-linux-x64/ok packages/npm-linux-arm64/ok

      - name: Publish npm packages idempotently
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish_package() {
            local package_dir="$1"
            local name version
            name="$(node -p "require('./${package_dir}/package.json').name")"
            version="$(node -p "require('./${package_dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
            else
              (cd "$package_dir" && npm publish --access public)
            fi
          }
          for package in npm-darwin-arm64 npm-linux-x64 npm-linux-arm64 npm-win32-x64; do
            publish_package "packages/${package}"
          done
          publish_package packages/npm
          scripts/wait-for-npm-version.sh open-kioku "${{ needs.publish.outputs.version }}"

  publish-crates:
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Publish crates.io release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --publish
