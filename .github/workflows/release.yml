name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm v3.0.1 is already published
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          test -n "$(git tag -l 'v3.0.1')"
          test "$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])
          PY
          )" = '3.0.1'
          echo 'v3.0.1 is immutable; registry completion is handled by the dedicated repair workflow.'
