name: RI3 complete frozen relationship conformance

on:
  push:
    branches:
      - agent/ri3-frozen-conformance
    paths:
      - .github/workflows/ri3-complete-240.yml
      - .tmp-ri3/**

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-frozen-conformance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Decode RI3 conformance payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          mapping = {
              '.tmp-ri3/relationship.rs.gz.b64': 'crates/open-kioku-cli/src/bench/relationship.rs',
              '.tmp-ri3/relationship_live.rs.gz.b64': 'crates/open-kioku-cli/src/bench/relationship_live.rs',
              '.tmp-ri3/relationship-cases.json.gz.b64': 'benchmarks/relationship-cases.json',
              '.tmp-ri3/relationship-ci-cases.json.gz.b64': 'benchmarks/relationship-ci-cases.json',
              '.tmp-ri3/relationship-thresholds.json.gz.b64': 'benchmarks/relationship-thresholds.json',
          }
          for source, target in mapping.items():
              payload = base64.b64decode(Path(source).read_bytes(), validate=True)
              decoded = gzip.decompress(payload)
              Path(target).write_bytes(decoded)
              print(f'decoded {source} -> {target} ({len(decoded)} bytes)')
          PY
      - name: Add authoritative explicit-package dependency proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/open-kioku-graph/src/lib.rs')
          text = path.read_text()
          marker = '.expect("resolved import binding proof must serialize to JSON");'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit('resolved import proof marker not found')
          prior_push = text.rfind('proof.evidence_ids.push(evidence_id);', 0, marker_pos)
          if prior_push < 0:
              raise SystemExit('resolved import evidence push not found')
          text = text[:prior_push] + 'proof.evidence_ids.push(evidence_id.clone());' + text[prior_push + len('proof.evidence_ids.push(evidence_id);'):]
          marker_pos = text.find(marker)
          insertion_pos = text.find('            buffer.insert_edge(edge);', marker_pos)
          if insertion_pos < 0:
              raise SystemExit('buffer insertion marker not found after resolved import proof')
          lines = [
              '            if fact.edge_type == GraphEdgeType::DependsOn',
              '                && fact.target_kind == GraphNodeType::Package',
              '                && fact.source.starts_with("open-kioku-import-resolver/")',
              '                && matches!(fact.confidence, Confidence::High | Confidence::Exact)',
              '            {',
              '                let mut proof = RelationshipProof::new(',
              '                    RelationshipProofKind::ModuleOrPackageBinding,',
              '                    fact.source.clone(),',
              '                    1,',
              '                );',
              '                proof.source_range = fact.range.as_ref().map(|range| FileRange {',
              '                    path: file.path.clone(),',
              '                    line_range: Some(range.clone()),',
              '                });',
              '                proof.evidence_ids.push(evidence_id);',
              '                proof',
              '                    .details',
              '                    .insert("package".into(), json!(fact.target));',
              '                edge.set_relationship_proofs(vec![proof])',
              '                    .expect("resolved package dependency proof must serialize to JSON");',
              '            }',
          ]
          block = '\n'.join(lines) + '\n'
          path.write_text(text[:insertion_pos] + block + text[insertion_pos:])
          PY
      - name: Rustfmt generated product tree
        run: cargo fmt --all
      - name: Verify rustfmt
        run: cargo fmt --all -- --check
      - name: Compile changed crates
        shell: bash
        run: |
          set -o pipefail
          cargo check -p open-kioku-cli -p open-kioku-graph --all-targets 2>&1 | tee /tmp/cargo-check.log
      - name: Strict Clippy for changed crates
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p open-kioku-cli -p open-kioku-graph --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri3-compiler-diagnostics
          path: |
            /tmp/cargo-check.log
            /tmp/clippy.log
          if-no-files-found: ignore
      - name: Relationship scorer tests
        run: cargo test -p open-kioku-cli relationship_bench -- --nocapture
      - name: Live producer tests
        run: cargo test -p open-kioku-cli relationship_live -- --nocapture
      - name: Graph proof tests
        run: cargo test -p open-kioku-graph -- --nocapture
      - name: Run compact live conformance matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p open-kioku-cli -- --json relationship-bench \
            --corpus benchmarks/relationship-ci-cases.json \
            --observations @live \
            --write /tmp/relationship-ci-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/relationship-ci-report.json'))
          diagnostics = report.get('diagnostics', [])
          if diagnostics:
              for item in diagnostics[:50]:
                  print(item)
              raise SystemExit(f'compact conformance produced {len(diagnostics)} diagnostics')
          print('compact conformance clean:', report['overall']['cases'], 'cases')
          PY
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-cli/src/bench/relationship.rs \
                  crates/open-kioku-cli/src/bench/relationship_live.rs \
                  crates/open-kioku-graph/src/lib.rs \
                  benchmarks/relationship-cases.json \
                  benchmarks/relationship-ci-cases.json \
                  benchmarks/relationship-thresholds.json
          git rm -r .tmp-ri3
          git diff --cached --check
          git commit -m "test(ri3): complete frozen relationship conformance foundation"
          git push origin HEAD:agent/ri3-frozen-conformance
