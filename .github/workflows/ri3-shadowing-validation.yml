name: RI3 shadowing validation

on:
  push:
    branches:
      - agent/ri3-frozen-conformance
    paths:
      - .github/workflows/ri3-shadowing-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-frozen-conformance
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Resolver regression gate
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution bare_calls -- --nocapture
      - name: Full frozen relationship policy
        run: |
          set -euo pipefail
          cargo run -p open-kioku-cli -- --json relationship-bench \
            --corpus benchmarks/relationship-cases.json \
            --observations @live \
            --policy benchmarks/relationship-thresholds.json \
            --enforce-gates \
            --write /tmp/relationship-shadow-fix-report.json
