name: V3 release preparation v2

on:
  push:
    branches:
      - release/v3.0.0
    paths:
      - .github/workflows/v3-release-prep-v2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prepared_sha: ${{ steps.commit.outputs.prepared_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply deterministic V3 source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v3-release-prep.py
          scripts/sync-version.sh
          cargo metadata --format-version 1 >/dev/null

      - name: Validate prepared source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/sync-internal-cargo-versions.py \
            scripts/verify-release-artifact-hashes.py \
            scripts/validate-release-metadata.py
          cargo fmt --all -- --check
          scripts/validate-docs.sh
          scripts/validate-versions.sh
          scripts/check-no-ignored-tests.py
          git diff --check

      - name: Commit prepared V3 tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove failed/temporary preparation machinery from the candidate tree.
          git rm .github/workflows/v3-release-prep.yml scripts/v3-release-prep.py
          git add -A
          git reset .github/workflows/v3-release-prep-v2.yml
          git commit -m "release: prepare Open Kioku 3.0.0"
          git push origin HEAD:release/v3.0.0
          echo "prepared_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: ok-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: ok-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: ok-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ok-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ok-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.prepared_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo install cross --locked

      - name: Build V3 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }} -p open-kioku-cli
          else
            cargo build --release --target ${{ matrix.target }} -p open-kioku-cli
          fi

      - name: Package V3 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/ok.exe dist/${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ok dist/${{ matrix.binary_name }}
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-musl|x86_64-apple-darwin|aarch64-apple-darwin)
                strip dist/${{ matrix.binary_name }}
                ;;
              *)
                echo "Skipping host strip for cross-compiled target ${{ matrix.target }}"
                ;;
            esac
          fi
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          else
            sha256sum ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.binary_name }}
          path: dist/*

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Record exact candidate binary hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          metadata_path = Path("release-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          hashes = {}
          for artifact in metadata["artifacts"]:
              if "sha256" not in artifact:
                  continue
              binary = Path("dist") / artifact["name"]
              if not binary.is_file():
                  raise SystemExit(f"missing candidate binary {binary}")
              artifact["sha256"] = digest(binary)
              hashes[artifact["name"]] = artifact["sha256"]
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")

          formula = Path("Formula/open-kioku.rb")
          text = formula.read_text(encoding="utf-8")
          for name in [
              "ok-macos-arm64",
              "ok-macos-x86_64",
              "ok-linux-arm64",
              "ok-linux-x86_64",
          ]:
              pattern = re.compile(
                  rf'(url "[^"]*/{re.escape(name)}"\n\s+sha256 ")[0-9a-f]{{64}}(")'
              )
              text, count = pattern.subn(rf'\g<1>{hashes[name]}\2', text, count=1)
              if count != 1:
                  raise SystemExit(f"Formula hash anchor missing for {name}")
          formula.write_text(text, encoding="utf-8")
          PY

          python3 scripts/verify-release-artifact-hashes.py dist
          scripts/validate-versions.sh
          scripts/generate-release-trust-artifacts.sh dist
          git diff --check

      - name: Commit pinned V3 candidate hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-metadata.json Formula/open-kioku.rb
          git commit -m "release: pin v3.0.0 candidate artifact hashes"

      - name: Validate publishable release candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION=3.0.0 scripts/publish-crates.sh --dry-run
          scripts/verify-release-readiness.sh
          scripts/validate-docs.sh
          scripts/validate-versions.sh
          git diff --check

      - name: Self-clean V3 preparation gate and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v3-release-prep-v2.yml
          git commit -m "chore: remove v3 release preparation gate"
          git push origin HEAD:release/v3.0.0
