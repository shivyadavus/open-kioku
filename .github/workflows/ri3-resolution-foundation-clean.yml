name: RI3 clean resolution foundation

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0

      - name: Transplant reviewed foundation
        run: |
          git fetch origin agent/ri3-proof-gated-resolution
          git checkout origin/agent/ri3-proof-gated-resolution -- crates/open-kioku-resolution/src/lib.rs crates/open-kioku-resolution/src/index.rs crates/open-kioku-resolution/src/pipeline.rs

      - name: Validate resolution foundation
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution

      - name: Commit validated foundation
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-resolution-foundation-clean.yml
          git add crates/open-kioku-resolution/src/lib.rs crates/open-kioku-resolution/src/index.rs crates/open-kioku-resolution/src/pipeline.rs
          git commit -m "ri3: add deterministic proof-gated candidate foundation"
          git push origin HEAD:agent/ri3-resolution-foundation
