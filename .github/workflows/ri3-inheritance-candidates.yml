name: RI3 deterministic inheritance candidates

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0

      - name: Apply inheritance candidate hardening
        run: |
          python3 -m py_compile scripts/ri3_inheritance_candidates_tmp.py
          python3 scripts/ri3_inheritance_candidates_tmp.py

      - name: Validate resolver
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution

      - name: Commit validated hardening
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-inheritance-candidates.yml scripts/ri3_inheritance_candidates_tmp.py
          git add crates/open-kioku-resolution/src/inheritance.rs
          git commit -m "ri3: expose deterministic inheritance candidate sets"
          git push origin HEAD:agent/ri3-resolution-foundation
