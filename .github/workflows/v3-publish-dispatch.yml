name: V3 publication dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3-publish-dispatch.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: v3-publication-dispatch
  cancel-in-progress: false

jobs:
  dispatch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch immutable V3 release workflow and verify conclusion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag=v3.0.0
          tag_sha="$(git rev-list -n 1 "$tag")"
          test -n "$tag_sha"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          tag = 'v3.0.0'
          tag_sha = subprocess.check_output(
              ['git', 'rev-list', '-n', '1', tag], text=True
          ).strip()
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'open-kioku-v3-publication-dispatch',
          }

          def request(path, *, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  api + path, data=data, method=method, headers=headers
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          def matching_runs():
              _, payload = request('/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=30')
              return [
                  run for run in payload.get('workflow_runs', [])
                  if run.get('head_sha') == tag_sha
                  and run.get('event') == 'workflow_dispatch'
              ]

          before = {run['id'] for run in matching_runs()}
          status, _ = request(
              '/actions/workflows/release.yml/dispatches',
              method='POST',
              body={'ref': tag},
          )
          if status != 204:
              raise SystemExit(f'unexpected dispatch status: {status}')

          run = None
          for _ in range(40):
              time.sleep(3)
              fresh = [run for run in matching_runs() if run['id'] not in before]
              if fresh:
                  run = max(fresh, key=lambda item: item['id'])
                  break
          if run is None:
              raise SystemExit('release workflow dispatch succeeded but no new V3 run appeared')

          run_id = run['id']
          run_url = run['html_url']
          print(f'V3 release run: {run_url}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'V3 release run: {run_url}\n')

          while run.get('status') != 'completed':
              time.sleep(10)
              _, run = request(f'/actions/runs/{run_id}')

          conclusion = run.get('conclusion') or 'unknown'
          print(f'V3 release conclusion: {conclusion}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'V3 release conclusion: {conclusion}\n')
          if conclusion != 'success':
              raise SystemExit(f'V3 release workflow failed: {run_url}')
          PY
