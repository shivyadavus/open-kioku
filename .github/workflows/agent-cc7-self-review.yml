name: agent-cc7-self-review

on:
  push:
    branches:
      - agent/cc7-proof-retrieval-quality

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc7-proof-retrieval-quality
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply self-review hardening
        run: python3 .github/scripts/agent_cc7_self_review.py
      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
          cargo run --release -p open-kioku-cli -- --json retrieval-bench . \
            --cases-file benchmarks/retrieval-cases.json \
            --min-cases 30 \
            --write-baseline /tmp/retrieval-baseline-cc7-review.json \
            > /tmp/retrieval-report-cc7-review.json
          cmp benchmarks/retrieval-baseline.json /tmp/retrieval-baseline-cc7-review.json
      - name: Commit hardening and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/agent_cc7_self_review.py
          rm .github/workflows/agent-cc7-self-review.yml
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "fix(prove): harden retrieval report compatibility checks"
          git push origin HEAD:agent/cc7-proof-retrieval-quality
