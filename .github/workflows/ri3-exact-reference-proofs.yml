name: RI3 exact reference proofs

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply exact reference proof emission
        run: python3 scripts/ri3_exact_reference_proofs_tmp.py

      - name: Validate reference proof contract
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-graph

      - name: Commit validated references and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-exact-reference-proofs.yml \
            scripts/ri3_exact_reference_proofs_tmp.py
          git add crates/open-kioku-graph/src/lib.rs
          git commit -m "ri3: attach exact occurrence proofs to reference edges"
          git push origin HEAD:agent/ri3-proof-gated-resolution
