name: RI3 typed-call adversarial tests

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0

      - name: Apply typed-call tests
        run: python3 scripts/ri3_typed_call_tests_tmp.py

      - name: Validate typed-call regressions
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution typed_calls::tests

      - name: Commit validated tests
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-typed-call-tests.yml scripts/ri3_typed_call_tests_tmp.py
          git add crates/open-kioku-resolution/src/typed_calls.rs
          git commit -m "test(ri3): cover typed-receiver ambiguity and order independence"
          git push origin HEAD:agent/ri3-resolution-foundation
