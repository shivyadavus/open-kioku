name: agent-cc3-token-budget

on:
  push:
    branches:
      - agent/cc3-token-budget
    paths:
      - .github/scripts/agent_cc3_token_budget.py
      - .github/scripts/agent_cc3_repair.py
      - .github/workflows/agent-cc3-token-budget.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc3-token-budget
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted CC3 patch
        run: |
          python3 .github/scripts/agent_cc3_token_budget.py
          python3 .github/scripts/agent_cc3_repair.py
      - name: Format
        run: cargo fmt --all
      - name: Validate targeted packages
        run: |
          cargo clippy -p open-kioku-core -p open-kioku-context --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-core
          cargo test -p open-kioku-context
      - name: Validate full workspace
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product change and remove temporary tooling
        run: |
          rm .github/scripts/agent_cc3_token_budget.py .github/scripts/agent_cc3_repair.py .github/workflows/agent-cc3-token-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(context): add token-budgeted context selection [skip ci]"
          git push origin HEAD:agent/cc3-token-budget
