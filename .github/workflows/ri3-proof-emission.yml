name: RI3 typed proof emission

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply typed proof handoff
        run: |
          python3 scripts/ri3_proof_emission_tmp.py
          python3 scripts/ri3_proof_emission_layering_fix_tmp.py

      - name: Validate workspace compatibility and proof emission
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated proof emission and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-proof-emission.yml \
            scripts/ri3_proof_emission_tmp.py \
            scripts/ri3_proof_emission_layering_fix_tmp.py
          git add \
            crates/open-kioku-core/src/lib.rs \
            crates/open-kioku-resolution/src/call_candidates.rs \
            crates/open-kioku-ingest/src/lib.rs \
            crates/open-kioku-graph/src/lib.rs \
            crates/open-kioku-graph/src/buffer.rs
          git commit -m "ri3: emit only proof-gated resolved relationships"
          git push origin HEAD:agent/ri3-proof-gated-resolution
