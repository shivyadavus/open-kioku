name: RI3 authoritative consumers

on:
  push:
    branches:
      - agent/ri3-resolution-foundation
    paths:
      - scripts/ri3_authoritative_consumers_tmp.py
      - .github/workflows/ri3-authoritative-consumers.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply authoritative consumer slice
        run: python3 scripts/ri3_authoritative_consumers_tmp.py
      - name: Validate authoritative consumer contract
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-graph -p open-kioku-architecture -p open-kioku-context --all-targets -- -D warnings
          cargo test -p open-kioku-graph ri3_static_import_authority_tests
          cargo test -p open-kioku-architecture ri3_authoritative_policy_edge_tests
          cargo test -p open-kioku-context ri3_context_dependency_authority_tests
          git diff --check
      - name: Commit validated consumer defaults and self-clean
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/open-kioku-graph/src/lib.rs crates/open-kioku-architecture/src/lib.rs crates/open-kioku-context/src/lib.rs
          git diff --cached --quiet && { echo "expected authoritative consumer changes missing" >&2; exit 1; }
          git commit -m "feat: default RI3 structural consumers to authoritative edges"
          git rm scripts/ri3_authoritative_consumers_tmp.py .github/workflows/ri3-authoritative-consumers.yml
          git commit -m "chore: remove RI3 authoritative consumer gate"
          git push origin HEAD:agent/ri3-resolution-foundation
