name: agent-cc7-baseline-compat
on:
  push:
    branches: [agent/cc7-retrieval-report-provenance]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc7-retrieval-report-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply baseline compatibility hardening
        run: python3 .github/scripts/agent_cc7_baseline_compat.py
      - name: Validate exact hardened product
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
          ./target/debug/ok --json retrieval-bench . --cases-file benchmarks/retrieval-cases.json --min-cases 30 --write-json /tmp/retrieval-report.json --write-baseline /tmp/retrieval-baseline.json > /tmp/retrieval-stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/retrieval-report.json').read_text())
          assert report['baseline_deltas']
          assert all(delta['split'] == 'holdout' for delta in report['baseline_deltas'])
          expected = json.loads(Path('benchmarks/retrieval-baseline.json').read_text())
          actual = json.loads(Path('/tmp/retrieval-baseline.json').read_text())
          assert actual == expected
          PY
      - name: Commit hardening and self-clean
        run: |
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add crates/open-kioku-cli/src/bench/retrieval.rs
          git commit -m "fix(bench): fail closed on incompatible retrieval baselines"
          git rm .github/scripts/agent_cc7_baseline_compat.py .github/workflows/agent-cc7-baseline-compat.yml
          git commit -m "chore: remove temporary CC7 hardening tooling"
          git push origin HEAD:agent/cc7-retrieval-report-provenance
