name: agent-cc5-filter-aware-path-routing

on:
  push:
    branches:
      - agent/cc5-filter-aware-path-routing

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc5-filter-aware-path-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply filter-aware semantic routing implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 marker, found {count}")
              p.write_text(text.replace(old, new, 1))

          # CandidateRequest carries only repository-validated scope. Candidate sources may use it,
          # but scope never changes evidence authority or required-evidence semantics.
          replace_once(
              'crates/open-kioku-context/src/candidates.rs',
              '''#[derive(Debug, Clone)]
          pub struct CandidateRequest {
              pub task: String,
              pub search_terms: Vec<String>,
              pub limit: usize,
          }

          impl CandidateRequest {
              pub fn new(task: impl Into<String>, search_terms: Vec<String>, limit: usize) -> Self {
                  Self {
                      task: task.into(),
                      search_terms,
                      limit: limit.clamp(1, 200),
                  }
              }
          }
          ''',
              '''#[derive(Debug, Clone, Default, PartialEq, Eq)]
          pub struct CandidateScope {
              /// Repository-relative path or directory prefixes that were validated against the
              /// indexed file inventory before candidate generation. Empty means unscoped.
              pub path_prefixes: Vec<String>,
          }

          #[derive(Debug, Clone)]
          pub struct CandidateRequest {
              pub task: String,
              pub search_terms: Vec<String>,
              pub limit: usize,
              pub scope: CandidateScope,
          }

          impl CandidateRequest {
              pub fn new(task: impl Into<String>, search_terms: Vec<String>, limit: usize) -> Self {
                  Self {
                      task: task.into(),
                      search_terms,
                      limit: limit.clamp(1, 200),
                      scope: CandidateScope::default(),
                  }
              }

              pub fn with_path_prefixes(mut self, path_prefixes: Vec<String>) -> Self {
                  self.scope.path_prefixes = path_prefixes;
                  self
              }
          }
          ''',
              'CandidateRequest scope contract',
          )

          # Context routing validates path hints against indexed repository metadata before enforcing
          # them. Invalid/nonexistent paths become visible caveats, never host-filesystem filters.
          replace_once(
              'crates/open-kioku-context/src/lib.rs',
              '''        let intent = TaskSearchIntent::parse(task);
                  let routing = routing::classify_task(task);
                  let candidate_limit = routing.policy.request_limit(limit).clamp(20, 200);
                  let request =
                      candidates::CandidateRequest::new(task, intent.search_terms(task), candidate_limit);
          ''',
              '''        let intent = TaskSearchIntent::parse(task);
                  let routing = routing::classify_task(task);
                  let candidate_limit = routing.policy.request_limit(limit).clamp(20, 200);
                  let (path_prefixes, scope_caveats) =
                      validated_candidate_path_scope(&intent.path_anchors, &files);
                  let request = candidates::CandidateRequest::new(
                      task,
                      intent.search_terms(task),
                      candidate_limit,
                  )
                  .with_path_prefixes(path_prefixes);
          ''',
              'context request scope propagation',
          )
          replace_once(
              'crates/open-kioku-context/src/lib.rs',
              '''        let fused = candidates::fuse_candidate_streams(&streams, candidate_limit, &fusion_config);
                  let mut diagnostics = fused.diagnostics;
                  diagnostics.routing = routing.diagnostics();
          ''',
              '''        let fused = candidates::fuse_candidate_streams(&streams, candidate_limit, &fusion_config);
                  let mut diagnostics = fused.diagnostics;
                  diagnostics.routing = routing.diagnostics();
                  diagnostics.caveats.extend(scope_caveats);
                  diagnostics.caveats.sort();
                  diagnostics.caveats.dedup();
          ''',
              'scope caveat propagation',
          )
          replace_once(
              'crates/open-kioku-context/src/lib.rs',
              '''fn normalize_path(path: &std::path::Path) -> String {
              path.to_string_lossy()
                  .replace('\\\\', "/")
                  .trim_start_matches("./")
                  .to_string()
          }
          ''',
              '''fn normalize_path(path: &std::path::Path) -> String {
              path.to_string_lossy()
                  .replace('\\\\', "/")
                  .trim_start_matches("./")
                  .to_string()
          }

          fn validated_candidate_path_scope(
              path_anchors: &[String],
              files: &[File],
          ) -> (Vec<String>, Vec<String>) {
              let indexed_paths = files
                  .iter()
                  .map(|file| normalize_path(&file.path))
                  .collect::<Vec<_>>();
              let mut validated = Vec::new();
              let mut caveats = Vec::new();

              for anchor in path_anchors {
                  let normalized = anchor
                      .replace('\\\\', "/")
                      .trim_start_matches("./")
                      .trim_matches('/')
                      .to_string();
                  let invalid = normalized.is_empty()
                      || normalized
                          .split('/')
                          .any(|segment| segment.is_empty() || segment == "." || segment == "..");
                  if invalid {
                      caveats.push(format!(
                          "query path scope `{anchor}` is not a safe repository-relative prefix and was not enforced"
                      ));
                      continue;
                  }
                  let directory_prefix = format!("{normalized}/");
                  if indexed_paths.iter().any(|path| {
                      path == &normalized || path.starts_with(&directory_prefix)
                  }) {
                      if !validated.contains(&normalized) {
                          validated.push(normalized);
                      }
                  } else {
                      caveats.push(format!(
                          "query path scope `{anchor}` did not match indexed repository paths and was not enforced"
                      ));
                  }
              }
              validated.sort();
              caveats.sort();
              (validated, caveats)
          }
          ''',
              'validated path scope helper',
          )

          # Semantic manager exposes an explainable routed search. Auto ANN indexes use an exact-flat
          # subset when a validated path scope is smaller than the measured ANN row gate. Explicit ANN
          # configuration remains explicit. HNSW filtering happens inside usearch before top-k truncation.
          replace_once(
              'crates/open-kioku-semantic/src/lib.rs',
              '''#[derive(Debug, Clone, Serialize, Deserialize)]
          pub struct SemanticIndexReport {
              pub status: SemanticStatus,
              pub indexed_count: usize,
              pub reused_embeddings: usize,
              pub embedded_count: usize,
              pub removed_count: usize,
          }
          ''',
              '''#[derive(Debug, Clone, Serialize, Deserialize)]
          pub struct SemanticIndexReport {
              pub status: SemanticStatus,
              pub indexed_count: usize,
              pub reused_embeddings: usize,
              pub embedded_count: usize,
              pub removed_count: usize,
          }

          #[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]
          pub struct SemanticSearchRouting {
              pub selected_backend: String,
              pub total_vector_count: usize,
              pub eligible_candidate_count: usize,
              pub filter_selectivity: String,
              pub path_scope_enforced: bool,
              pub routing_reason: String,
              pub ann_profile: Option<String>,
              pub caveats: Vec<String>,
          }

          #[derive(Debug, Clone)]
          pub struct SemanticSearchReport {
              pub results: Vec<SearchResult>,
              pub routing: SemanticSearchRouting,
          }
          ''',
              'semantic routing report types',
          )

          replace_once(
              'crates/open-kioku-semantic/src/lib.rs',
              '''    pub fn search(&self, query: &str, limit: usize) -> Result<Vec<SearchResult>> {
                  self.search_with_allowlist(query, limit, None)
              }

              pub fn search_with_allowlist(
                  &self,
                  query: &str,
                  limit: usize,
                  allowlist: Option<HashSet<VectorId>>,
              ) -> Result<Vec<SearchResult>> {
                  let status = self.status();
                  if !status.ready {
                      return Err(OkError::Unsupported(format!(
                          "semantic index is {}; run `ok semantic index` first",
                          status.state
                      )));
                  }
                  let provider = provider_for_config(&self.config, false, &self.models_dir())?;
                  let targets = read_targets(&self.current_dir().join("ids.json"))?;
                  let query_vector = provider.embed_query(query)?;
                  let options = VectorSearchOptions {
                      limit,
                      allowlist,
                      target_kind: None,
                  };
                  let backend = status
                      .manifest
                      .as_ref()
                      .map(|manifest| manifest.backend.as_str())
                      .ok_or_else(|| OkError::Storage("semantic manifest missing for ready index".into()))?;
                  let hits = match backend {
                      "exact-flat" => ExactFlatVectorIndex::load(&self.current_dir().join("index.json"))?
                          .search(&query_vector, options)?,
                      "usearch-hnsw-f32" | "usearch-hnsw-bf16" => {
                          let index =
                              UsearchHnswVectorIndex::load(&self.current_dir().join("index.usearch"))?;
                          if index.parameters() != PRODUCTION_HNSW_PARAMETERS {
                              return Err(OkError::Storage(format!(
                                  "semantic HNSW artifact uses {:?}, expected measured profile {} ({:?}); rebuild the semantic index",
                                  index.parameters(),
                                  PRODUCTION_HNSW_PROFILE,
                                  PRODUCTION_HNSW_PARAMETERS
                              )));
                          }
                          index.search(&query_vector, options)?
                      }
                      other => {
                          return Err(OkError::Storage(format!(
                              "semantic manifest contains unsupported vector backend `{other}`"
                          )))
                      }
                  };
                  hydrate_hits(self.store, &targets, hits)
              }
          ''',
              '''    pub fn search(&self, query: &str, limit: usize) -> Result<Vec<SearchResult>> {
                  self.search_with_allowlist(query, limit, None)
              }

              pub fn search_with_allowlist(
                  &self,
                  query: &str,
                  limit: usize,
                  allowlist: Option<HashSet<VectorId>>,
              ) -> Result<Vec<SearchResult>> {
                  Ok(self
                      .search_routed(query, limit, allowlist, &[])?
                      .results)
              }

              pub fn search_with_path_prefixes(
                  &self,
                  query: &str,
                  limit: usize,
                  path_prefixes: &[String],
              ) -> Result<SemanticSearchReport> {
                  self.search_routed(query, limit, None, path_prefixes)
              }

              fn search_routed(
                  &self,
                  query: &str,
                  limit: usize,
                  caller_allowlist: Option<HashSet<VectorId>>,
                  path_prefixes: &[String],
              ) -> Result<SemanticSearchReport> {
                  let status = self.status();
                  if !status.ready {
                      return Err(OkError::Unsupported(format!(
                          "semantic index is {}; run `ok semantic index` first",
                          status.state
                      )));
                  }
                  let provider = provider_for_config(&self.config, false, &self.models_dir())?;
                  let targets = read_targets(&self.current_dir().join("ids.json"))?;
                  let total_vector_count = targets.len();
                  let normalized_prefixes = normalize_path_prefixes(path_prefixes)?;
                  let path_scope_enforced = !normalized_prefixes.is_empty();
                  let scoped_ids = if path_scope_enforced {
                      Some(
                          targets
                              .values()
                              .filter(|target| target_matches_path_scope(target, &normalized_prefixes))
                              .map(|target| target.vector_id)
                              .collect::<HashSet<_>>(),
                      )
                  } else {
                      None
                  };
                  let allowlist = intersect_allowlists(caller_allowlist, scoped_ids);
                  let eligible_candidate_count = allowlist
                      .as_ref()
                      .map(|ids| {
                          targets
                              .values()
                              .filter(|target| ids.contains(&target.vector_id))
                              .count()
                      })
                      .unwrap_or(total_vector_count);
                  let filter_selectivity = semantic_filter_selectivity(
                      total_vector_count,
                      eligible_candidate_count,
                      path_scope_enforced || allowlist.is_some(),
                  );
                  let manifest_backend = status
                      .manifest
                      .as_ref()
                      .map(|manifest| manifest.backend.as_str())
                      .ok_or_else(|| OkError::Storage("semantic manifest missing for ready index".into()))?;
                  let mut selected_backend = manifest_backend.to_string();
                  let mut routing_reason = if path_scope_enforced {
                      format!(
                          "validated path scope leaves {eligible_candidate_count} of {total_vector_count} semantic candidates"
                      )
                  } else {
                      format!("semantic query uses the persisted {manifest_backend} backend")
                  };
                  let mut caveats = Vec::new();

                  let should_use_scoped_exact = path_scope_enforced
                      && self.config.backend == "auto"
                      && backend_is_ann(manifest_backend)
                      && eligible_candidate_count < self.config.ann_min_rows;
                  let query_vector = provider.embed_query(query)?;
                  let options = VectorSearchOptions {
                      limit,
                      allowlist: allowlist.clone(),
                      target_kind: None,
                  };

                  let hits = if should_use_scoped_exact {
                      match build_scoped_exact_index(
                          &self.current_dir(),
                          &targets,
                          allowlist.as_ref().expect("scoped search has an allowlist"),
                          &self.config,
                      )? {
                          Some(index) => {
                              selected_backend = "exact-flat".into();
                              routing_reason = format!(
                                  "auto backend selected exact-flat because validated scope has {eligible_candidate_count} eligible candidates below ann_min_rows={} (total vectors {total_vector_count})",
                                  self.config.ann_min_rows
                              );
                              index.search(
                                  &query_vector,
                                  VectorSearchOptions {
                                      limit,
                                      allowlist: None,
                                      target_kind: None,
                                  },
                              )?
                          }
                          None => {
                              caveats.push(
                                  "scoped exact-flat routing could not reconstruct a complete exact subset from the local embedding cache; retained pre-filtered ANN search without widening scope"
                                      .into(),
                              );
                              routing_reason = format!(
                                  "auto backend retained {manifest_backend} because the exact subset cache was incomplete; validated path scope still filters before ANN top-k"
                              );
                              search_persisted_backend(
                                  &self.current_dir(),
                                  manifest_backend,
                                  &query_vector,
                                  options,
                              )?
                          }
                      }
                  } else {
                      if path_scope_enforced && backend_is_ann(manifest_backend) {
                          routing_reason = if self.config.backend == "auto" {
                              format!(
                                  "auto backend retained {manifest_backend} because validated scope has {eligible_candidate_count} eligible candidates at or above ann_min_rows={} (total vectors {total_vector_count})",
                                  self.config.ann_min_rows
                              )
                          } else {
                              format!(
                                  "explicit backend `{}` retained {manifest_backend}; validated path scope filters candidates before ANN top-k",
                                  self.config.backend
                              )
                          };
                      }
                      search_persisted_backend(
                          &self.current_dir(),
                          manifest_backend,
                          &query_vector,
                          options,
                      )?
                  };
                  let results = hydrate_hits(self.store, &targets, hits)?;
                  Ok(SemanticSearchReport {
                      results,
                      routing: SemanticSearchRouting {
                          selected_backend: selected_backend.clone(),
                          total_vector_count,
                          eligible_candidate_count,
                          filter_selectivity,
                          path_scope_enforced,
                          routing_reason,
                          ann_profile: backend_is_ann(&selected_backend)
                              .then(|| PRODUCTION_HNSW_PROFILE.to_string()),
                          caveats,
                      },
                  })
              }
          ''',
              'semantic routed search implementation',
          )

          replace_once(
              'crates/open-kioku-semantic/src/lib.rs',
              '''fn index_artifacts_present(current: &Path, backend: &str) -> bool {
              match resolved_backend_from_name(backend) {
                  Ok(ResolvedSemanticBackend::ExactFlat) => current.join("index.json").is_file(),
                  Ok(ResolvedSemanticBackend::HnswF32 | ResolvedSemanticBackend::HnswBf16) => {
                      current.join("index.usearch").is_file() && current.join("index.meta.json").is_file()
                  }
                  Err(_) => false,
              }
          }
          ''',
              '''fn index_artifacts_present(current: &Path, backend: &str) -> bool {
              match resolved_backend_from_name(backend) {
                  Ok(ResolvedSemanticBackend::ExactFlat) => current.join("index.json").is_file(),
                  Ok(ResolvedSemanticBackend::HnswF32 | ResolvedSemanticBackend::HnswBf16) => {
                      current.join("index.usearch").is_file() && current.join("index.meta.json").is_file()
                  }
                  Err(_) => false,
              }
          }

          fn normalize_path_prefixes(path_prefixes: &[String]) -> Result<Vec<String>> {
              let mut normalized = Vec::new();
              for prefix in path_prefixes {
                  let value = prefix
                      .replace('\\\\', "/")
                      .trim_start_matches("./")
                      .trim_matches('/')
                      .to_string();
                  if value.is_empty()
                      || value
                          .split('/')
                          .any(|segment| segment.is_empty() || segment == "." || segment == "..")
                  {
                      return Err(OkError::Unsupported(format!(
                          "semantic path scope `{prefix}` is not a safe repository-relative prefix"
                      )));
                  }
                  if !normalized.contains(&value) {
                      normalized.push(value);
                  }
              }
              normalized.sort();
              Ok(normalized)
          }

          fn target_matches_path_scope(target: &SemanticTarget, prefixes: &[String]) -> bool {
              let path = target.path.to_string_lossy().replace('\\\\', "/");
              prefixes.iter().any(|prefix| {
                  path == *prefix || path.starts_with(&format!("{prefix}/"))
              })
          }

          fn intersect_allowlists(
              left: Option<HashSet<VectorId>>,
              right: Option<HashSet<VectorId>>,
          ) -> Option<HashSet<VectorId>> {
              match (left, right) {
                  (None, None) => None,
                  (Some(ids), None) | (None, Some(ids)) => Some(ids),
                  (Some(left), Some(right)) => Some(left.intersection(&right).copied().collect()),
              }
          }

          fn semantic_filter_selectivity(
              total: usize,
              eligible: usize,
              filtered: bool,
          ) -> String {
              if !filtered {
                  return "unfiltered".into();
              }
              if total == 0 || eligible.saturating_mul(10) <= total {
                  "highly-selective".into()
              } else if eligible.saturating_mul(2) <= total {
                  "medium-selectivity".into()
              } else {
                  "broad".into()
              }
          }

          fn build_scoped_exact_index(
              current: &Path,
              targets: &HashMap<String, SemanticTarget>,
              allowlist: &HashSet<VectorId>,
              config: &SemanticConfig,
          ) -> Result<Option<ExactFlatVectorIndex>> {
              let Some(cache) = read_json::<EmbeddingCache>(&current.join("embeddings.cache")) else {
                  return Ok(None);
              };
              let mut exact = ExactFlatVectorIndex::new(config.dimensions)?;
              for target in targets
                  .values()
                  .filter(|target| allowlist.contains(&target.vector_id))
              {
                  let Some(entry) = cache.entries.get(&cache_key(target, config)) else {
                      return Ok(None);
                  };
                  if entry.target_id != target.stable_id
                      || entry.dimensions != config.dimensions
                      || entry.vector.len() != config.dimensions
                  {
                      return Ok(None);
                  }
                  exact.add(VectorRecord {
                      id: target.vector_id,
                      target_id: target.stable_id.clone(),
                      target_kind: target.kind.clone(),
                      vector: entry.vector.clone(),
                  })?;
              }
              Ok(Some(exact))
          }

          fn search_persisted_backend(
              current: &Path,
              backend: &str,
              query_vector: &[f32],
              options: VectorSearchOptions,
          ) -> Result<Vec<open_kioku_vector::VectorHit>> {
              match backend {
                  "exact-flat" => ExactFlatVectorIndex::load(&current.join("index.json"))?
                      .search(query_vector, options),
                  "usearch-hnsw-f32" | "usearch-hnsw-bf16" => {
                      let index = UsearchHnswVectorIndex::load(&current.join("index.usearch"))?;
                      if index.parameters() != PRODUCTION_HNSW_PARAMETERS {
                          return Err(OkError::Storage(format!(
                              "semantic HNSW artifact uses {:?}, expected measured profile {} ({:?}); rebuild the semantic index",
                              index.parameters(),
                              PRODUCTION_HNSW_PROFILE,
                              PRODUCTION_HNSW_PARAMETERS
                          )));
                      }
                      index.search(query_vector, options)
                  }
                  other => Err(OkError::Storage(format!(
                      "semantic manifest contains unsupported vector backend `{other}`"
                  ))),
              }
          }
          ''',
              'semantic scope/routing helpers',
          )

          # CLI and MCP use the same routed semantic API, so path scope behavior cannot diverge.
          for path in [
              'crates/open-kioku-cli/src/commands/context.rs',
              'crates/open-kioku-mcp/src/lib.rs',
          ]:
              p = Path(path)
              text = p.read_text()
              old = '''        let results = self.manager.search(&request.task, request.limit)?;
                  Ok('''
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: semantic search marker count={text.count(old)}')
              text = text.replace(
                  old,
                  '''        let report = self.manager.search_with_path_prefixes(
                      &request.task,
                      request.limit,
                      &request.scope.path_prefixes,
                  )?;
                  let rationale = format!(
                      "local semantic-vector similarity; backend={} eligible={}/{} selectivity={} reason={}",
                      report.routing.selected_backend,
                      report.routing.eligible_candidate_count,
                      report.routing.total_vector_count,
                      report.routing.filter_selectivity,
                      report.routing.routing_reason,
                  );
                  let mut stream = ''',
                  1,
              )
              # Rewrite the surrounding CandidateStream construction without altering authority.
              if path.endswith('context.rs'):
                  old_tail = '''open_kioku_context::candidates::CandidateStream::success(
                      open_kioku_core::RetrievalSourceKind::SemanticVector,
                      results
                          .into_iter()
                          .map(|result| {
                              open_kioku_context::candidates::StreamCandidate::from_result(
                                  result,
                                  open_kioku_core::RetrievalAuthority::Heuristic,
                                  "local semantic-vector similarity",
                              )
                          })
                          .collect(),
                  ))
          '''
                  new_tail = '''open_kioku_context::candidates::CandidateStream::success(
                      open_kioku_core::RetrievalSourceKind::SemanticVector,
                      report
                          .results
                          .into_iter()
                          .map(|result| {
                              open_kioku_context::candidates::StreamCandidate::from_result(
                                  result,
                                  open_kioku_core::RetrievalAuthority::Heuristic,
                                  rationale.clone(),
                              )
                          })
                          .collect(),
                  );
                  stream.caveats.extend(report.routing.caveats);
                  Ok(stream)
          '''
              else:
                  old_tail = '''CandidateStream::success(
                      open_kioku_core::RetrievalSourceKind::SemanticVector,
                      results
                          .into_iter()
                          .map(|result| {
                              StreamCandidate::from_result(
                                  result,
                                  open_kioku_core::RetrievalAuthority::Heuristic,
                                  "local semantic-vector similarity",
                              )
                          })
                          .collect(),
                  ))
          '''
                  new_tail = '''CandidateStream::success(
                      open_kioku_core::RetrievalSourceKind::SemanticVector,
                      report
                          .results
                          .into_iter()
                          .map(|result| {
                              StreamCandidate::from_result(
                                  result,
                                  open_kioku_core::RetrievalAuthority::Heuristic,
                                  rationale.clone(),
                              )
                          })
                          .collect(),
                  );
                  stream.caveats.extend(report.routing.caveats);
                  Ok(stream)
          '''
              if text.count(old_tail) != 1:
                  raise SystemExit(f'{path}: semantic stream tail count={text.count(old_tail)}')
              p.write_text(text.replace(old_tail, new_tail, 1))

          # Adversarial/end-to-end semantic routing tests: auto ANN must switch to exact-flat for a
          # highly selective validated path scope; explicit ANN must not be silently overridden.
          path = Path('crates/open-kioku-semantic/src/lib.rs')
          text = path.read_text()
          marker = '''    fn semantic_config() -> SemanticConfig {
          '''
          tests = r'''    #[test]
              fn auto_ann_routes_highly_selective_path_scope_to_exact_flat() {
                  let temp = tempfile::tempdir().unwrap();
                  let store = SqliteStore::open(temp.path().join(".ok/index.sqlite")).unwrap();
                  let manifest = open_kioku_core::IndexManifest {
                      repository: open_kioku_core::Repository {
                          id: RepositoryId("repo".into()),
                          name: "repo".into(),
                          root: temp.path().to_path_buf(),
                          branch: Some("main".into()),
                          commit: Some("abc".into()),
                          indexed_at: Some(Utc::now()),
                      },
                      file_count: 3,
                      symbol_count: 3,
                      chunk_count: 3,
                      indexed_at: Utc::now(),
                      schema_version: 1,
                      index_mode: Default::default(),
                      phase_reports: Vec::new(),
