name: Branch rustfmt once

on:
  push:
    branches:
      - agent/cc2-fusion-profile-provenance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc2-fusion-profile-provenance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format intended source only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "Already formatted"
            exit 0
          fi
          if [[ "$changed" != "crates/open-kioku-context/src/candidates.rs" ]]; then
            echo "Unexpected rustfmt changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-context/src/candidates.rs
          git commit -m "style(context): apply rustfmt to fusion provenance"
          git push origin HEAD:agent/cc2-fusion-profile-provenance
