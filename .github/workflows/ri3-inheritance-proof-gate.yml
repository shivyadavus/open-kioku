name: RI3 lexical inheritance proof gate

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply lexical and inheritance proof policy
        run: python3 scripts/ri3_inheritance_proof_gate_tmp.py

      - name: Validate proof policy and deterministic inheritance
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution

      - name: Commit validated proof gate and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-inheritance-proof-gate.yml \
            scripts/ri3_inheritance_proof_gate_tmp.py
          git add \
            crates/open-kioku-core/src/relationship.rs \
            crates/open-kioku-resolution/src/call_candidates.rs \
            crates/open-kioku-resolution/src/inheritance.rs
          git commit -m "ri3: prove lexical and inherited call relationships deterministically"
          git push origin HEAD:agent/ri3-proof-gated-resolution
