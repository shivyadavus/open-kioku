name: agent-fix-retrieval-unit-provenance

on:
  push:
    branches:
      - agent/retrieval-unit-provenance

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retrieval-unit-provenance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted provenance patch
        run: |
          python3 .github/scripts/agent_fix_retrieval_unit_provenance.py
          python3 .github/scripts/agent_fix_retrieval_unit_provenance_post.py
          python3 .github/scripts/agent_fix_retrieval_unit_key_scalars.py
          cargo fmt --all
      - name: Validate product tree
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product change and remove temporary tooling
        run: |
          rm .github/scripts/agent_fix_retrieval_unit_provenance.py
          rm .github/scripts/agent_fix_retrieval_unit_provenance_post.py
          rm .github/scripts/agent_fix_retrieval_unit_key_scalars.py
          rm .github/workflows/agent-fix-retrieval-unit-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(context): preserve retrieval unit provenance end to end'
          git push origin HEAD:agent/retrieval-unit-provenance
