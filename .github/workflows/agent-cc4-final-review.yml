name: agent-cc4-final-review

on:
  push:
    branches:
      - agent/cc4-query-shape-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc4-query-shape-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply reviewed product patch
        run: |
          git fetch origin main
          git checkout origin/main -- Cargo.lock
          python3 .github/scripts/agent_cc4_final_review.py
          cargo fmt --all
      - name: Validate exact reviewed product tree
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-context
          cargo test -p open-kioku-core
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit reviewed product tree and remove temporary tooling
        run: |
          rm .github/scripts/agent_cc4_final_review.py
          rm .github/workflows/agent-cc4-final-review.yml
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reviewed changes to commit"
            exit 1
          fi
          git commit -m "fix(context): harden query-shape routing boundaries"
          git push origin HEAD:agent/cc4-query-shape-routing
