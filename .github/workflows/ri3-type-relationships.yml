name: RI3 proof-gated type relationships

on:
  push:
    branches:
      - agent/ri3-resolution-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0

      - name: Apply type relationship migration
        run: |
          python3 -m py_compile scripts/ri3_type_relationships_tmp.py scripts/ri3_type_relationships_fix_tmp.py
          python3 scripts/ri3_type_relationships_tmp.py
          python3 scripts/ri3_type_relationships_fix_tmp.py

      - name: Validate type relationship trust boundary
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated type relationship migration
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -- Cargo.lock
          rm -rf scripts/__pycache__
          git rm -f .github/workflows/ri3-type-relationships.yml scripts/ri3_type_relationships_tmp.py scripts/ri3_type_relationships_fix_tmp.py
          git add crates/open-kioku-core/src/relationship.rs crates/open-kioku-resolution/src/lib.rs crates/open-kioku-resolution/src/inheritance.rs crates/open-kioku-resolution/src/typed_calls.rs crates/open-kioku-resolution/src/type_relations.rs crates/open-kioku-ingest/src/lib.rs
          if ! git diff --quiet; then
            echo "unexpected unstaged tracked changes after validation cleanup:" >&2
            git status --short >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "unexpected untracked files after validation cleanup:" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi
          git commit -m "ri3: proof-gate type and inheritance relationships"
          git pull --rebase origin agent/ri3-resolution-foundation
          git push origin HEAD:agent/ri3-resolution-foundation
