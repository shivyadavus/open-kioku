name: V3 mainline prepare

on:
  push:
    branches:
      - release/v3.0.0-mainline
    paths:
      - .github/workflows/v3-mainline-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3.0.0-mainline
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Generate coordinated 3.0.0 state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare-v3-mainline.py
          scripts/sync-version.sh
          cargo metadata --format-version 1 >/dev/null

      - name: Validate generated release state
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          scripts/validate-docs.sh
          scripts/validate-versions.sh
          scripts/check-no-ignored-tests.py
          scripts/validate-public-quickstart.sh --static
          git diff --check

      - name: Commit release state and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/v3-mainline-prepare.yml scripts/prepare-v3-mainline.py
          git commit -m "release: prepare Open Kioku 3.0.0"
          git rm .github/workflows/v3-mainline-prepare.yml scripts/prepare-v3-mainline.py
          git commit -m "chore: remove v3 mainline preparation gate"
          git push origin HEAD:release/v3.0.0-mainline
