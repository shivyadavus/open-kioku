name: RI3 fix finalizer test imports v3

on:
  push:
    branches:
      - agent/ri3-core-authority-final

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-authority-final
          fetch-depth: 0
      - name: Patch only new_imports block
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/ri3-authority-finalize-json.yml")
          text = path.read_text()
          block_start = text.index('new_imports = """')
          target = 'use std::collections::BTreeSet;'
          target_at = text.index(target, block_start)
          prefix = 'use open_kioku_core::{FileRange, SymbolId};\n          #[cfg(test)]\n          '
          if 'use open_kioku_core::{FileRange, SymbolId};' in text[block_start:target_at]:
              raise SystemExit('test-only core imports already present')
          text = text[:target_at] + prefix + text[target_at:]
          path.write_text(text)
      - name: Commit precise fix and remove import helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-fix-finalizer-test-imports.yml .github/workflows/ri3-fix-finalizer-test-imports-v2.yml .github/workflows/ri3-fix-finalizer-test-imports-v3.yml
          git add .github/workflows/ri3-authority-finalize-json.yml
          git commit -m "chore: preserve RI3 evidence test-only imports"
          git push origin HEAD:agent/ri3-core-authority-final
