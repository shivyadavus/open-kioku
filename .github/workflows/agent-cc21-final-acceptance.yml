name: CC2.1 final acceptance

on:
  push:
    branches: [agent/cc2-document-corpus]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc2-document-corpus
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply product hardening and migrate classifier regression
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/cc21_finalize_product.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/open-kioku-ingest/src/lib.rs')
          text = p.read_text()
          old = '''    #[test]
              fn document_classifier_does_not_capture_code_examples_under_docs() {
                  assert_eq!(
                      document_type_for_path(Path::new("docs/guide.md")),
                      Some(DocumentType::Markdown)
                  );
                  assert_eq!(
                      document_type_for_path(Path::new("docs/notes.txt")),
                      Some(DocumentType::PlainText)
                  );
                  assert_eq!(
                      document_type_for_path(Path::new("README")),
                      Some(DocumentType::Readme)
                  );
                  assert!(document_type_for_path(Path::new("notes.txt")).is_none());
                  assert!(document_type_for_path(Path::new("docs/examples/client.rs")).is_none());
              }
          '''
          new = '''    #[test]
              fn document_classifier_requires_plain_text_opt_in_and_rejects_readme_code() {
                  let none = compile_globs(&[]).unwrap();
                  let configured =
                      compile_globs(&["docs/*.txt".into(), "docs/**/*.txt".into()]).unwrap();
                  assert_eq!(
                      document_type_for_path(Path::new("docs/guide.md"), &none),
                      Some(DocumentType::Markdown)
                  );
                  assert!(document_type_for_path(Path::new("docs/notes.txt"), &none).is_none());
                  assert_eq!(
                      document_type_for_path(Path::new("docs/notes.txt"), &configured),
                      Some(DocumentType::PlainText)
                  );
                  assert_eq!(
                      document_type_for_path(Path::new("README"), &none),
                      Some(DocumentType::Readme)
                  );
                  assert!(document_type_for_path(Path::new("README.rs"), &none).is_none());
                  assert!(
                      document_type_for_path(Path::new("docs/examples/client.rs"), &none).is_none()
                  );
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'classifier regression marker count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Targeted acceptance tests
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-storage
          cargo test -p open-kioku-storage-sqlite document_corpus_tests
          cargo test -p open-kioku-ingest document_corpus
          cargo test -p open-kioku-context indexed_document_stream_tests
          cargo test -p open-kioku-cli document_corpus_mode_benchmark_preserves_context_provenance
          cargo test -p open-kioku-plan plan_surfaces_fast_mode_caveat
          cargo bench -p open-kioku-cli --bench index --no-run
      - name: Full quality gates
        shell: bash
        run: |
          set -euxo pipefail
          cargo check --workspace
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo build --release -p open-kioku-cli
          ./target/release/ok --json retrieval-bench . --cases-file benchmarks/retrieval-cases.json --min-cases 30 --write-baseline /tmp/cc21-first.json >/tmp/cc21-first-out.json
          ./target/release/ok --json retrieval-bench . --cases-file benchmarks/retrieval-cases.json --no-index --min-cases 30 --write-baseline /tmp/cc21-second.json >/tmp/cc21-second-out.json
          cmp /tmp/cc21-first.json /tmp/cc21-second.json
          cmp benchmarks/retrieval-baseline.json /tmp/cc21-first.json
          git diff --check
      - name: Measure fast and full indexing on the same document workload
        shell: bash
        run: |
          set -euxo pipefail
          cargo bench -p open-kioku-cli --bench index -- --noplot | tee /tmp/cc21-index-bench.txt
          grep -F 'index_mode_fast_with_document_corpus' /tmp/cc21-index-bench.txt
          grep -F 'index_mode_full_with_document_corpus' /tmp/cc21-index-bench.txt
      - name: Commit validated product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/open-kioku-storage/src/lib.rs \
            crates/open-kioku-config/src/lib.rs \
            crates/open-kioku-ingest/src/lib.rs \
            crates/open-kioku-context/src/candidates/builtins.rs \
            crates/open-kioku-cli/benches/index.rs
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(index): complete document corpus acceptance semantics [skip ci]"
          git push origin HEAD:agent/cc2-document-corpus
