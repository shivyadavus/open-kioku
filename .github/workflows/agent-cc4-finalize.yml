name: agent-cc4-finalize

on:
  push:
    branches:
      - agent/cc4-query-shape-routing

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply self-review fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- Cargo.lock
          python3 .github/scripts/agent_cc4_finalize.py
          cargo fmt --all
      - name: Validate workspace and routing regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-context
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit validated product tree and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-cc4-finalize.yml
          rm .github/scripts/agent_cc4_finalize.py
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(context): harden conservative query-shape classification"
          git push origin HEAD:agent/cc4-query-shape-routing
