name: RI3 refresh MCP schema snapshot

on:
  push:
    branches:
      - agent/ri3-core-relationship-proofs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-relationship-proofs
          fetch-depth: 0

      - name: Refresh evidence schema golden
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json")
          text = path.read_text()

          old_edge = '''      {
        "count": 0,
        "description": "Edge of type References",
        "evidence_available": false,
        "name": "References",
        "required_evidence": [],
        "source_types": [],
        "stable": true,
        "target_types": []
      },
      {
        "count": 1,
        "description": "Edge of type Calls",'''
          new_edge = '''      {
        "count": 0,
        "description": "Edge of type References",
        "evidence_available": false,
        "name": "References",
        "required_evidence": [],
        "source_types": [],
        "stable": true,
        "target_types": []
      },
      {
        "count": 0,
        "description": "Edge of type UsesType",
        "evidence_available": false,
        "name": "UsesType",
        "required_evidence": [],
        "source_types": [],
        "stable": true,
        "target_types": []
      },
      {
        "count": 1,
        "description": "Edge of type Calls",'''
          if text.count(old_edge) != 1:
              raise SystemExit(f"expected one References→Calls snapshot seam, found {text.count(old_edge)}")
          text = text.replace(old_edge, new_edge, 1)

          old_flags = '''      "config_keys",
      "service_boundaries",
      "read_only_graph_query"'''
          new_flags = '''      "config_keys",
      "service_boundaries",
      "relationship_proofs",
      "read_only_graph_query"'''
          if text.count(old_flags) != 1:
              raise SystemExit(f"expected one feature flag seam, found {text.count(old_flags)}")
          text = text.replace(old_flags, new_flags, 1)
          path.write_text(text)

      - name: Validate MCP golden contract
        run: |
          cargo fmt --all -- --check
          cargo test -p open-kioku-mcp golden_mcp_protocol_snapshots_are_stable

      - name: Commit snapshot and remove one-shot workflow
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-refresh-mcp-snapshot.yml
          git add crates/open-kioku-mcp/snapshots/mcp/get_evidence_schema.json
          git commit -m "test(ri3): refresh evidence schema MCP golden"
          git push origin HEAD:agent/ri3-core-relationship-proofs
