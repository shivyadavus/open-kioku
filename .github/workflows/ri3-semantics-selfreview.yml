name: RI3 semantics self-review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.head_ref == 'agent/ri3-analysis-semantics-fingerprint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply self-review hardening
        run: python3 scripts/ri3-semantics-selfreview.py
      - name: Validate formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Validate CLI and MCP
        run: |
          cargo test -p open-kioku-cli
          cargo test -p open-kioku-mcp
          cargo clippy -p open-kioku-cli -p open-kioku-mcp --all-targets --all-features -- -D warnings
      - name: Commit hardening and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/ri3-semantics-selfreview.yml scripts/ri3-semantics-selfreview.py
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "fix(ri3): gate all authoritative relationship reads"
          git push origin HEAD:agent/ri3-analysis-semantics-fingerprint
