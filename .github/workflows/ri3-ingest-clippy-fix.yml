name: RI3 ingest clippy cleanup

on:
  push:
    branches:
      - agent/ri3-language-semantics-complete
    paths:
      - .github/workflows/ri3-ingest-clippy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded cleanup
        run: python3 scripts/ri3-ingest-clippy-fix.py
      - name: Validate ingest
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-ingest --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-ingest candidate_cap_hits_are_visible_in_index_quality
      - name: Commit durable cleanup and remove staging files
        run: |
          rm .github/workflows/ri3-ingest-clippy-fix.yml scripts/ri3-ingest-clippy-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-ingest/src/lib.rs .github/workflows/ri3-ingest-clippy-fix.yml scripts/ri3-ingest-clippy-fix.py
          git diff --cached --check
          git commit -m "Fix RI3 ingest lint regression"
          git push origin HEAD:agent/ri3-language-semantics-complete
