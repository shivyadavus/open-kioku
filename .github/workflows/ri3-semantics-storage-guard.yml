name: RI3 semantics graph-read guard

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.head_ref == 'agent/ri3-analysis-semantics-fingerprint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply centralized graph-read guard
        run: python3 scripts/ri3-semantics-storage-guard.py
      - name: Validate focused safety contract
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p open-kioku-storage-sqlite replace_graph_and_neighbors
          cargo test -p open-kioku-context
          cargo test -p open-kioku-plan
          cargo test -p open-kioku-mcp
          cargo clippy -p open-kioku-storage-sqlite -p open-kioku-context -p open-kioku-plan -p open-kioku-mcp --all-targets --all-features -- -D warnings
      - name: Commit safety hardening and remove staging tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/ri3-semantics-storage-guard.yml scripts/ri3-semantics-storage-guard.py
          git config user.name "Shiv Yadav"
          git config user.email "155265880+shivyadavus@users.noreply.github.com"
          git add -A
          git commit -m "fix(ri3): reject incompatible persisted graph reads"
          git push origin HEAD:agent/ri3-analysis-semantics-fingerprint
