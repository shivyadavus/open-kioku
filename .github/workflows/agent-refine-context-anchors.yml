name: agent-refine-context-anchors

on:
  push:
    branches:
      - agent/v2-semantic-resolution-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-resolution-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and test context anchor refinement
        run: |
          python3 .github/patch_context_anchors.py
          rm .github/patch_context_anchors.py
          rm .github/workflows/agent-refine-context-anchors.yml
          cargo fmt --all
          cargo test -p open-kioku-context
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/open-kioku-context/src/lib.rs crates/open-kioku-context/tests/workflow_terms.rs .github/patch_context_anchors.py .github/workflows/agent-refine-context-anchors.yml
          git commit -m "fix: expand natural-language context anchors"
          git push origin HEAD:agent/v2-semantic-resolution-pipeline
