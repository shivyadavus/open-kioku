name: RI3 shared type candidates

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply shared type-candidate migration
        run: python3 scripts/ri3_shared_type_candidates_tmp.py

      - name: Validate shared type resolution
        run: |
          cargo fmt --all
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution

      - name: Commit validated type resolution and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-shared-type-candidates.yml \
            scripts/ri3_shared_type_candidates_tmp.py
          git add \
            crates/open-kioku-resolution/src/lib.rs \
            crates/open-kioku-resolution/src/call_candidates.rs \
            crates/open-kioku-resolution/src/type_candidates.rs
          git commit -m "ri3: share deterministic type candidate discovery"
          git push origin HEAD:agent/ri3-proof-gated-resolution
