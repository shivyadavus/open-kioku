name: agent-cc5-generic-filter-routing

on:
  push:
    branches:
      - agent/cc5-generic-filter-routing

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply asserted routing patch
        run: python3 .github/scripts/agent_cc5_generic_filter.py
      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-vector
          cargo test -p open-kioku-semantic
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product change and remove temporary tooling
        run: |
          rm .github/workflows/agent-cc5-generic-filter-routing.yml
          rm .github/scripts/agent_cc5_generic_filter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-semantic/src/lib.rs crates/open-kioku-vector/src/lib.rs .github/workflows/agent-cc5-generic-filter-routing.yml .github/scripts/agent_cc5_generic_filter.py
          git commit -m "feat(semantic): route all selective filters by eligible set"
          git push origin HEAD:agent/cc5-generic-filter-routing
