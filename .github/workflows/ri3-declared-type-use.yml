name: RI3 declared type use

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply declared type-use resolution
        run: python3 scripts/ri3_declared_type_use_tmp.py

      - name: Validate type-use trust boundary
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated type uses and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-declared-type-use.yml \
            scripts/ri3_declared_type_use_tmp.py
          git add \
            crates/open-kioku-core/src/relationship.rs \
            crates/open-kioku-resolution/src/index.rs \
            crates/open-kioku-resolution/src/type_candidates.rs \
            crates/open-kioku-resolution/src/call_candidates.rs \
            crates/open-kioku-resolution/src/lib.rs \
            crates/open-kioku-ingest/src/lib.rs
          git commit -m "ri3: emit proof-gated declared type relationships"
          git push origin HEAD:agent/ri3-proof-gated-resolution
