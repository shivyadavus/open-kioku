name: RI3 one-shot structural patch

on:
  push:
    branches:
      - agent/ri3-core-relationship-proofs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-core-relationship-proofs
          fetch-depth: 0

      - name: Apply RI3 USES_TYPE contract
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          core = "crates/open-kioku-core/src/lib.rs"
          replace_once(
              core,
              "pub enum GraphEdgeType {\n    Contains,\n    Defines,\n    References,\n    Calls,",
              "pub enum GraphEdgeType {\n    Contains,\n    Defines,\n    References,\n    UsesType,\n    Calls,",
          )
          replace_once(
              core,
              "    #[test]\n    fn legacy_graph_json_deserializes_with_default_metadata() {",
              "    #[test]\n    fn uses_type_edge_type_has_stable_json_contract() {\n        let json = serde_json::to_string(&GraphEdgeType::UsesType).unwrap();\n        assert_eq!(json, \"\\\"USES_TYPE\\\"\");\n        let decoded: GraphEdgeType = serde_json::from_str(&json).unwrap();\n        assert_eq!(decoded, GraphEdgeType::UsesType);\n    }\n\n    #[test]\n    fn legacy_graph_json_deserializes_with_default_metadata() {",
          )

          evidence = "crates/open-kioku-evidence/src/lib.rs"
          replace_once(
              evidence,
              "        GraphEdgeType::Calls => {",
              "        GraphEdgeType::UsesType => {\n            exact_target\n                || (receiver_type && (qualified_name || same_scope))\n                || (import_binding && qualified_name)\n        }\n        GraphEdgeType::Calls => {",
          )
          replace_once(
              evidence,
              "    #[test]\n    fn unique_import_binding_proves_import_relationship() {",
              "    #[test]\n    fn exact_reference_proves_uses_type_relationship() {\n        let proofs = vec![proof(RelationshipProofKind::ExactReference, 1)];\n        assert_eq!(\n            relationship_authority(&GraphEdgeType::UsesType, &proofs),\n            RelationshipAuthority::Authoritative\n        );\n    }\n\n    #[test]\n    fn receiver_type_alone_does_not_prove_uses_type_target() {\n        let proofs = vec![proof(RelationshipProofKind::ReceiverType, 1)];\n        assert_eq!(\n            relationship_authority(&GraphEdgeType::UsesType, &proofs),\n            RelationshipAuthority::Corroborating\n        );\n    }\n\n    #[test]\n    fn receiver_type_plus_unique_name_proves_uses_type_target() {\n        let proofs = vec![\n            proof(RelationshipProofKind::ReceiverType, 1),\n            proof(RelationshipProofKind::QualifiedName, 1),\n        ];\n        assert_eq!(\n            relationship_authority(&GraphEdgeType::UsesType, &proofs),\n            RelationshipAuthority::Authoritative\n        );\n    }\n\n    #[test]\n    fn unique_import_binding_proves_import_relationship() {",
          )

          schema = "crates/open-kioku-graph/src/schema.rs"
          replace_once(
              schema,
              "        \"References\",\n        \"Calls\",",
              "        \"References\",\n        \"UsesType\",\n        \"Calls\",",
          )
          replace_once(
              schema,
              "            \"service_boundaries\".to_string(),\n            \"read_only_graph_query\".to_string(),",
              "            \"service_boundaries\".to_string(),\n            \"relationship_proofs\".to_string(),\n            \"read_only_graph_query\".to_string(),",
          )
          replace_once(
              schema,
              "        assert_eq!(schema1.edge_types.len(), 27);",
              "        assert_eq!(schema1.edge_types.len(), 28);\n        assert!(schema1.edge_types.iter().any(|edge| edge.name == \"UsesType\"));\n        assert!(schema1.feature_flags.contains(&\"relationship_proofs\".to_string()));",
          )

      - name: Format and targeted test
        run: |
          cargo fmt --all
          cargo test -p open-kioku-core -p open-kioku-evidence -p open-kioku-graph

      - name: Commit structural patch and remove one-shot workflow
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/ri3-one-shot-patch.yml
          git add crates/open-kioku-core/src/lib.rs crates/open-kioku-evidence/src/lib.rs crates/open-kioku-graph/src/schema.rs
          git commit -m "feat(ri3): add USES_TYPE relationship authority contract"
          git push origin HEAD:agent/ri3-core-relationship-proofs
