name: RI3 relationship benchmark docs clean

on:
  push:
    branches:
      - agent/ri3-relationship-conformance-benchmark

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-relationship-conformance-benchmark
          fetch-depth: 0

      - name: Apply command inventory update
        run: python3 scripts/ri3_relationship_bench_docs_clean_tmp.py

      - name: Validate docs and CLI contract
        run: |
          chmod +x scripts/validate-docs.sh
          scripts/validate-docs.sh
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-cli --all-targets -- -D warnings
          cargo test -p open-kioku-cli

      - name: Commit only validated README change
        run: |
          cp README.md /tmp/README.ri3-validated.md
          git restore --worktree --staged .
          cp /tmp/README.ri3-validated.md README.md
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-relationship-bench-docs-clean.yml \
            scripts/ri3_relationship_bench_docs_clean_tmp.py
          git add README.md
          git commit -m "docs: inventory relationship benchmark command"
          git pull --rebase origin agent/ri3-relationship-conformance-benchmark
          git push origin HEAD:agent/ri3-relationship-conformance-benchmark
