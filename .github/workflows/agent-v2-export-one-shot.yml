name: Agent V2 export ambiguity cleanup

on:
  push:
    branches:
      - agent/v2-semantic-resolution-pipeline
    paths:
      - .github/workflows/agent-v2-export-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-resolution-pipeline
          fetch-depth: 0

      - name: Apply exact export ambiguity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/open-kioku-ingest/src/lib.rs')
          text = path.read_text()
          start_marker = 'origin_symbol: exp.local_name.as_ref().and_then(|local| {'
          end_marker = 'source_module: Some(mod_id),'
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected exactly one export origin marker, found {text.count(start_marker)}')
          start = text.index(start_marker)
          line_start = text.rfind('\n', 0, start) + 1
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('export source_module end marker not found after origin block')
          replacement = '''                    origin_symbol: exp.local_name.as_ref().and_then(|local| {
                        let candidates = symbol_index
                            .by_file
                            .get(&exp.file_id)
                            .into_iter()
                            .flatten()
                            .filter(|id| {
                                symbol_index
                                    .get(id)
                                    .map(|s| s.name == *local)
                                    .unwrap_or(false)
                            })
                            .cloned()
                            .collect::<Vec<_>>();
                        match candidates.as_slice() {
                            [candidate] => Some(candidate.clone()),
                            _ => None,
                        }
                    }),
                    '''
          path.write_text(text[:line_start] + replacement + text[end:])
          Path('.github/workflows/agent-v2-export-one-shot.yml').unlink()
          PY

      - name: Format workspace
        run: cargo fmt --all

      - name: Verify patch shape
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "open-kioku-agent"
          git config user.email "open-kioku-agent@users.noreply.github.com"
          git add crates/open-kioku-ingest/src/lib.rs .github/workflows/agent-v2-export-one-shot.yml
          git commit -m "fix(intelligence): fail closed on ambiguous export origins"
          git push origin HEAD:agent/v2-semantic-resolution-pipeline
