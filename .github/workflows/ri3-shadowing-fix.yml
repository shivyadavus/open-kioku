name: RI3 bare-call shadowing fix

on:
  push:
    branches:
      - agent/ri3-frozen-conformance
    paths:
      - .github/workflows/ri3-shadowing-fix.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-frozen-conformance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Fail closed when a local binding shadows a bare callee
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/open-kioku-resolution/src/bare_calls.rs')
          s = p.read_text()
          anchor = '''pub(crate) fn resolve_bare_call_outcome(
              call: &CallSite,
              ctx: &ResolutionContext<'_>,
          ) -> ResolutionOutcome {
              if let Some(candidates) = nearest_lexical_scope_candidates(call, ctx) {'''.replace('          ', '')
          replacement = '''pub(crate) fn resolve_bare_call_outcome(
              call: &CallSite,
              ctx: &ResolutionContext<'_>,
          ) -> ResolutionOutcome {
              // A lexical value binding with the same name shadows any function/import symbol.
              // Until a callable value binding can itself be proven to a unique target, fail
              // closed rather than emitting a structural CALLS edge to an unrelated symbol.
              if ctx
                  .bindings
                  .resolve_before(&call.scope_id, &call.callee_name, &call.range, ctx.scopes)
                  .is_some()
              {
                  return evaluate_candidates(&GraphEdgeType::Calls, Vec::new());
              }

              if let Some(candidates) = nearest_lexical_scope_candidates(call, ctx) {'''.replace('          ', '')
          if anchor not in s:
              raise SystemExit('bare call entry anchor not found')
          s = s.replace(anchor, replacement, 1)
          old_import = '''        CallSiteId, FileId, Language, ReceiverKind, Scope, ScopeId, ScopeKind, SourceRange, Symbol,
        SymbolKind, Visibility,
'''
          new_import = '''        Binding, BindingId, CallSiteId, FileId, Language, ReceiverKind, Scope, ScopeId, ScopeKind,
        SourceRange, Symbol, SymbolKind, Visibility,
'''
          if old_import not in s:
              raise SystemExit('test import anchor not found')
          s = s.replace(old_import, new_import, 1)
          test_anchor = '''    #[test]
    fn same_file_name_only_candidate_is_not_structural_truth() {'''
          regression = '''    #[test]
    fn lexical_value_binding_shadows_same_named_function() {
        let file_id = FileId::new("file:src/lib.rs");
        let scopes = ScopeIndex::build(vec![Scope {
            id: ScopeId::new("scope:file"),
            file_id: file_id.clone(),
            parent_id: None,
            owner_symbol_id: None,
            kind: ScopeKind::File,
            range: SourceRange {
                start_line: 1,
                start_column: 1,
                end_line: 50,
                end_column: 1,
            },
        }]);
        let symbol_index = SymbolIndex::build(vec![symbol(
            "symbol:run",
            "run",
            "file:src/lib.rs",
            Some("scope:file"),
        )]);
        let bindings = BindingIndex::build(vec![Binding {
            id: BindingId::new("binding:run"),
            file_id: file_id.clone(),
            scope_id: ScopeId::new("scope:file"),
            name: "run".into(),
            declared_type: None,
            inferred_type: None,
            range: SourceRange {
                start_line: 10,
                start_column: 5,
                end_line: 10,
                end_column: 8,
            },
        }]);
        let inheritance = InheritanceIndex::build(Vec::new());
        let repository = open_kioku_semantic_model::SemanticRepository::new();
        let semantics = open_kioku_languages::semantics_for(&Language::Rust).unwrap();
        let context = ResolutionContext::new(
            &file_id,
            std::path::Path::new("src/lib.rs"),
            None,
            Language::Rust,
            &repository,
            &symbol_index,
            &scopes,
            &bindings,
            &inheritance,
            semantics,
        );
        match resolve_bare_call_outcome(&bare_call(), &context) {
            ResolutionOutcome::Unresolved { candidates, .. } => assert!(candidates.is_empty()),
            other => panic!("shadowed bare call must fail closed, got {other:?}"),
        }
    }

    #[test]
    fn same_file_name_only_candidate_is_not_structural_truth() {'''
          if test_anchor not in s:
              raise SystemExit('test insertion anchor not found')
          s = s.replace(test_anchor, regression, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Validate resolver fix
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p open-kioku-resolution --all-targets -- -D warnings
          cargo test -p open-kioku-resolution bare_calls -- --nocapture
      - name: Run full frozen relationship release policy
        run: |
          set -euo pipefail
          cargo run -p open-kioku-cli -- --json relationship-bench \
            --corpus benchmarks/relationship-cases.json \
            --observations @live \
            --policy benchmarks/relationship-thresholds.json \
            --enforce-gates \
            --write /tmp/relationship-shadow-fix-report.json
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-resolution/src/bare_calls.rs
          git diff --cached --check
          git commit -m "fix(resolution): respect lexical value shadowing in bare calls"
          git push origin HEAD:agent/ri3-frozen-conformance
