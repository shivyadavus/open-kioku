name: RI3 inheritance relationships

on:
  push:
    branches:
      - agent/ri3-proof-gated-resolution

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-proof-gated-resolution
          fetch-depth: 0

      - name: Apply proof-gated inheritance relationships
        run: python3 scripts/ri3_inheritance_relationships_tmp.py

      - name: Validate inheritance trust boundary
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph --all-targets -- -D warnings
          cargo test -p open-kioku-core -p open-kioku-resolution -p open-kioku-ingest -p open-kioku-graph

      - name: Commit validated inheritance relationships and remove helpers
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -f \
            .github/workflows/ri3-inheritance-relationships.yml \
            scripts/ri3_inheritance_relationships_tmp.py
          git add \
            crates/open-kioku-resolution/src/inheritance.rs \
            crates/open-kioku-core/src/relationship.rs \
            crates/open-kioku-ingest/src/lib.rs \
            crates/open-kioku-graph/src/lib.rs
          git commit -m "ri3: emit proof-gated inheritance relationships"
          git push origin HEAD:agent/ri3-proof-gated-resolution
