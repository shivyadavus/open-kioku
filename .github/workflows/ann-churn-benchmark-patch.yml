name: ANN churn benchmark patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/cc5-ann-churn-benchmark' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and exercise ANN churn source only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          OK_ANN_CHURN_INITIAL_VECTORS=2000 \
          OK_ANN_CHURN_DIMS=384 \
          OK_ANN_CHURN_CYCLES=3 \
          OK_ANN_CHURN_MUTATIONS_PER_CYCLE=100 \
          OK_ANN_CHURN_QUERIES=8 \
            cargo run -p open-kioku-vector --example ann_churn_matrix --release \
            > /tmp/ann-churn.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/ann-churn.json'))
          assert report['overall']['total_mutations'] == 300
          assert report['policy']['passed'], report['policy']['reasons']
          for cycle in report['measurements']:
              assert cycle['stored_vectors'] == cycle['live_vectors']
              assert cycle['stale_or_deleted_hits'] == 0
              assert cycle['stale_identity_hits'] == 0
              assert cycle['duplicate_hit_ids'] == 0
          print(json.dumps(report['overall'], sort_keys=True))
          PY

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "ANN churn source is already formatted"
            exit 0
          fi
          if [[ "$changed" != "crates/open-kioku-vector/examples/ann_churn_matrix.rs" ]]; then
            echo "Unexpected rustfmt changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/open-kioku-vector/examples/ann_churn_matrix.rs
          git commit -m "style(vector): apply rustfmt to ANN churn benchmark"
          git push origin HEAD:${{ github.head_ref }}
