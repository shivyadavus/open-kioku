name: RI3 freeze approved relationship baseline

on:
  push:
    branches:
      - agent/ri3-frozen-conformance
    paths:
      - .github/workflows/ri3-freeze-baseline.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-frozen-conformance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build exact benchmark binary
        run: cargo build --release -p open-kioku-cli
      - name: Run frozen release corpus twice
        run: |
          set -euo pipefail
          target/release/ok --json relationship-bench \
            --corpus benchmarks/relationship-cases.json \
            --observations @live \
            --policy benchmarks/relationship-thresholds.json \
            --enforce-gates \
            --write /tmp/relationship-first.json
          target/release/ok --json relationship-bench \
            --corpus benchmarks/relationship-cases.json \
            --observations @live \
            --policy benchmarks/relationship-thresholds.json \
            --enforce-gates \
            --write /tmp/relationship-second.json
      - name: Freeze and verify deterministic projection
        run: |
          set -euo pipefail
          python3 scripts/validate-relationship-baseline.py \
            /tmp/relationship-first.json benchmarks/relationship-baseline.json --write
          python3 scripts/validate-relationship-baseline.py \
            /tmp/relationship-second.json benchmarks/relationship-baseline.json
          git diff --check
      - name: Commit first approved V3 baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/relationship-baseline.json
          git commit -m "bench(ri3): freeze first approved relationship baseline"
          git push origin HEAD:agent/ri3-frozen-conformance
