name: agent-cc3-self-review
on:
  push:
    branches: [agent/cc3-token-budget]
permissions:
  contents: write
jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc3-token-budget
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply self-review fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/open-kioku-context/src/lib.rs')
          s=p.read_text()
          s=s.replace('let mut best: Option<(usize, f32, usize, std::collections::BTreeSet<String>)> = None;', 'let mut best: Option<(usize, u8, f32, usize, std::collections::BTreeSet<String>)> = None;', 1)
          s=s.replace('''            match &best {\n                Some((best_index, best_utility, _, _))\n                    if *best_utility > utility\n                        || (*best_utility == utility && *best_index < index) => {}\n                _ => best = Some((index, utility, tokens, token_set)),\n            }\n''', '''            let safety_priority = if authority == RetrievalAuthority::Exact {\n                2\n            } else if sources.contains(&RetrievalSourceKind::Validation)\n                || sources.contains(&RetrievalSourceKind::Graph)\n            {\n                1\n            } else {\n                0\n            };\n            match &best {\n                Some((best_index, best_priority, best_utility, _, _))\n                    if *best_priority > safety_priority\n                        || (*best_priority == safety_priority\n                            && (*best_utility > utility\n                                || (*best_utility == utility && *best_index < index))) => {}\n                _ => best = Some((index, safety_priority, utility, tokens, token_set)),\n            }\n''', 1)
          s=s.replace('let Some((index, _utility, tokens, token_set)) = best else {', 'let Some((index, _priority, _utility, tokens, token_set)) = best else {', 1)
          marker='''    #[test]\n    fn token_selection_preserves_document_section_range_and_dedupes_redundant_units() {\n'''
          test='''    #[test]\n    fn exact_evidence_cannot_be_displaced_by_many_cheaper_heuristics() {\n        let exact = SearchResult {\n            path: "src/exact_target.rs".into(),\n            line_range: Some(LineRange { start: 20, end: 24 }),\n            snippet: "fn exact_target() { validate_boundary(); }".into(),\n            symbol: None,\n            score: 0.01,\n            match_reason: "exact symbol evidence".into(),\n            evidence: Vec::new(),\n            evidence_refs: vec!["symbol:exact-target".into()],\n            confidence: 1.0,\n            score_breakdown: Vec::new(),\n        };\n        let mut ranked = (0..8)\n            .map(|index| SearchResult {\n                path: format!("src/cheap_{index}.rs").into(),\n                line_range: None,\n                snippet: "tiny semantic candidate".into(),\n                symbol: None,\n                score: 100.0 - index as f32,\n                match_reason: "heuristic semantic similarity".into(),\n                evidence: Vec::new(),\n                evidence_refs: Vec::new(),\n                confidence: 0.5,\n                score_breakdown: Vec::new(),\n            })\n            .collect::<Vec<_>>();\n        ranked.push(exact.clone());\n        let mut diagnostics = RetrievalDiagnostics {\n            traces: vec![open_kioku_core::RetrievalTrace {\n                path: exact.path.clone(),\n                fused_score: exact.score,\n                authority: RetrievalAuthority::Exact,\n                contributions: Vec::new(),\n            }],\n            ..Default::default()\n        };\n        let budget = ContextBudget {\n            max_tokens: 300,\n            reserve_for_instructions: 100,\n            reserve_for_validation: 100,\n            max_per_file: 2,\n            max_primary_files: 1,\n        };\n        let selected = select_context_units(ranked, &budget, &mut diagnostics);\n        assert_eq!(selected.len(), 1);\n        assert_eq!(selected[0].path, exact.path);\n    }\n\n    #[test]\n    fn token_selection_preserves_document_section_range_and_dedupes_redundant_units() {\n'''
          if marker not in s: raise SystemExit('test insertion marker missing')
          s=s.replace(marker,test,1)
          p.write_text(s)
          PY
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all
          cargo test -p open-kioku-tests
      - name: Commit product fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-cc3-self-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/open-kioku-context/src/lib.rs .github/workflows/agent-cc3-self-review.yml
          git commit -m 'fix(context): preserve safety evidence under token budgets'
          git push origin HEAD:agent/cc3-token-budget
