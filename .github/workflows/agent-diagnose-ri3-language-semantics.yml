name: agent-diagnose-ri3-language-semantics

on:
  push:
    branches:
      - agent/ri3-language-semantics-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run full workspace tests
        id: workspace
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --all -- --nocapture 2>&1 | tee workspace-test.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri3-language-semantics-full-diagnostics
          path: workspace-test.log
          if-no-files-found: error
      - name: Preserve failure result
        if: steps.workspace.outcome != 'success'
        run: exit 1
