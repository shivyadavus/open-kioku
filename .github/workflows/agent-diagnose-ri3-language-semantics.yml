name: agent-diagnose-ri3-language-semantics

on:
  push:
    branches:
      - agent/ri3-language-semantics-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run focused resolution tests
        id: resolution
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p open-kioku-resolution -- --nocapture 2>&1 | tee resolution-test.log
      - name: Run focused tree-sitter tests
        id: tree_sitter
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p open-kioku-tree-sitter -- --nocapture 2>&1 | tee tree-sitter-test.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri3-language-semantics-diagnostics
          path: |
            resolution-test.log
            tree-sitter-test.log
          if-no-files-found: error
      - name: Preserve failure result
        if: steps.resolution.outcome != 'success' || steps.tree_sitter.outcome != 'success'
        run: exit 1
