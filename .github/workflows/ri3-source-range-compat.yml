name: RI3 source range compatibility

on:
  push:
    branches:
      - agent/ri3-resolution-foundation
    paths:
      - scripts/ri3_source_range_compat_tmp.py
      - .github/workflows/ri3-source-range-compat.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ri3-resolution-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply compatibility fix
        run: python3 scripts/ri3_source_range_compat_tmp.py
      - name: Validate workspace compatibility
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -p open-kioku-impact -p open-kioku-storage-sqlite
          git diff --check
      - name: Commit validated product fix and self-clean
        run: |
          git config user.name "open-kioku automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/open-kioku-impact/src/lib.rs crates/open-kioku-storage-sqlite/src/lib.rs
          git diff --cached --quiet && { echo "expected product change missing" >&2; exit 1; }
          git commit -m "fix: preserve occurrence range compatibility"
          git rm scripts/ri3_source_range_compat_tmp.py .github/workflows/ri3-source-range-compat.yml
          git commit -m "chore: remove RI3 source range compatibility gate"
          git push origin HEAD:agent/ri3-resolution-foundation
