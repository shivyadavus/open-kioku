[package]
name = "open-kioku-resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic symbol and relationship resolution for Open Kioku code intelligence"

[dependencies]
open-kioku-core = { version = "3.0.2", path = "../open-kioku-core" }
open-kioku-errors = { version = "3.0.2", path = "../open-kioku-errors" }
open-kioku-languages = { version = "3.0.2", path = "../open-kioku-languages" }
open-kioku-semantic-model = { version = "3.0.2", path = "../open-kioku-semantic-model" }
serde = { workspace = true, features = ["derive"] }
smallvec = "1"
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
